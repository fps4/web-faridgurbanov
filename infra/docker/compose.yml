# faridgurbanov.com — Compose stack for the ds1 Docker host.
#
# One service: the static site served by nginx (ADR-0001). The image is built from the repo root
# context via infra/docker/web.Dockerfile. A reverse proxy on ds1 terminates TLS and routes
# faridgurbanov.com (and the parked faridgurbanov.nl → /training) to WEB_PORT.
#
# Deploy on ds1 (run by the self-hosted runner, or manually on the host):
#   docker compose -f infra/docker/compose.yml up -d --build
name: faridgurbanov-site

services:
  web:
    image: faridgurbanov-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://faridgurbanov.com}
    container_name: faridgurbanov-web
    restart: unless-stopped
    ports:
      # webapp on 3035 on both the host and inside the container. Published on the LAN by default so
      # the site is reachable at ds1:3035; set WEB_BIND=127.0.0.1 in the host .env for loopback only
      # (e.g. when a reverse proxy fronts it).
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3035}:3035"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3035/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
