# Serve the Next.js static export (output: 'export'). The export emits per-route .html files
# (e.g. /en -> en.html, /en/about -> en/about.html), so resolve clean URLs to their .html.
server {
    listen 3035;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects carry a path-only Location, so the port nginx listens on inside the container
    # never leaks to a visitor behind the host proxy.
    absolute_redirect off;

    # Clean URLs → static .html / directory index; 404 otherwise.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Writing moved under Practice (FS-0013): the index to the section landing, each article to
    # /practice/articles/<slug>. Slugs did not change, so one rule per shape covers every old URL
    # (lib/redirects.test.ts checks each published article against these). Regex locations match
    # in file order, so these sit above the .html rule.
    location ~ ^/(en|nl)/writing(?:\.html|/)?$ {
        return 301 /$1/practice$is_args$args;
    }
    location ~ ^/(en|nl)/writing/([a-z0-9-]+)(?:\.html|/)?$ {
        return 301 /$1/practice/articles/$2$is_args$args;
    }

    # Next's hashed assets are immutable — cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    # Don't cache the HTML documents themselves (content can change on each deploy).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
