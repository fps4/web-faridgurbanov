# Serve the Next.js static export (output: 'export'). The export emits per-route .html files
# (e.g. /en -> en.html, /en/about -> en/about.html), so resolve clean URLs to their .html.
server {
    listen 3035;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs → static .html / directory index; 404 otherwise.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Next's hashed assets are immutable — cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    # Don't cache the HTML documents themselves (content can change on each deploy).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
