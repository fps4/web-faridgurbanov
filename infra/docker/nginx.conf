# Serve the Next.js static export (output: 'export'). The export emits per-route .html files
# (e.g. /en -> en.html, /en/about -> en/about.html), so resolve clean URLs to their .html.
server {
    listen 3035;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects carry a path-only Location, so the port nginx listens on inside the container
    # never leaks to a visitor behind the host proxy.
    absolute_redirect off;

    # Clean URLs → static .html / directory index; 404 otherwise.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Writing moved under Practice (FS-0013): the index to the section landing, each article to
    # /practice/articles/<slug>. Slugs did not change, so one rule per shape covers every old URL
    # (lib/redirects.test.ts checks each published article against these). Regex locations match
    # in file order, so these sit above the .html rule.
    location ~ ^/(en|nl)/writing(?:\.html|/)?$ {
        return 301 /$1/practice$is_args$args;
    }
    location ~ ^/(en|nl)/writing/([a-z0-9-]+)(?:\.html|/)?$ {
        return 301 /$1/practice/articles/$2$is_args$args;
    }

    # Learning, Portfolio and Training are removed (decision art-896t5kxfka, maestro story
    # art-y97cjsakwq): every address under them, in both locales, with its trailing-slash and .html
    # forms, goes to Work. Expertise is removed too: its addresses go to the home page. These sit
    # above the .html rule below for the same reason as the /writing ones.
    location ~ ^/(en|nl)/(?:learning|portfolio|training)(?:\.html|/.*)?$ {
        return 301 /$1/work$is_args$args;
    }
    location ~ ^/(en|nl)/expertise(?:\.html|/.*)?$ {
        return 301 /$1$is_args$args;
    }

    # The Integration platform case study is the Integration adapter (decision art-896t5kxfka, maestro
    # story art-dgsmfy8yb8): its old address, in both locales and in its trailing-slash and .html
    # forms, goes to the new one. Above the .html rule below for the same reason as the ones above.
    location ~ ^/(en|nl)/work/integration-platform(?:\.html|/)?$ {
        return 301 /$1/work/integration-adapter$is_args$args;
    }

    # The three earlier case studies are removed (decision art-896t5kxfka, maestro story
    # art-vvzsw9ap9e); their work is now a line in the Earlier work list on /work. Each address, in
    # both locales and in its trailing-slash and .html forms, goes to that list: the Location header
    # carries the fragment, which the browser keeps and nginx never sees (a request has none). The
    # query string comes before it. Above the .html rule below for the same reason as the ones above.
    location ~ ^/(en|nl)/work/(?:cloudera-kafka|sap-snowflake|sap-event-backbone)(?:\.html|/)?$ {
        return 301 /$1/work$is_args$args#earlier-work;
    }

    # Next's hashed assets are immutable — cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    # Don't cache the HTML documents themselves (content can change on each deploy).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
