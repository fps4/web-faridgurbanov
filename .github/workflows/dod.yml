name: dod

# Definition-of-Done quality gate, aligned with the fps4 cross-repo standard (cf. ../maestro and
# ../sovereign-copilot dod.yml). Runs on every PR (the test gate) and on push to main (so the
# deploy chains off a green run). The site is a static-export Next.js app (output: 'export'),
# installed with npm from the public registry — no private registry, no secrets needed to build.
#
# Two jobs run in parallel:
#   * secret-scan — the fps4 security floor (gitleaks). NEVER disabled, across every repo.
#   * build-test  — lint, unit/component tests, and the static export (asserts out/ is emitted).
# Both must be green for the deploy (deploy-ds1.yml) to chain off this workflow on main.
#
# NOTE: the app is expected at the repo root. If it is scaffolded under web/, set
# `working-directory: web` on build-test.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR/branch supersedes in-flight runs.
concurrency:
  group: dod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan: # fps4 security floor — never disabled. Blocks credentials reaching git.
    runs-on: [self-hosted, ds1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan sees every commit on the ref
      - name: gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=/github/workspace --no-banner --redact

  build-test:
    name: lint • test • static build
    runs-on: [self-hosted, ds1]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint --if-present

      - name: unit / component tests
        run: npm test --if-present

      - name: e2e (merge to main only)
        if: github.event_name == 'push'
        run: npm run test:e2e --if-present

      - name: static build
        run: npm run build

      - name: assert a static export was emitted
        run: |
          test -d out || {
            echo "::error::npm run build did not emit a static export under out/ (output:'export' is required)"
            exit 1
          }

  dependency-scan: # fps4 security floor (standards/security.yaml) — the advisory-DB vuln scan, BLOCKING.
    # DISTINCT from secret-scan: this asks "is a package we depend on known-bad?". Trivy filesystem scan
    # on HIGH,CRITICAL with --ignore-unfixed (only actionable advisories gate, so transitive unfixed noise
    # never red-walls a PR). Never disabled. A product that ships an image SHOULD also add a `scan-type:
    # image` scan of the built tag (cf. ../maestro dod.yml) to catch pinned transitives this fs scan can't.
    runs-on: [self-hosted, ds1]
    steps:
      - uses: actions/checkout@v4
      - name: cache the trivy vuln DB # warm-start so a registry blip/rate-limit doesn't flake the gate
        uses: actions/cache@v4
        with:
          path: .cache/trivy
          key: trivy-db
      - name: trivy filesystem scan (deps, IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"          # BLOCKING — a fixable HIGH/CRITICAL fails the gate
          format: table
        env:
          TRIVY_CACHE_DIR: .cache/trivy
