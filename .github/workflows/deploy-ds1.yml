name: deploy-ds1

# Continuous deployment of the static site to the ds1 Docker host, aligned with the fps4 cross-repo
# standard (cf. ../maestro and ../sovereign-copilot deploy-ds1.yml).
#
# Why this shape:
# * ds1 is on a private LAN — GitHub-hosted runners can't reach it. The deploy runs on the
#   self-hosted ds1 runner (labels: self-hosted, ds1), a CONTAINERISED runner with only the host
#   Docker socket mounted, so `docker compose` here drives ds1's own daemon. No SSH.
# * Because the runner is socket-only (no shared network with the stack), health is read from the
#   daemon via `docker inspect` — NOT curl to a host port the runner can't reach.
# * Deploy only AFTER the `dod` gates pass on main: chained via `workflow_run` (filtered to main);
#   the job runs only when that run concluded `success` for a push to `main` (i.e. a merged PR).
#   `workflow_dispatch` allows a manual redeploy.
# * The app is a static export (output: 'export', ADR-0001); the image (infra/docker/web.Dockerfile)
#   builds it and serves it from nginx. `docker compose up -d --build` rebuilds and recreates. There
#   are no secrets — a static site has no runtime config beyond the public NEXT_PUBLIC_SITE_URL.
#
# Optional repo configuration (Settings → Secrets and variables → Actions → Variables):
#   SITE_HEALTHCHECK_URL   public URL to smoke-check after deploy (skipped if unset)

on:
  workflow_run:
    workflows: [dod]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ds1
  cancel-in-progress: false # queue rather than cancel a deploy mid-flight

permissions:
  contents: read

jobs:
  deploy:
    # Manual dispatch always deploys; the chained path only on a green dod run for a push to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, ds1]
    timeout-minutes: 30
    steps:
      - name: checkout the deployed commit
        uses: actions/checkout@v4
        with:
          # workflow_run doesn't checkout the triggering commit by default — pin to the exact main
          # SHA the DoD validated. Manual runs fall back to the ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: tooling present
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: deploy — build the static-site image and recreate the container
        run: |
          # Honor the host-local .env (IMAGE_TAG, WEB_BIND/WEB_PORT, NEXT_PUBLIC_SITE_URL) if the
          # host has one; otherwise compose's in-file defaults apply.
          envflag=""
          [ -f infra/docker/.env ] && envflag="--env-file infra/docker/.env"
          docker compose $envflag -f infra/docker/compose.yml up -d --build --remove-orphans web

      - name: wait for health (via docker inspect over the socket)
        run: |
          ok=0
          for i in $(seq 1 24); do # up to ~2 min
            s=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' faridgurbanov-web 2>/dev/null || echo missing)
            echo "faridgurbanov-web health=$s"
            [ "$s" = "healthy" ] && { ok=1; break; }
            [ "$s" = "missing" ] && { echo "::error::faridgurbanov-web container not found"; break; }
            sleep 5
          done
          docker logs --tail 20 faridgurbanov-web 2>&1 | tail -20 || true
          [ "$ok" = 1 ] || { echo "::error::faridgurbanov-web did not become healthy"; exit 1; }

      - name: smoke check (optional — public URL)
        run: |
          url="${{ vars.SITE_HEALTHCHECK_URL }}"
          if [ -z "$url" ]; then
            echo "SITE_HEALTHCHECK_URL not set — skipping HTTP smoke check"; exit 0
          fi
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "$url" || true)
          echo "GET $url -> $code"
          [ "$code" = "200" ] || { echo "::error::smoke check failed (HTTP $code)"; exit 1; }

      - name: prune dangling images (always)
        if: always()
        run: docker image prune -f || true

      - name: deployed revision
        if: success()
        run: echo "ds1 now running ${GITHUB_SHA::12} (from ${GITHUB_REF_NAME})"
