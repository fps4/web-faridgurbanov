text:
  # The title card; the question and the usual answer.
  episode: "AI Product Design · Module 3 · Episode 3.12"
  question: "“What does the model cost?”"
  answer: "a cloud bill, or a licence price"
  answer-tag: "one number"

  # Strubell et al.: one research project, three compute costs.
  title-strubell: "One research project, three costs"
  value-run: "$52–175"
  value-tune: "$1,238–4,205"
  value-full: "$103k–350k"
  label-run: "one training run"
  label-tune: "tuning on a new dataset"
  label-full: "the full R&D: 4,789 jobs, about six months"
  strubell-credit: "Strubell, Ganesh & McCallum (2019), Table 4: estimated compute cost of one NLP research project."
  lesson: "The cost is in the runs around the model."
  lesson-only: "Compute only. No people, no data."

  # Werkmora and the board's question.
  title-werkmora: "Werkmora"
  werkmora-tag: "fictional company"
  werkmora: "A garden retailer with about 175 stores. This module: the nightly forecast of what every store sells, per garden item."
  board: "The board: “What does the forecast cost?”"
  first-answer: "First answer: the cloud bill of the data science workspace."

  # The cost lines, one row per click, each with Werkmora's driver.
  title-lines: "The cost lines"
  lines-tag: "fictional drivers"
  line-data: "Data acquisition"
  line-data-werkmora: "weather licence for ≈ 175 store locations, plus a history of past forecasts"
  line-labels: "Labelling"
  line-labels-werkmora: "stock-out flags, plant write-offs, promotion flags corrected"
  labels-quote: "“the most under-valued and de-glamorised aspect of AI”"
  labels-credit: "Sambasivan et al. (2021)"
  labels-tool: "Model-assisted labelling: 34 → 14 s per mask (a vision example)"
  labels-tool-credit: "Kirillov et al. (2023), Segment Anything"
  line-training: "Training, experiments"
  line-training-werkmora: "backtests against 3 baselines, ≈ 32 retrains a year, extra runs"
  training-note: "Count every run."
  line-inference: "Inference"
  line-inference-werkmora: "one nightly batch: ≈ 0.75m series, later ≈ 5.4m, 01:00–04:00"
  inference-note: "The line the cloud bill shows."
  line-people: "People"
  line-people-werkmora: "4 data scientists, data engineers, replenishment team time, on-call"
  people-quote: "“this is people’s jobs now”"
  people-credit: "Shankar et al. (2024), on monitoring"
  line-debt: "Maintenance, debt"
  line-debt-werkmora: "9 sources, 7 owners, old file transfers, a legacy broker, the ERP fallback"
  debt-title: "ML technical debt"
  debt-cace: "entanglement: change anything, change everything"
  debt-data: "data dependencies"
  debt-loops: "feedback loops"
  debt-glue: "glue code, pipeline jungles"
  debt-config: "configuration"
  debt-world: "a changing world"
