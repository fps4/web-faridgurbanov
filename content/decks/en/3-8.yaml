# Episode 3.8 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-8.ts. Under `npm run dev`
# a refresh of /en/deck/3-8 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/08-non-functional-requirements.slides.md.
# Times assume about 125 words a minute; adjust them after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-8.ts as well.

title: "Non-functional requirements"

steps:
  title:
    at: "0:00"
    cue: "Episode 3.8 of AI Product Design: non-functional requirements."
  promise:
    at: "0:04"
    cue: "In this episode: the nine non-functional requirements of a model, how they change in a nightly batch, and a fallback for when the model is down or unsure."
  usual:
    at: "0:18"
    cue: "Most requirement pages for a model have one line: how accurate it must be. The rest of the page stays empty."
  golive:
    at: "0:29"
    cue: "Then go-live comes, and the other questions turn up. How fast? What does it cost? May the data leave? Why this answer? And what if it is down?"
  refused:
    at: "0:43"
    cue: "One of those questions went to court. In Austria, a phone operator refused someone a contract of ten euros a month, based on an automated credit assessment by Dun & Bradstreet. What may that person learn about how the result was reached?"
  court:
    at: "1:03"
    cue: "In 2025 the EU’s highest court answered: the person may learn the procedure and principles that were applied. “The mere communication of a complex mathematical formula, such as an algorithm” is not enough. And in SCHUFA, the same court said that a score a company draws strongly on is an automated decision."
  logged:
    at: "1:29"
    cue: "For an engineer, that is a requirement on the system: what do we keep for each decision, so we can explain one result to one person, months later?"
  werkmora:
    at: "1:43"
    cue: "Now our company. Werkmora is a fictional garden retailer with about 175 stores. Every night it forecasts how much of each garden item every store needs, for the store orders. The pilot’s only requirement: more accurate than today’s ERP forecast."
  nine:
    at: "2:03"
    cue: "So let’s fill the page. A model has nine non-functional requirements, like any service, and each one needs a number and an owner."
  latency:
    at: "2:14"
    cue: "Start with speed. Latency has a price: in a randomised experiment at Booking.com, about 30 percent more latency cost more than half a percent in conversion. Precomputing and caching were among their answers."
  window:
    at: "2:30"
    cue: "Werkmora’s forecast is a nightly batch, so latency becomes a window. Weather arrives at midnight, sales by half past twelve, the run goes from one to four, orders are ready at five, and the cut-off is six."
  throughput:
    at: "2:49"
    cue: "Throughput becomes series per night: about 0.75 million in the pilot, 5.4 million for the full range later. About seven times more, in the same window. The peak is the season, March to June."
  cost:
    at: "3:06"
    cue: "Cost per prediction. For a small model like this, one forecast costs almost nothing; the total is compute, pipelines and people. Generative models cost far more: one study measured 0.002 kilowatt-hours per thousand text classifications, and 0.047 for text generation."
  boundary:
    at: "3:25"
    cue: "Next, boundaries. Where does it run: cloud, on-premises, or a device? Which data may leave? Werkmora’s forecast runs in its cloud lakehouse, with no customer data in the inputs. But the weather comes from an outside provider: check its contract and licence. And confirm the lakehouse region."
  provider:
    at: "3:48"
    cue: "Count the model provider too: a prompt to a hosted language model can carry data out. Personal data leaving the EU needs a legal basis. In 2020 the EU court struck down the EU–US Privacy Shield."
  explain:
    at: "4:06"
    cue: "Explainability. For a decision about a person it is often law, as we saw. For Werkmora it is trust. A store manager asks: why forty hoses? So each order line keeps a reason, the model version and the main inputs."
  cadence:
    at: "4:26"
    cue: "Update cadence follows drift, and for a garden range the season is the drift. Retrain weekly March to August, monthly otherwise, and once more when the ERP baseline wins two weeks in a row."
  down:
    at: "4:43"
    cue: "Then the fallback, in two cases. Down: the run is late, failed, or a feed is missing. Then the ERP forecast makes the orders at five, so the model never blocks an order. And a retry alone can make a late batch later."
  unsure:
    at: "5:04"
    cue: "Unsure: the very uncertain lines go to the replenishment team. The EU AI Act asks high-risk systems for the same: “backup or fail-safe plans”. This forecast is not high-risk, but the need is the same."
  sheet:
    at: "5:21"
    cue: "So write it on one page: nine rows, a number and an owner each. Supply Chain owns the deadline, the data team the run, the COO the fallback."
  badnight:
    at: "5:35"
    cue: "Before go-live, test the bad nights: a late sales feed, a missing weather file, a run that ends at a quarter to five. Each must still end in orders by six. Then watch it like any service: run end time, stores on fallback, cost per night."
  takeaway:
    at: "5:58"
    cue: "In one card: the idea, the move, and what to do on Monday."
  next:
    at: "6:04"
    cue: "In the next episode: from prototype to production."

