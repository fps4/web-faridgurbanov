# Episode 8.2 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/8-2.ts. Under `npm run dev`
# a refresh of /en/deck/8-2 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves. The readout card's
#           rows are here too (r1-label … r3), cut from the kit's readout instructions.
# - cards:  the heading lines of the artifact cards. The experiment card's rows come from the kit
#           download, and the closing card's rows and the "In this episode" lines from
#           lib/episodes/part-8.ts, because the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/8-2.ts as well.

title: "Is review our bottleneck?"

steps:
  recap:
    at: "0:00"
    cue: "Recap: the insurer wants the clear small claims paid the same day. The business case is signed. Now it has to be built."
  promise:
    at: "0:12"
    cue: "In this episode: where the time goes when agents write the code; three numbers that show it on your own repositories; a one-page readout for your sponsor, and one experiment."
  see:
    at: "0:25"
    cue: "Your engineers got faster. Your organization didn’t."
  agents:
    at: "0:32"
    cue: "The claims IT team builds the payment path with coding agents. More code than ever, and the launch date doesn’t move. Ask why, and you get opinions."
  why:
    at: "0:50"
    cue: "(Draw the pipe.) A person starts several agents. Each one produces a change."
  changes:
    at: "0:58"
    cue: "Every change is checked by a human before it goes live. For a system that pays out money, nobody wants that check skipped."
  bucket:
    at: "1:05"
    cue: "(Draw the bucket.) So the changes wait here, in a queue in front of review."
  tap:
    at: "1:12"
    cue: "Writing got cheap. Checking did not. (Narrow the tap.) Review is still people, with the same hours in the week."
  fills:
    at: "1:20"
    cue: "When more arrives than they can take, the queue grows, and nothing else has to go wrong for that to happen."
  launch:
    at: "1:30"
    cue: "(Show the launch-date label.) The fast track waits in that bucket."
  study:
    at: "1:37"
    cue: "A study across 718 firms: after adopting coding agents, much more code, time from submit to merge up almost half, finished work not measurably up. A working paper."
  dora:
    at: "1:52"
    cue: "Google’s DORA research describes the same pattern: pockets of productivity, lost downstream."
  yours:
    at: "1:58"
    cue: "But that is other people’s data. The question is whether it is happening in yours."
  move:
    at: "2:05"
    cue: "So measure it. In about an hour, on your own repositories, with a read-only token. (Write the three numbers.)"
  wait:
    at: "2:15"
    cue: "One: how long a ready change waits for its first human review."
  queue:
    at: "2:20"
    cue: "Two: how many changes are waiting at any moment. The size of the bucket."
  size:
    at: "2:25"
    cue: "Three: how big the changes are. Big ones are slow to review and weakly reviewed."
  compare:
    at: "2:30"
    cue: "Compare a quarter before your teams used AI widely with a recent one. Per team. Never per person."
  risk:
    at: "2:40"
    cue: "Ranking people destroys the trust you need, and in the EU it can make the system high-risk."
  who:
    at: "2:50"
    cue: "(Show the readout.) The engineering lead’s move; the result goes on one page to the head of claims: what you measured, what the waiting costs, one change you propose."
  know:
    at: "3:15"
    cue: "(Show the experiment card.) Make that one change an experiment. For example, a limit on waiting changes per reviewer, two teams, six weeks, the others as comparison."
  shrinks:
    at: "3:32"
    cue: "You’ll know it worked if the bucket shrinks and nothing breaks more often. If it doesn’t, stop it. That is a result too."
  download:
    at: "3:45"
    cue: "(Mark the rows.) The check, the readout and the experiment card are linked below. The change, the comparison, and what would make you stop: write those first."
  takeaway:
    at: "4:00"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "4:20"
    cue: "In a bank it is the payments team; in a retailer, the checkout. Same bucket, same tap."

text:
  # Recap: the title card.
  episode: "AI Product Design · Part 8 · Episode 8.2"
  recap: "Our running example: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day. The business case is signed. Now it has to be built."
  recap-tag: "a worked example · fictional insurer"

  # What you see.
  title-see: "Your engineers got faster. Your organization didn’t."
  agents-line: "More code than ever. The launch date doesn’t move."

  # Why: the pipe, the bucket and the narrow tap.
  agent-1: "agent"
  agent-2: "agent"
  agent-3: "agent"
  agent-4: "agent"
  change-label: "changes"
  pr-label: "(pull requests)"
  queue-label: "queue"
  tap-label: "human review"
  live: "live"
  waiting: "waiting: 14"
  clock-label: "4 h → 2 days"
  illustrative: "illustrative numbers"
  launch: "fast-track payments: launch date"
  study: "718 firms, after adopting coding agents: much more code written, the time from submitting a change to merging it up by almost half, and finished work not measurably higher."
  study-source: "Chen & Stratton (Harvard), Bottlenecks in Software Production, working paper 2026, not yet peer-reviewed"
  dora: "The same pattern in Google’s DORA research: pockets of productivity, lost downstream."
  dora-source: "Google DORA, State of AI-assisted Software Development 2025"
  title-yours: "Is it happening in yours?"

  # The move: three numbers on the diagram.
  title-move: "Measure it: three numbers"
  move-line: "About an hour, on your own repositories, with a read-only token."
  n1: "1 · wait for a first review"
  n2: "2 · changes waiting"
  n3: "3 · size of a change"
  compare: "A quarter before AI against a recent one. Per team, never per person."
  risk: "Ranking people destroys trust, and in the EU it can make the system high-risk (AI Act, Annex III 4(b))."

  # Who and how you'll know: the readout and the experiment card.
  who-title: "One page, for the head of claims"
  know-title: "The readout, and one experiment"
  r1-label: "What we measured"
  r1: "The wait, the queue, the size: before and after."
  r2-label: "What it costs"
  r2: "Here: the fast-track launch date."
  r3-label: "The one change we propose"
  r3: "One experiment, time-boxed, with a comparison."
  know-line: "You’ll know: the bucket shrinks, and nothing breaks more often."

  # The close.
  takeaway-subtitle: "Episode 8.2 in one card"
  swap: "In a bank, the payments team. In a retailer, the checkout. Same bucket, same tap."

cards:
  readout:
    title: "Sponsor readout"
    subtitle: "One page, from the review-bottleneck check"
  experiment:
    title: "Experiment card"
    subtitle: "One change, a few teams, a fixed time · blank"
