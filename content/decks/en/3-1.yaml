text:
  # The title card; the question, the usual answer, and what the EU AI Act asks instead.
  episode: "AI Product Design · Module 3 · Episode 3.1"
  question: "“Do we have enough data to train it?”"
  answer: "“3 years of history. 60 million records a year.”"
  answer-tag: "a row count"
  act: "EU AI Act, Art. 10(3), for high-risk AI: training, validation and test data “relevant, sufficiently representative” … “in view of the intended purpose”."

  # One headline number, then the same questions by language: OpenAI o1, System Card Table 17.
  title-headline: "OpenAI o1 on the usual benchmark"
  value-all: "7.7%"
  label-all: "wrong answers, MMLU in English"
  english-only: "The headline benchmark is in English only."
  title-languages: "Same model, same questions, translated"
  value-english: "7.7%"
  value-swahili: "14.6%"
  value-yoruba: "24.6%"
  label-english: "English"
  label-swahili: "Swahili"
  label-yoruba: "Yoruba"
  web-share: "Yoruba is 0.002% of the open web. English: 42.6%."
  languages-what: "wrong answers, MMLU translated by professional translators (MMMLU)"
  languages-credit: "OpenAI o1 System Card (Dec 2024), Table 17 · Common Crawl CC-MAIN-2026-43, share of web pages by language"

  # Three use cases, with one number to know and four sources each (source · owner).
  title-cases: "Three models, three industries"
  case-retail: "Retail"
  case-retail-predicts: "Demand per store and product, 7 days ahead"
  case-retail-stat: "≈ 32%"
  case-retail-stat-what: "typical forecast error (WAPE), 898 stores, 2025"
  source-retail-1: "till sales · stores"
  source-retail-2: "stock · supply chain"
  source-retail-3: "promotions · commercial"
  source-retail-4: "weather · external"
  case-insurance: "Insurance"
  case-insurance-predicts: "Which claims to check for fraud"
  case-insurance-stat: "1 in 5"
  case-insurance-stat-what: "frauds ever detected: €2.5bn of ≈ €13bn, Europe, 2017"
  source-insurance-1: "claims · claims team"
  source-insurance-2: "policies · underwriting"
  source-insurance-3: "payments · finance"
  source-insurance-4: "findings · fraud team"
  case-manufacturing: "Manufacturing"
  case-manufacturing-predicts: "Which machine fails before its next service"
  case-manufacturing-stat: "1.7%"
  case-manufacturing-stat-what: "of records are failures: 1,000 of 60,000 (Scania trucks)"
  source-manufacturing-1: "sensors · engineering"
  source-manufacturing-2: "repair log · maintenance"
  source-manufacturing-3: "production plan · planning"
  source-manufacturing-4: "parts · procurement"
  sources-owners: "12 sources · 12 owners · 6 questions each"

  # The six questions, each with an example from one of the use cases.
  title-six: "Six questions, for each source"
  q-content: "Content"
  q-content-example: "Does the data match reality? Manufacturing: a replaced sensor can shift every reading after it."
  q-labels: "Labels"
  q-labels-example: "Is the outcome recorded? Retail: sales are not demand. An empty shelf sells zero. Next episode."
  q-volume: "Volume"
  q-volume-example: "Count events, not rows: 284,807 card transactions, only 492 frauds."
  q-coverage: "Coverage"
  q-coverage-example: "Every group the product serves: insurance products, regions, the rare large claim. In the data, and in the test set."
  q-freshness: "Freshness"
  q-freshness-example: "In time for the prediction? Retail: train on the weather forecasts known that night, not the actuals."
  q-rights: "Rights"
  q-rights-example: "Allowed for this purpose? Insurance: data collected to settle claims; may it train a model?"
  clearview-amount: "€30.5M"
  clearview-who: "Clearview AI, fined by the Dutch data protection authority, 2024"
  clearview-line: "public ≠ permission"

  # "Enough" is measured.
  title-enough: "“Enough” is measured"
  no-magic: "No magic number: one model needed about 5 events per input, another 23 (Riley et al., 2019)."
  axis-y-label: "model error"
  axis-x-label: "training examples"
  tick-10: "10k"
  tick-20: "20k"
  tick-40: "40k"
  tick-60: "60k"
  curve-tag: "fictional"
  label-big: "most cases"
  flat: "Where it flattens, more data buys very little."
  label-small: "a small group: still going down"
  groups: "Each group has its own curve: measure them apart."

  # The card, with the EU AI Act beside it.
  law: "EU AI Act, Art. 10: the same list, as law, for high-risk AI."
  takeaway-subtitle: "Episode 3.1 in one card"
  next: "Next episode: labels."
