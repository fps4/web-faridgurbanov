text:
  # The title card; the question and the usual answer.
  episode: "AI Product Design · Module 3 · Episode 3.1"
  question: "“Do we have enough data?”"
  answer: "“3 years of sales. 60 million lines a year.”"
  answer-tag: "a row count"

  # Gender Shades.
  title-shades: "Same products, a balanced test set"
  value-women: "34.7%"
  value-men: "0.8%"
  label-women: "darker-skinned women"
  label-men: "lighter-skinned men"
  shades-what: "highest error of three commercial gender classifiers, 2018"
  test-sets: "The usual test sets: 80% and 86% lighter-skinned"
  shades-credit: "Buolamwini & Gebru (2018), Gender Shades. Gender classification, not face recognition."
  missing: "Plenty of data. One group missing, in the test data too."

  # Werkmora and its nine sources.
  title-werkmora: "Werkmora: a forecast for every store, every night"
  werkmora: "A garden retailer with a number of stores. Every night it forecasts how much of each product every store needs."
  werkmora-tag: "fictional company"
  source-sales: "point-of-sale sales"
  source-orders: "online orders"
  source-stock: "store stock"
  source-prices: "prices, promotions"
  source-stores: "store attributes"
  source-calendar: "calendar"
  source-weather: "weather"
  source-supply: "supply"
  source-returns: "returns"
  nine-owners: "9 sources · 9 owners · 6 questions each"

  # The six questions.
  title-six: "Six questions, for each source"
  q-content: "Content"
  q-content-werkmora: "Does the data represent reality? Stock says the plant is on the shelf. Legacy fields kept for compatibility."
  q-labels: "Labels"
  q-labels-werkmora: "Sales are not customer demand. On a day the shelf was empty, sales were zero. Next episode."
  q-volume: "Volume"
  q-volume-werkmora: "Count events, not just rows: 284,807 transactions, only 492 frauds."
  q-coverage: "Coverage"
  q-coverage-werkmora: "Every group the product serves: big and small stores, school holidays per region. In the data, and in the test set."
  q-freshness: "Freshness"
  q-freshness-werkmora: "In time for the nightly run? Train on old weather forecasts, what was known then, not the actuals."
  q-rights: "Rights"
  q-rights-werkmora: "Allowed for this purpose? Ask the provider."
  clearview-amount: "€30.5M"
  clearview-who: "Clearview AI, fined by the Dutch data protection authority, 2024"
  clearview-line: "public ≠ permission"

  # "Enough" is measured.
  title-enough: "“Enough” is measured"
  no-magic: "No magic number: one model needed about 5 events per input, another 23 (Riley et al., 2019)."
  axis-y-label: "forecast error"
  axis-x-label: "months of history in training"
  tick-6: "6"
  tick-12: "12"
  tick-24: "24"
  tick-36: "36"
  curve-tag: "fictional"
  label-big: "big stores"
  flat: "Where it flattens, more data buys very little."
  label-small: "small stores: still going down"
  groups: "Each group has its own curve: measure them apart."

  # The card, with the EU AI Act beside it.
  law: "EU AI Act, Art. 10: almost the same list, as law, for high-risk systems."
  takeaway-subtitle: "Episode 3.1 in one card"
  next: "Next episode: labels."
