# Episode 3.1 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-1.ts. Under `npm run dev`
# a refresh of /en/deck/3-1 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
# - cards:  the heading lines of the scorecard cards. The scorecard rows come from the kit download,
#           and the closing card's rows and the "In this episode" lines from lib/episodes/part-3.ts,
#           because the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-1.ts as well.
# A Dutch deck is a copy of this file in content/decks/nl/, translated.

title: "The threshold is a business decision"

steps:
  recap:
    at: "0:00"
    cue: "Recap: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day."
  promise:
    at: "0:12"
    cue: "In this episode: why the cut-off is a question about money; the four ways to be wrong, priced on one claims desk; one rule that draws the line, and who signs it."
  score:
    at: "0:22"
    cue: "(Show the claim card and the dial.) A model doesn’t decide anything. It gives a score: a €400 TV claim, a 4% chance it is fraudulent or not covered."
  decision:
    at: "0:34"
    cue: "Pay it, or have a handler look? That is the decision."
  money:
    at: "0:40"
    cue: "Where you draw the line is a question about money: what does each kind of mistake cost? (Credit: Elkan, 2001.) The idea is old and simple. It is still usually skipped."
  fraud:
    at: "0:57"
    cue: "(The four boxes appear.) Four ways to be wrong. Pay a fraudulent claim: about €700 too much, on average."
  uncovered:
    at: "1:04"
    cue: "Pay a claim the policy doesn’t cover: you lose the amount."
  handler:
    at: "1:08"
    cue: "Send a valid claim to a handler: about €23 of their time, 25 minutes with AI help, and the customer waits."
  denied:
    at: "1:16"
    cue: "Deny a valid claim: around €350, in complaint handling and in customers who leave. More than many of the claims themselves."
  axes:
    at: "1:26"
    cue: "(Draw the axes.) So the rule writes itself."
  curve:
    at: "1:30"
    cue: "(Draw the curve.) Pay automatically when the expected loss is smaller than the cost of a look: the chance it is wrong, times the amount, below €23."
  dots:
    at: "1:42"
    cue: "(The three dots.) A €150 claim is paid below 15%. A €400 claim below 6%. A €1,000 claim only below about 2%."
  tv:
    at: "1:52"
    cue: "So our TV at 4% is paid today."
  wall:
    at: "1:56"
    cue: "(The wall.) And above €1,000, a handler always looks."
  moves:
    at: "2:00"
    cue: "The line moves with the money. A single cut-off would be too strict on small claims and too loose on large ones."
  accuracy:
    at: "2:12"
    cue: "What do you usually see? (The 86% number.) “Our model is 86% accurate.” 86% of small claims are valid and covered, so a system that pays everything is 86% accurate."
  euros:
    at: "2:26"
    cue: "(Cross it out.) Accuracy tells you nothing here. Euros do."
  notebook:
    at: "2:31"
    cue: "And the cut-off? Often a default, chosen in a notebook by whoever wrote the code. Nobody who owns the result ever saw it."
  move:
    at: "2:41"
    cue: "So move the decision back to the business. Price each kind of wrong answer, with finance."
  never:
    at: "2:47"
    cue: "Say which ones are unacceptable at any price. In this insurer: the system never denies a claim."
  line:
    at: "2:55"
    cue: "Draw the line from those prices, and write it down."
  sign:
    at: "3:00"
    cue: "Then the business owner signs it, as a version, with a date. Changing it later is a new version and a new signature."
  who:
    at: "3:15"
    cue: "(The signature line on the chart.) The head of claims signs it. The Product Owner prepares it; the data people show the curve; finance checks the prices."
  know:
    at: "3:37"
    cue: "You’ll know: a threshold with a version and a name, reports in euros per kind of mistake, and a meeting and a record when someone wants to move the line."
  canvas:
    at: "4:01"
    cue: "(Show the scorecard, blank and filled in.) The scorecard template is linked below, with the sheet that draws the line."
  mark:
    at: "4:07"
    cue: "The rule, what it means for each amount, and who signs it: the threshold section of the scorecard."
  takeaway:
    at: "4:12"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "4:27"
    cue: "In a bank, refunding a disputed card payment without investigation. In a retailer, a refund without the parcel coming back. Same line, same arithmetic."

text:
  # Recap: the title card.
  episode: "AI Product Design · Part 3 · Episode 3.1"
  recap: "Our running example: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day."
  recap-tag: "a worked example · synthetic numbers"

  # The idea: a score, a decision, a question about money.
  title-idea: "A model gives a score. You draw the line."
  claim: "TV · €400"
  claim-kind: "a home-contents claim"
  dial-value: "4%"
  dial-label: "the score"
  score-meaning: "a 4% chance it is fraudulent or not covered"
  pay: "pay it"
  look: "a handler looks"
  money: "Where you draw the line is a question about money."
  credit: "after Elkan (2001), cost-sensitive decisions"

  # On the case: four ways to be wrong.
  title-case: "Four ways to be wrong, each with a price"
  mistakes-tag: "synthetic"
  label-fraud: "fraud paid"
  price-fraud: "≈ €700 too much"
  label-uncovered: "paid, but not covered"
  price-uncovered: "the whole amount"
  label-handler: "valid, sent to a handler"
  price-handler: "≈ €23 · 25 minutes"
  label-denied: "valid, but denied"
  price-denied: "≈ €350"

  # The chart.
  axis-y-label: "chance it is fraudulent or not covered"
  axis-y-formal: "P(not genuine or not covered)"
  tick-30: "30%"
  tick-0: "0%"
  tick-1000: "€1,000"
  tick-2500: "€2,500"
  axis-x-label: "claim amount"
  area-pay: "paid automatically"
  area-look: "a handler looks"
  rule: "pay when chance × amount < €23"
  dot-150-label: "€150: below 15%"
  dot-400-label: "€400: below 6%"
  dot-1000-label: "€1,000: about 2%"
  dot-tv-label: "our TV, 4%: paid"
  cap: "above €1,000 a handler always looks"
  moves: "The line moves with the money."

  # What you see.
  title-see: "What you usually see: one accuracy number"
  accuracy: "86% accurate"
  pay-everything: "so is paying every claim: 86% of small claims are valid and covered"
  count-euros: "count euros instead"
  notebook: "and the cut-off is often a default, set in a notebook"

  # The move.
  title-move: "Move the decision back to the business."
  move-1: "1  Price each wrong answer, with finance."
  move-2: "2  Say which are unacceptable at any price."
  never-tag: "never"
  move-3: "3  Draw the line from the prices. Write it down."
  move-4: "4  The business owner signs it, as a version."
  signature: "head of claims · version 1 · date"
  know: "You’ll know: a threshold with a version and a name, and reports in euros per mistake."

  # The download, and the close.
  canvas-title: "The scorecard: blank, and filled in"
  takeaway-subtitle: "Episode 3.1 in one card"
  swap: "In a bank, refunding a disputed card payment without investigation. In a retailer, a refund without the parcel back. Same line."

cards:
  scorecard-blank:
    title: "Scorecard"
    subtitle: "5 · The threshold · blank"
  scorecard-claims:
    title: "Scorecard"
    subtitle: "5 · The threshold · filled in for the claims example"
