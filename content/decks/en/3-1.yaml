    at: "4:43"
  takeaway:
    at: "4:55"
  next:
    at: "5:08"

text:
  # The title card; the question, the usual answer, and what the EU AI Act asks instead.
  episode: "AI Product Design · Module 3 · Episode 3.1"
  question: "“Is our data ready for AI?”"
  answer: "“Sure. Ten years of history, millions of records.”"
  answer-tag: "a row count"
  act: "The EU AI Act (Art. 10) asks for data that is “relevant, sufficiently representative” … “in view of the intended purpose”."

  # One headline number, then the same questions by language: OpenAI o1, System Card Table 17.
  title-headline: "OpenAI o1 on the standard test"
  mmlu: "MMLU, the standard test for AI models: exam questions in 57 subjects, from maths to law."
  value-all: "7.7%"
  label-all: "wrong answers, in English"
  english-only: "The standard test is in English only."
  title-languages: "Same model, same questions, translated"
  value-english: "7.7%"
  value-swahili: "14.6%"
  value-yoruba: "24.6%"
  label-english: "English"
  label-swahili: "Swahili"
  label-yoruba: "Yoruba"
  web-yoruba: "Yoruba: 45M+ speakers, 0.002% of the web"
  web-swahili: "Swahili: 60–150M speakers, 0.01%"
  web-english: "English: 42.6% of the web"
  languages-what: "wrong answers: the same exam questions, translated by professional translators"
  languages-credit: "OpenAI o1 System Card (Dec 2024), Table 17 · Common Crawl CC-MAIN-2026-43, share of web pages by language"

  # Three use cases, with one number to know and four sources each (source · owner).
  title-cases: "Three models, three industries"
  case-retail: "Retail"
  case-retail-predicts: "Demand per store and product, 7 days ahead"
  case-retail-stat: "≈ 32%"
  case-retail-stat-what: "typical forecast error, even with good models (898 stores, 2025)"
  source-retail-1: "sales · stores"
  source-retail-2: "stock · supply chain"
  source-retail-3: "promotions · commercial"
  source-retail-4: "weather · external"
  case-insurance: "Insurance"
  case-insurance-predicts: "Which claims to check for fraud"
  case-insurance-stat: "10–50%"
  case-insurance-stat-what: "of the fraud is ever found, by country (Europe, 2017)"
  source-insurance-1: "claims · claims team"
  source-insurance-2: "policies · underwriting"
  source-insurance-3: "payments · finance"
  source-insurance-4: "fraud cases · fraud team"
  case-manufacturing: "Manufacturing"
  case-manufacturing-predicts: "Which machine fails before its next service"
  case-manufacturing-stat: "1.7%"
  case-manufacturing-stat-what: "of the records are failures: 1,000 in 60,000 (Scania trucks)"
  source-manufacturing-1: "sensors · engineering"
  source-manufacturing-2: "repair log · maintenance"
  source-manufacturing-3: "production plan · planning"
  source-manufacturing-4: "parts · procurement"
  sources-owners: "Every industry, same pattern: each source has its own owner."

  # Beside the use cases: insurance fraud found vs estimated not found, by country (Insurance Europe 2019, pp. 6–7).
  fraud-title: "Insurance fraud found, by country, 2017"
  fraud-denmark: "Denmark"
  fraud-denmark-amounts: "€33m found · ≈ €300m not found"
  fraud-denmark-share: "≈ 10%"
  fraud-slovenia: "Slovenia"
  fraud-slovenia-amounts: "€20m found · ≈ €90m not found"
  fraud-slovenia-share: "≈ 18%"
  fraud-ireland: "Ireland, non-life"
  fraud-ireland-amounts: "€76m found · ≈ €200m not found"
  fraud-ireland-share: "≈ 28%"
  fraud-france: "France, motor"
  fraud-france-amounts: "€127m found · ≈ €125m not found"
  fraud-france-share: "≈ 50%"
  fraud-credit: "Insurance Europe (2019), pp. 6–7; by value"

  # The six questions, each with an example from one of the use cases.
  title-six: "Six questions, for each source"
  q-content: "Content"
  q-content-example: "Does the data match reality? Manufacturing: a new sensor can shift every reading, while the field keeps its name."
  q-labels: "Labels"
  q-labels-example: "Is the right answer recorded? Retail: sales are not demand. An empty shelf sells zero. Next episode."
  q-volume: "Volume"
  q-volume-example: "Count the cases you learn from, not the rows: 284,807 card payments, only 492 frauds."
  q-coverage: "Coverage"
  q-coverage-example: "Every group it serves: each insurance product, each region, the rare big claim. In training and in test."
  q-freshness: "Freshness"
  q-freshness-example: "There in time, and still like today? Retail: learn from the weather forecast you had that night, not the weather that came."
  q-rights: "Rights"
  q-rights-example: "Allowed for this purpose? Insurance: data collected to pay claims. May we use it to train a model?"
  clearview-amount: "€30.5M"
  clearview-who: "Clearview AI, fined by the Dutch data protection authority, 2024"
  clearview-line: "public ≠ permission"

  # "Enough" is measured.
  title-enough: "“Enough” is measured"
  no-magic: "No magic number: in one study, one model needed about 5 cases for each factor it uses, another needed 23."
  axis-y-label: "model error"
  axis-x-label: "examples to learn from"
  tick-10: "10k"
  tick-20: "20k"
  tick-40: "40k"
  tick-60: "60k"
  curve-tag: "fictional"
  label-big: "most cases"
  flat: "Where it flattens, more data buys very little."
  label-small: "a small group: still going down"
  groups: "Each group has its own curve: measure each one."

  # The card, with the EU AI Act beside it.
  law: "EU AI Act, Art. 10: the same list, as law, for high-risk AI."
  takeaway-subtitle: "Episode 3.1 in one card"
  next: "Next episode: labels."
