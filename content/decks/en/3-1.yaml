# Episode 3.1 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-1.ts. Under `npm run dev`
# a refresh of /en/deck/3-1 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The script is in the wiki: publishing/ai-product-design/episodes/data/01-data-requirements.script.md.
# Times assume about 125 words a minute; adjust them after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-1.ts as well.

title: "Data requirements"

steps:
  title:
    at: "0:00"
    cue: "Episode 3.1 of AI Product Design: data requirements."
  promise:
    at: "0:04"
    cue: "In this episode, three things. Why a row count does not answer “do we have enough data?”. Six questions to ask of every data source. And how to measure “enough”."
  rows:
    at: "0:18"
    cue: "“Do we have enough data?” I have heard it in almost every project. The answer is almost always a row count. “Three years of sales. Sixty million lines a year.” Everyone nods, and the project starts."
  shades:
    at: "0:35"
    cue: "(The bars.) Here is why that is not enough. In 2018, two researchers tested three commercial products that guess gender from a face photo. The usual test sets: about 80% lighter-skinned. On a balanced set: up to about 35% error for darker-skinned women, under 1% for lighter-skinned men."
  missing:
    at: "1:05"
    cue: "Plenty of data. One group missing from it. And the test data missed the same group, so nobody saw it."
  werkmora:
    at: "1:17"
    cue: "A quick reminder: Werkmora, our home and garden retailer, about 175 stores in NL, BE and DE. Every night it forecasts how much of each garden item every store needs."
  sources:
    at: "1:33"
    cue: "(The nine boxes.) Not “the data”: nine sources. Nine owners. So we ask six questions, of each source."
  content:
    at: "1:53"
    cue: "One: content. Is the signal in the data, does each field mean what its name says? Stock says the plant is on the shelf. Often it is not: about 2 in 3 records wrong at one retailer."
  labels:
    at: "2:15"
    cue: "Two: labels. Recorded, and how late? Sales are not demand: empty shelf, zero sales, people still wanted to buy. Next episode."
  volume:
    at: "2:32"
    cue: "Three: volume. Count events, not rows. 285,000 transactions, 492 frauds: a dataset of about five hundred. The test set needs enough of them too."
  coverage:
    at: "2:53"
    cue: "Four: coverage. Every group the product serves. Big stores and small stores. School holidays per German state. Missing in the data or the test set: you don’t know how the model does there."
  freshness:
    at: "3:15"
    cue: "Five: freshness. In time for the nightly run? Does the past still look like today? Train on the old weather forecasts: what you knew at that moment."
  rights:
    at: "3:37"
    cue: "Six: rights. Are we allowed to use this data for this purpose?"
  fine:
    at: "3:43"
    cue: "(The box.) 2024: the Dutch data protection authority fined Clearview AI €30.5 million. Billions of face photos from the internet. “Public” did not mean “we may use it”. For Werkmora: does the weather contract allow storing and training? Ask the provider, before the build."
  mine:
    at: "4:14"
    cue: "(Your own example: a source that changed meaning upstream, or a licence nobody checked. Two or three sentences.)"
  magic:
    at: "4:34"
    cue: "Now, “enough”. No magic number. You will hear “ten per variable” or “a few hundred per class”. One study: one model needed about 5 events per input, another 23. Their advice: no rules of thumb."
  curve:
    at: "4:54"
    cue: "(Draw the axes and the curve.) So measure it. A pilot: train on 6 months, then 12, 24, 36. Plot the error each time. That is a learning curve."
  flat:
    at: "5:07"
    cue: "(Circle the knee.) While it goes down, more data helps. When it flattens, more data buys very little."
  small:
    at: "5:15"
    cue: "(The second curve.) Big stores: flat after about two years. Small stores: still going down. So the pilot started with big stores. A decision made on a measurement."
  summary:
    at: "5:35"
    cue: "So: six questions, for each source, with an owner for each answer. Write them down where the team keeps them up to date: a datasheet in the repo, or a data contract."
  law:
    at: "5:51"
    cue: "High-risk system under the EU AI Act? Article 10 asks almost the same questions, as law. Werkmora’s forecast is not high-risk. The list is the same."
  takeaway:
    at: "6:06"
    cue: "(The card.) In one card: the idea, the move, and what to do on Monday."
  next:
    at: "6:12"
    cue: "Next episode: labels. Because sales were never the same as demand."

text:
  # The title card; the question and the usual answer.
  episode: "AI Product Design · Module 3 · Episode 3.1"
  question: "“Do we have enough data?”"
  answer: "“3 years of sales. 60 million lines a year.”"
  answer-tag: "a row count"

  # Gender Shades.
  title-shades: "Same products, a balanced test set"
  value-women: "34.7%"
  value-men: "0.8%"
  label-women: "darker-skinned women"
  label-men: "lighter-skinned men"
  shades-what: "highest error of three commercial gender classifiers, 2018"
  test-sets: "The usual test sets: 80% and 86% lighter-skinned"
  shades-credit: "Buolamwini & Gebru (2018), Gender Shades. Gender classification, not face recognition."
  missing: "Plenty of data. One group missing, in the test data too."

  # Werkmora and its nine sources.
  title-werkmora: "Werkmora: a garden forecast, every night"
  werkmora: "A home and garden retailer, about 175 stores in the Netherlands, Belgium and Germany. Every night it forecasts how much of each garden item every store needs."
  werkmora-tag: "fictional company"
  source-sales: "point-of-sale sales"
  source-orders: "online orders"
  source-stock: "store stock"
  source-prices: "prices, promotions"
  source-stores: "store attributes"
  source-calendar: "calendar"
  source-weather: "weather"
  source-supply: "supply"
  source-returns: "returns"
  nine-owners: "9 sources · 9 owners · 6 questions each"

  # The six questions.
  title-six: "Six questions, for each source"
  q-content: "Content"
  q-content-werkmora: "Stock says the plant is on the shelf. Often it is not: about 2 in 3 records wrong at one retailer."
  q-labels: "Labels"
  q-labels-werkmora: "Sales are not demand. On a day the shelf was empty, sales were zero. Next episode."
  q-volume: "Volume"
  q-volume-werkmora: "Count events, not rows: 492 frauds in 284,807 transactions is a dataset of about 500."
  q-coverage: "Coverage"
  q-coverage-werkmora: "Big stores and small stores. School holidays differ per German state. In the data, and in the test set."
  q-freshness: "Freshness"
  q-freshness-werkmora: "In time for the nightly run? Train on old weather forecasts: what was known at the time."
  q-rights: "Rights"
  q-rights-werkmora: "Allowed for this purpose? Does the weather contract let us store forecasts and train on them?"
  clearview-amount: "€30.5M"
  clearview-who: "Clearview AI, fined by the Dutch data protection authority, 2024"
  clearview-line: "public ≠ permission"
  mine-tag: "from my projects"

  # "Enough" is measured.
  title-enough: "“Enough” is measured"
  no-magic: "No magic number: one model needed about 5 events per input, another 23 (Riley et al., 2019)."
  axis-y-label: "forecast error"
  axis-x-label: "months of history in training"
  tick-6: "6"
  tick-12: "12"
  tick-24: "24"
  tick-36: "36"
  curve-tag: "fictional"
  label-big: "big stores"
  flat: "Flat after about 2 years: more data buys little."
  label-small: "small stores: still going down"
  pilot: "Pilot: big stores first, small stores later."

  # The close.
  title-close: "Six questions. Each source. One owner per answer."
  write-down: "Write the answers where the team keeps them up to date: a datasheet in the repo, or a data contract."
  sheet-head: "weather feed · owner: Data & Analytics"
  sheet-rows: "content ✓ · volume ✓ · coverage ✓ · freshness: forecast history? · rights: ask the provider"
  law: "EU AI Act, Art. 10: almost the same list, as law, for high-risk systems."
  law-scope: "Werkmora’s forecast is not high-risk. The list is the same."
  takeaway-subtitle: "Episode 3.1 in one card"
  next: "Next: labels. Sales were never the same as demand."
