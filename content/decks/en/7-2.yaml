# Episode 7.2 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/7-2.ts. Under `npm run dev`
# a refresh of /en/deck/7-2 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves; a grid cell holds two
#           short lines.
# - cards:  the heading lines of the plan cards. The plan rows come from the kit download, and the
#           closing card's rows and the "In this episode" lines from lib/episodes/part-7.ts, because
#           the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/7-2.ts as well.
# A Dutch deck is a copy of this file in content/decks/nl/, translated.

title: "The first quarter"

steps:
  recap:
    at: "0:00"
    cue: "Recap: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day. Everyone agrees. Now it is Monday."
  promise:
    at: "0:12"
    cue: "In this episode: why most AI plans stall, with everyone waiting for someone; four roles moving at the same time, kept in step by two gates; twelve weeks at the insurer, and a plan for Monday."
  waiting:
    at: "0:25"
    cue: "This is the moment most AI plans stall: from waiting. The sponsor waits for the architects, the architects for the data, the Product Owner for a decision."
  quarter:
    at: "0:38"
    cue: "Each of them is right to wait, and the quarter is gone."
  grid:
    at: "0:45"
    cue: "(Draw the grid.) The parts are not a line one person walks down. Four roles move at the same time."
  col1:
    at: "0:55"
    cue: "(Fill in weeks 1–2.) The sponsor names the decision and its owner and prices today's errors. The architect runs the readiness gates and the risk tier. The Product Owner writes down which wrong answers are unacceptable, and what each costs. The engineering lead measures delivery today: that row is the delivery track, Part 8, running alongside, not on the critical path."
  col2:
    at: "1:15"
    cue: "(Fill in weeks 3–6.) The sponsor funds the gaps and takes the first gate. The architect draws the system on all its layers. The Product Owner agrees the scorecard, the baseline and the threshold."
  col3:
    at: "1:30"
    cue: "(Fill in weeks 7–12.) And by week twelve, the second gate."
  gates:
    at: "1:38"
    cue: "(Draw the gate lines.) The gates keep the rows in step. The second gate is decided on the scorecard. Not on a demo."
  case:
    at: "1:50"
    cue: "(Show the case bar.) For our insurer, the twelve weeks cover two stages."
  week1:
    at: "2:00"
    cue: "Week one: the head of claims owns the decision. Asking what is already switched on turns up an AI triage module, licensed and off."
  recheck:
    at: "2:15"
    cue: "And one thing is booked straight away: 3,000 claims re-checked by senior handlers and the fraud desk, about 3,000 hours. At that size it is a team."
  gate1:
    at: "2:30"
    cue: "Weeks two and three: the value case, and the first gate. Above a million a year net, at 35% automation? About €1.13 million: go. All synthetic."
  stage2:
    at: "2:45"
    cue: "Weeks four to eleven: the verified set, the model tested against the desk and the rule. The threshold is written down and the head of claims signs it. No denial is ever automatic."
  gate2:
    at: "3:05"
    cue: "Week twelve: the second gate. Fewer euros in errors, on claims somebody checked? If yes, the next ask is six weeks of shadow mode."
  move:
    at: "3:20"
    cue: "(Show the empty name boxes.) So the move is small. Before week one, put a name in every row: one name, one output and one date per cell, and the gates dated."
  who:
    at: "3:40"
    cue: "The sponsor owns the plan and decides at the gates. Each role owns its own row. A row with no name is the first thing to fix."
  know:
    at: "4:00"
    cue: "At week twelve: two recorded gate decisions, a verified set, and a threshold someone signed. Empty cells at week three mean the names were the problem."
  canvas:
    at: "4:25"
    cue: "(Show the plan, blank and filled in.) The first-quarter plan is linked below, week by week."
  mark:
    at: "4:32"
    cue: "(Mark the rows.) The names first: sponsor, architecture, Product Owner, engineering lead."
  takeaway:
    at: "4:40"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "5:00"
    cue: "In a retailer or a bank, the same twelve weeks work. The names in the rows change. The gates do not."

text:
  # Recap: the title card.
  episode: "AI Product Design · Part 7 · Episode 7.2"
  recap: "Our running example: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day. Everyone agrees. Now it is Monday."
  recap-tag: "a worked example · synthetic numbers"

  # What you see: everyone waiting.
  hook: "Most AI plans stall from waiting."
  wait-1: "the sponsor waits for the architects"
  wait-2: "the architects wait for the data"
  wait-3: "the Product Owner waits for a decision"
  gone: "and the quarter is gone"

  # The idea: four rows, three columns, two gates.
  title-idea: "Four roles at the same time, kept in step by the gates."
  col-1: "weeks 1–2"
  col-2: "weeks 3–6"
  col-3: "weeks 7–12"
  role-sponsor: "Sponsor"
  role-architecture: "Architecture"
  role-po: "Product Owner"
  role-engineering: "Engineering lead"
  cell-sponsor-1: "name the owner; price today’s errors"
  cell-sponsor-2: "first gate: worth doing?"
  cell-sponsor-3: "second gate, on the scorecard"
  cell-architecture-1: "readiness gates and the risk tier"
  cell-architecture-2: "draw all nine layers"
  cell-architecture-3: "shared layers into the platform"
  cell-po-1: "list unacceptable errors and their cost"
  cell-po-2: "scorecard and threshold"
  cell-po-3: "sign the threshold as a version"
  cell-engineering-1: "measure delivery today"
  cell-engineering-2: "checks before review"
  cell-engineering-3: "measure again; keep or stop each change"
  gate1-label: "stage-1 gate · week 3"
  gate2-label: "stage-2 gate · week 12"

  # In the case: the twelve weeks at the insurer.
  title-case: "At our insurer: twelve weeks, two stages"
  bar-label: "the twelve weeks at our insurer"
  bar-tag: "synthetic"
  bar-value: "value case"
  bar-stage2: "verified set and offline evaluation"
  recheck: "book the re-check: 3,000 claims, ≈ 3,000 hours"
  k-week1: "week 1: the head of claims owns the decision; a triage module turns up, licensed and off"
  k-gate1: "weeks 2–3: value case; gate 1, above €1M net at 35%? ≈ €1.13M net: go"
  k-stage2: "weeks 4–11: the verified set; the head of claims signs the threshold; no denial is ever automatic"
  k-gate2: "week 12: gate 2, fewer euros in errors on checked claims? Then six weeks of shadow mode."

  # The move: a name in every row.
  title-move: "Put a name in every row."
  move: "one name, one output and one date per cell; the gates dated, with who decides"
  name-sponsor: "head of claims"
  name-architecture: "claims domain architect"
  name-po: "Product Owner, claims"
  name-engineering: "claims IT lead"
  who: "The sponsor owns the plan and decides at the gates. Each role owns its row."
  know: "You’ll know: at week 12, two recorded gate decisions and a signed threshold."

  # The download, and the close.
  canvas-title: "The first-quarter plan: blank, and filled in"
  takeaway-subtitle: "Episode 7.2 in one card"
  swap: "In a retailer or a bank, the same twelve weeks work. The names in the rows change. The gates do not."

cards:
  plan-blank:
    title: "First-quarter plan"
    subtitle: "The names · blank"
  plan-claims:
    title: "First-quarter plan"
    subtitle: "The names · filled in for the claims example"
