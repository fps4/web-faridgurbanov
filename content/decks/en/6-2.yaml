# Episode 6.2 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/6-2.ts. Under `npm run dev`
# a refresh of /en/deck/6-2 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
# - cards:  the heading lines of the control-map cards. The map rows come from the kit download, and
#           the closing card's rows and the "In this episode" lines from lib/episodes/part-6.ts,
#           because the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/6-2.ts as well.

title: "You already have this obligation"

steps:
  recap:
    at: "0:00"
    cue: "Recap: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day. The claims IT team is building the automatic payment, with coding agents."
  promise:
    at: "0:12"
    cue: "In this episode: the change rule financial firms already have; what coding agents do to the evidence for it; one workflow mapped to your change process, in three questions."
  policy:
    at: "0:25"
    cue: "Someone asks for a new policy for AI. A working group starts. Six months later there is a draft."
  inforce:
    at: "0:38"
    cue: "Meanwhile, the rule that matters is already in force."
  idea:
    at: "0:45"
    cue: "(Draw the three boxes and the wall.) In Dutch financial services, DORA usually means the EU Digital Operational Resilience Act. It has applied since January 2025."
  source:
    at: "0:58"
    cue: "Its technical standard, Article 17: the people who approve a change are independent of the people who request it and build it. For every change, AI or not."
  scope:
    at: "1:15"
    cue: "And it covers insurers. Every insurer under Solvency II, like ours, is in scope."
  agents:
    at: "1:30"
    cue: "(Agents fan into “implement”.) Now add coding agents. The claims IT team uses them to build the payment path."
  pile:
    at: "1:42"
    cue: "More changes, written faster, often by something that is not a person. The rule doesn’t change: whoever, or whatever, wrote the change cannot approve it."
  bias:
    at: "1:55"
    cue: "A person clicks “approve” on a large change an agent wrote. People over-trust what a machine produced, experts included. That click is weak evidence."
  bold:
    at: "2:15"
    cue: "Agents don’t create this obligation. They make it harder to evidence."
  signatures:
    at: "2:25"
    cue: "(The two signatures.) The threshold and the thousand-euro cap are business decisions. The head of claims signs them, as versions. Putting version three live is a change like any other."
  link:
    at: "2:50"
    cue: "Two signatures: what should be true, and this change was controlled. (The dotted line.) Threshold version three went live in this release."
  move:
    at: "3:10"
    cue: "(Light up the three layers.) Start from the obligation you already have. Map one AI workflow to your change process, on one page. Three questions."
  identity:
    at: "3:20"
    cue: "Identity: which identity does the agent use, and can it approve anything? The answer must be no, by design."
  approval:
    at: "3:32"
    cue: "Approval: who approves, and are they independent of whoever asked for it and whoever, or whatever, built it?"
  record:
    at: "3:44"
    cue: "Record: for a change in production, can you show who approved which version, and what was built against it, within minutes?"
  who:
    at: "4:00"
    cue: "Compliance and the change manager own the map. The engineering lead fills in identity and record. The head of claims signs the decisions that are theirs."
  know:
    at: "4:20"
    cue: "You’ll know: pick any change in production and answer who approved which version, in minutes. No agent or bot account can satisfy an approval rule."
  canvas:
    at: "4:40"
    cue: "(Show the control map, blank and filled in.) The control map is linked below. It is not legal advice; it shows where the controls sit."
  mark:
    at: "4:48"
    cue: "(Mark the rows.) The three layers of this episode: identity, human approval, and the decision log."
  takeaway:
    at: "4:55"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "5:15"
    cue: "Outside financial services there is no EU DORA. But an auditor, or a complaints body, will ask the same question."

text:
  # Recap: the title card.
  episode: "AI Product Design · Part 6 · Episode 6.2"
  recap: "Our running example: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day. The claims IT team is building the automatic payment, with coding agents."
  recap-tag: "a worked example · synthetic numbers"

  # What you see: a new AI policy.
  title-policy: "The AI question in the change process"
  policy-ask: "a new policy for AI"
  policy-group: "a working group"
  policy-draft: "a draft, six months later"
  inforce: "Meanwhile, the rule that matters is already in force."

  # The idea: request, implement, approve, live.
  title-idea: "The approver is independent of who asked and who built."
  flow-request: "request"
  flow-implement: "implement"
  flow-approve: "approve"
  flow-live: "live"
  wall-label: "independent"
  dora-source: "EU DORA, applies from 17 January 2025 · Delegated Reg. (EU) 2024/1774, Art. 17"
  dora-quote: "“mechanisms to ensure the independence of the functions that approve changes and the functions responsible for requesting and implementing those changes”"
  scope: "every insurer under Solvency II"

  # On the case: agents, the pile, the two signatures.
  agent-1: "agent"
  agent-2: "agent"
  agent-3: "agent"
  pile: "changes waiting"
  bias: "a click on a large change an agent wrote: weak evidence that anything was checked"
  bias-source: "automation bias · Parasuraman & Manzey, 2010"
  bold: "Agents don’t create this obligation. They make it harder to evidence."
  sig-business: "business decision · the head of claims signs threshold v3 and the €1,000 cap"
  sig-business-tag: "synthetic"
  sig-change: "change approval · an approver independent of claims and claims IT"
  release: "release 2026.11"

  # The move: the control map, three layers lit.
  title-move: "Map one AI workflow to your change process."
  layer-channel: "channel"
  layer-orchestration: "orchestration"
  layer-model: "model access"
  layer-knowledge: "knowledge and retrieval"
  layer-tools: "tools and integration"
  layer-identity: "identity and permissions"
  layer-approval: "human approval"
  layer-evaluation: "evaluation"
  layer-observability: "observability: the decision log"
  q-identity: "Identity: can the agent’s identity approve anything? No, by design."
  q-approval: "Approval: independent of whoever asked and whoever, or whatever, built it?"
  q-record: "Record: who approved which version, and what was built against it, in minutes?"
  obligation: "Obligation: EU DORA, Delegated Reg. (EU) 2024/1774, Art. 17"
  who: "Compliance and the change manager own the map. The engineering lead fills in identity and record. The head of claims signs what is theirs."
  know: "You’ll know: any change in production, answered in minutes."

  # The download, and the close.
  canvas-title: "The control map: blank, and filled in"
  takeaway-subtitle: "Episode 6.2 in one card"
  swap: "Outside financial services there is no EU DORA. But an auditor, or a complaints body, will ask the same question."

