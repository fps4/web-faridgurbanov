# Episode 1.2 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/1-2.ts. Under `npm run dev`
# a refresh of /en/deck/1-2 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
# - cards:  the heading lines of the canvas cards. The canvas rows come from the kit download, and
#           the closing card's rows and the "In this episode" lines from lib/episodes/part-1.ts,
#           because the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/1-2.ts as well.
# A Dutch deck is a copy of this file in content/decks/nl/, translated.

title: "Picking the first one"

steps:
  recap:
    at: "0:00"
    cue: "Recap: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day."
  promise:
    at: "0:12"
    cue: "In this episode: the baseline that decides it; three candidates at the insurer, scored two ways; why one goes first, and how to write down why the others wait."
  ideas:
    at: "0:25"
    cue: "Every organization has a list of AI ideas. The one that gets picked is the most exciting, or the one with the best demo."
  perfection:
    at: "0:35"
    cue: "Each idea is judged against perfection, “it is wrong 8% of the time”, or against nothing at all."
  today:
    at: "0:45"
    cue: "Both are the wrong comparison. The right one is today’s process, with its own mistakes."
  idea:
    at: "0:55"
    cue: "(Draw the baseline bar.) The baseline is today’s process, with its mistakes."
  example:
    at: "1:00"
    cue: "A model wrong 8% of the time is good if today is wrong 15% and slower; bad if a simple rule is wrong 9% and costs nothing."
  twoq:
    at: "1:15"
    cue: "Two questions, answered separately. Is it worth doing? And can it go live?"
  never:
    at: "1:22"
    cue: "No data: a research project. Nobody needs it: a demo. Add the two scores up and both look fine."
  handling:
    at: "1:40"
    cue: "(Price today’s desk.) About two and a half million euros a year in handling."
  fraud:
    at: "1:47"
    cue: "About nine hundred and fifty thousand paid out in fraud the desk does not catch."
  denials:
    at: "1:53"
    cue: "About two hundred thousand lost on claims it wrongly denies; each one costs a complaint, and sometimes a customer."
  wait:
    at: "2:03"
    cue: "And eight working days to settle."
  market:
    at: "2:08"
    cue: "The real market: over nine thousand fraud cases established in 2024. Almost fifty-four thousand non-life complaints in 2025, about twenty-three thousand on claims handling and payout."
  slow:
    at: "2:28"
    cue: "In Belgium, slow settlement is the second most common complaint about fire insurance. Slow is a cost too."
  cards:
    at: "2:40"
    cue: "(Show the three cards.) Now three candidates."
  aValue:
    at: "2:44"
    cue: "A, fast-track small home-contents claims. Value: high. It hits the handling, the wait and the errors at once."
  ticks:
    at: "2:55"
    cue: "Feasibility: (tick the six) an owner, a process, the data (to re-check), a measurable result, bounded risk, a few systems."
  b:
    at: "3:18"
    cue: "B, the “where is my claim?” chatbot. Feasibility high. Value lower than it looks: people ask because it takes eight days."
  c:
    at: "3:32"
    cue: "C, fraud scoring on every claim. Value high, feasibility low. Fraud is only known where the fraud desk chose to look."
  first:
    at: "3:45"
    cue: "(Mark A as first.) A goes first. B and C wait, and the reason is written down."
  move:
    at: "3:50"
    cue: "So: price today’s process, errors included. Score value and feasibility separately, and never add them. Pick one, and write down why the others wait."
  who:
    at: "4:15"
    cue: "The sponsor makes the choice. A Product Owner or process owner prepares it, with one person who knows the data."
  know:
    at: "4:40"
    cue: "You’ll know: the choice is on one page, and when someone asks “why not the chatbot?”, the page answers it."
  canvas:
    at: "5:05"
    cue: "(Show the canvas.) The scoring half of the use-case canvas is linked below, blank and filled in for the three candidates."
  mark:
    at: "5:12"
    cue: "(Mark candidate A.) A goes first; B and C keep the reason they wait."
  takeaway:
    at: "5:20"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "5:40"
    cue: "In a bank the baseline is the dispute desk; in a retailer, the refunds team. Price it first."

text:
  # Recap: the title card.
  episode: "AI Product Design · Part 1 · Episode 1.2"
  recap: "Our running example: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day."
  recap-tag: "a worked example · synthetic numbers"

  # What you see: the list of ideas, and the wrong comparison.
  hook: "Every organization has a list of AI ideas."
  idea-chatbot: "a chatbot"
  idea-copilot: "a copilot for everyone"
  idea-fraud: "fraud AI"
  idea-email: "summarise every email"
  idea-demo: "the one with the best demo"
  perfection: "Judged against perfection, or against nothing at all."
  today: "The right comparison: today’s process, with its own mistakes."

  # The idea: one baseline, two separate scores.
  title-idea: "The baseline is today’s process, with its mistakes."
  baseline-label: "today’s desk: the baseline"
  example-1: "For example: a model wrong 8% of the time is good if today’s desk is wrong 15% of the time, and slower."
  example-2: "It is bad if a simple rule is wrong 9% of the time and costs nothing."
  value-q: "value: is it worth doing?"
  feas-q: "feasibility: can it go live?"
  never: "Never add them up. No data: a research project. Nobody needs it: a demo."

  # In the case: price today's desk, then the real market beside it.
  title-case: "At our insurer: price today’s desk"
  seg-handling: "handling ≈ €2.5M a year"
  seg-fraud: "fraud paid ≈ €952k"
  seg-denials: "wrong denials ≈ €205k"
  seg-wait: "8 working days"
  baseline-tag: "synthetic"
  real-tag: "the real market, kept apart"
  real-fraud: "Dutch insurers established 9,070 fraud cases in 2024."
  real-fraud-source: "Verbond / CBV, CBV Factsheet, November 2025 · detected fraud, all lines"
  real-complaints: "Of 53,700 non-life complaints in 2025, 22,900 were about claims handling and payout."
  real-complaints-source: "AFM, Klachtenuitvraag verzekeringen over 2025 · rounded by the AFM"
  real-belgium: "Belgium: slow settlement is the second most common complaint about fire insurance."
  real-belgium-source: "Ombudsman van de Verzekeringen, Jaarverslag 2025"

  # Three candidates, two scores each.
  title-cards: "Three candidates, two scores each, one baseline"
  a-title: "A  fast-track small home-contents claims"
  b-title: "B  a chatbot that answers “where is my claim?”"
  c-title: "C  fraud scoring on every claim"
  a-value-label: "value"
  a-feas-label: "feasibility"
  a-value-level: "high"
  a-feas-level: "high"
  b-value-label: "value"
  b-feas-label: "feasibility"
  b-value-level: "medium"
  b-feas-level: "high"
  c-value-label: "value"
  c-feas-label: "feasibility"
  c-value-level: "high"
  c-feas-level: "low"
  ticks-1: "A, feasibility:  ✓ owner   ✓ process   ✓ data, partly"
  ticks-2: "✓ measurable result   ✓ bounded risk   ✓ two systems, partly"
  first: "first"
  b-why: "waits: the wait causes the questions"
  c-why: "waits for checked outcomes"

  # The move.
  title-move: "So: price today, score separately, pick one."
  move-1: "1  Price today’s process, errors included."
  move-2: "2  Score value and feasibility separately. Never add them."
  move-3: "3  Pick one, and write down why the others wait."
  who: "Prepared by a senior claims handler and whoever runs the claims data. The head of claims chooses."
  know: "You’ll know: the choice is on one page, and it answers “why not the chatbot?”"

  # The download, and the close.
  canvas-title: "The use-case canvas, scoring half: blank, and filled in"
  takeaway-subtitle: "Episode 1.2 in one card"
  swap: "In a bank the baseline is the dispute desk; in a retailer, the refunds team. Price it first."

cards:
  canvas-blank:
    title: "Use-case canvas"
    subtitle: "4 · Value and feasibility · blank"
  canvas-claims:
    title: "Use-case canvas"
    subtitle: "4 · Value and feasibility · three candidates for the claims example"
