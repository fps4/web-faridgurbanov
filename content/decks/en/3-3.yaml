# Episode 3.3 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-3.ts. Under `npm run dev`
# a refresh of /en/deck/3-3 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the planned time in the episode; keep it in
#           quotes ("0:22"). `notes` are what the presenter view shows: the presenter notes, copied
#           from the wiki's .slides.md by `npm run notes`. Edit them there, not here.
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/03-data-quality-and-leakage.slides.md.
# Adjust the times after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-3.ts as well.

title: "Data quality and leakage"

steps:
  title:
    at: "0:00"
    notes:
      - "**Episode 3.3 — data quality and leakage.**"
  promise:
    at: "0:05"
    notes:
      - "**In this episode: great numbers are a reason to check · one rule against leakage · agree the data with its producers.**"
  great:
    at: "0:20"
    notes:
      - "**\"The offline numbers look great. Ship it.\"** The usual belief."
      - "→ A case that should make you careful."
  informs:
    at: "0:30"
    notes:
      - "**INFORMS 2010 challenge: predict stock price moves one hour ahead.**"
      - "About 30 teams above AUC 0.9, the best above 0.99 (1.0 = perfect)."
      - "The data held variables from the future. Kaufman, Rosset & Perlich (2011), §2."
  ibm:
    at: "0:49"
    notes:
      - "**IBM: which companies will buy? Read from their websites.**"
      - "Text collected *after* they became customers → \"Websphere\"."
      - "Nothing secret, only collected at the wrong moment."
      - "→ Our company has the same risk."
  werkmora:
    at: "1:13"
    notes:
      - "**Werkmora — fictional home, DIY and garden retailer, about 175 stores.**"
      - "Nightly forecast at 01:00, per store × item. The pilot beats the ERP forecast in the notebook."
      - "**\"Would we know each input at 01:00?\"**"
  timeline:
    at: "1:39"
    notes:
      - "**A timeline: the moment of prediction is 01:00.**"
      - "Left: may be used. Right: off limits."
      - "Leakage = training sees the right side anyway."
  target:
    at: "1:57"
    notes:
      - "**Target leakage: a feature that holds the answer.**"
      - "\"Cancellation reason\" predicts churn, filled in after the customer left. IBM's website text."
  temporal:
    at: "2:12"
    notes:
      - "**Temporal leakage: the table keeps today's value.**"
      - "Werkmora: Pricing updates promotion flags after the promotion → in history, flags set when the sales were known."
  rule:
    at: "2:32"
    notes:
      - "**Learn–predict separation (Kaufman §4): each training row only from data that existed at its prediction time.**"
      - "Werkmora: an \"available at\" column per feature; promotion plans stored as they stood each night."
      - "→ But you will not always see it."
  quiet:
    at: "2:53"
    notes:
      - "**A warning about the warning: leakage can be quiet.**"
      - "Kapoor & Narayanan (2023): 12 reproducible civil-war papers, 4 with errors, exactly the 4 that said complex ML beats logistic regression. One AUC gap 0.14 → 0.01."
  checklist:
    at: "3:12"
    notes:
      - "**Plausible numbers pass intuition. A checklist catches them.**"
      - "8 types; 3 about the data: duplicates, illegitimate features, the future."
      - "The rest is about the split → next episode."
  skew:
    at: "3:33"
    notes:
      - "**The twin: training/serving skew.** Different code, timing or distribution (Breck et al. 2019)."
      - "Werkmora's weather is both: history has actuals, 01:00 has a forecast."
  fixes:
    at: "3:53"
    notes:
      - "**One feature code · log features at serving and train on them · measure the skew nightly** (Zinkevich #29, #32, #37)."
      - "Weather: store forecasts as issued, from today."
      - "→ Then the basics."
  missing:
    at: "4:12"
    notes:
      - "**Missing: impute, drop or flag, per feature.**"
      - "Werkmora: shelf capacity missing outdoors → flag it, a zero would say \"holds nothing\"."
  noisy:
    at: "4:27"
    notes:
      - "**Noisy: filled in but wrong.** 65% of stock records wrong at one retailer."
      - "Werkmora: stock-out flag from the stock record *and* the sales pattern."
      - "Label noise hurts most."
  imbalance:
    at: "4:47"
    notes:
      - "**Imbalance: accuracy misleads.**"
      - "Resampling *can* break calibration in probability models, with no gain. Threshold first."
      - "Werkmora: slow movers as their own slice."
  contracts:
    at: "5:05"
    notes:
      - "**Agree the data with the teams that make it. Three contracts first, where it hurts.**"
      - "Promotions (CCO, Pricing & Promotions) · weather (Data & Analytics + provider) · store stock (COO, Store Operations)."
      - "Each: owner, schema, meaning of key fields, when final, when it lands, who hears before a change."
  meaning:
    at: "5:26"
    notes:
      - "**A schema catches a changed type; it misses a changed meaning** (same flag, set a week later)."
      - "Research describes the leak, engineering the check, only industry the contract."
      - "(Your observation from integration work goes here, if you add one.)"
  write:
    at: "5:48"
    notes:
      - "**Written down: \"available at\" table · three contracts · nightly skew check · leakage question in the PR template.**"
  takeaway:
    at: "5:59"
    notes:
      - "**The card: the idea, the move, what to do on Monday.**"
  next:
    at: "6:05"
    notes:
      - "**Next: splits and validation.**"

text:
  # The title card; the usual belief.
  episode: "AI Product Design · Module 3 · Episode 3.3"
  hook: "“The offline numbers look great. Ship it.”"

  # The case: Kaufman et al. (2011), §2.
  auc-what: "INFORMS 2010 challenge: predict stock price moves, one hour ahead"
  auc-axis-label: "AUC · 1.0 = perfect"
  tick-05: "0.5"
  tick-09: "0.9"
  tick-10: "1.0"
  auc-teams: "≈ 30 teams above 0.9"
  auc-best: "the best: above 0.99"
  auc-why: "The data held variables from the future."
  ibm-title: "IBM: which companies will buy? Read it from their websites"
  ibm-body: "The text was collected after they became customers, so it held words like “Websphere”."
  kaufman-credit: "Kaufman, Rosset & Perlich (2011), KDD, §2"

  # Werkmora's pilot.
  title-werkmora: "Werkmora: the pilot looks great"
  werkmora-tag: "fictional company"
  werkmora: "A home, DIY and garden retailer with about 175 stores in NL, BE and DE. Every night at 01:00 it forecasts demand per store and item for the garden range."
  werkmora-pilot: "In the notebook the pilot beats today’s ERP forecast. The next step would be every store."
  werkmora-question: "Would we know each input at 01:00?"

  # Leakage on a timeline.
  title-leak: "Leakage: training sees what serving will not"
  leak-tag: "Werkmora: fictional"
  time-label: "time"
  now-label: "01:00 · the moment of prediction"
  known: "known: the model may use it"
  after: "after: off limits"
  target-title: "Target leakage: a feature that holds the answer"
  target-body: "“cancellation reason” for churn, filled in after the customer left · IBM’s website text"
  promo-box: "promotion flag"
  promo-late: "set after the promotion"
  temporal-title: "Temporal leakage: the value as it is today"
  temporal-body: "History overwrites. Werkmora’s promotion flags are sometimes updated after the promotion."
  rule: "Learn–predict separation: build each training row only from data that existed at its prediction time."
  rule-werkmora: "Werkmora: an “available at” column per feature; promotion plans kept as they stood"
  rule-credit: "Kaufman, Rosset & Perlich (2011), §4"

  # The quiet kind.
  title-quiet: "Loud leakage, quiet leakage"
  loud-quiet: "Loud: an AUC above 0.99. Quiet: numbers that look plausible."
  value-before: "0.14"
  value-after: "0.01"
  label-before: "before the fix"
  label-after: "after the fix"
  gap-what: "AUC gap, complex ML vs logistic regression, one civil-war paper"
  quiet-what: "12 reproducible papers. 4 had errors: the 4 that said complex ML wins."
  quiet-credit: "Kapoor & Narayanan (2023), Patterns"
  checklist: "A checklist: 8 types of leakage. 3 are about the data: duplicates, illegitimate features, the future. The rest: the split, next episode."

  # Training/serving skew.
  title-skew: "Training/serving skew"
  skew-tag: "Werkmora: fictional"
  box-history: "history: actual weather"
  box-training: "training"
  box-tonight: "01:00: weather forecast"
  box-scoring: "nightly scoring"
  skew-neq: "≠"
  skew-kinds: "Different code, different timing, or a different distribution"
  skew-credit: "Breck et al. (2019), Google"
  fixes: "one feature code · log features at serving · measure the skew every night"
  fixes-credit: "Zinkevich, Rules of ML #29, #32, #37 (Google)"
  issued: "Weather: keep forecasts as issued, from today."

  # The basic checks.
  title-checks: "Basic checks, per feature"
  checks-tag: "Werkmora: fictional"
  row-missing: "Missing"
  row-missing-body: "Impute, drop or flag. Missing is often not random."
  row-missing-werkmora: "Werkmora: no shelf capacity outdoors. Flag it, do not fill in zero."
  row-noisy: "Noisy"
  row-noisy-body: "Filled in but wrong. Noise in the label does the most harm. 65% of stock records wrong at one retailer."
  row-noisy-werkmora: "Werkmora: stock-out flag from the stock record and the sales pattern"
  row-imbalance: "Imbalance"
  row-imbalance-body: "Accuracy misleads. Resampling can break calibration: move the threshold first."
  row-imbalance-werkmora: "Werkmora: slow movers reported as their own slice"
  noisy-credit: "Stock records: DeHoratius & Raman (2008)"
  imbalance-credit: "Resampling: van den Goorbergh et al. (2022), logistic regression"

  # Contracts with the producing teams.
  title-contracts: "Agree the data with the teams that make it"
  contracts-tag: "Werkmora: fictional"
  contract-promotions: "promotions"
  contract-promotions-owner: "CCO · Pricing & Promotions"
  contract-weather: "weather"
  contract-weather-owner: "Data & Analytics + provider"
  contract-stock: "store stock"
  contract-stock-owner: "COO · Store Operations"
  contract-holds: "Each one: owner · schema · what the key fields mean · when a value is final · when it lands · who hears before a change"
  meaning: "A schema catches a changed type. It misses a changed meaning: the same flag, now set a week later."
  three-ways: "Research describes the leak. Engineering describes the check. Only industry describes the contract."
  write: "Write down: the “available at” table · three contracts · a nightly skew check · a leakage question in the PR template"

  # The close.
  takeaway-subtitle: "Episode 3.3 in one card"
  next: "Next episode: splits and validation."
