# Episode 3.3 deck: every word on screen (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-3.ts. Under `npm run dev`
# a refresh of /en/deck/3-3 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the planned time in the episode; keep it in
#           quotes ("0:22"). The presenter notes are not in this file: they stay in the
#           wiki's .slides.md, and under `npm run dev` the presenter view reads and edits them there.
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/03-data-quality-and-leakage.slides.md.
# Adjust the times after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-3.ts as well.

title: "Data quality and leakage"

steps:
  title:
    at: "0:00"
  promise:
    at: "0:05"
  great:
    at: "0:20"
  informs:
    at: "0:30"
  ibm:
    at: "0:49"
  werkmora:
    at: "1:13"
  timeline:
