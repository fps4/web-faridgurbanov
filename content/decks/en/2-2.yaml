# Episode 2.2 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/2-2.ts. Under `npm run dev`
# a refresh of /en/deck/2-2 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
# - cards:  the heading lines of the glossary cards. Their rows come from the kit download, and the
#           closing card's rows and the "In this episode" lines from lib/episodes/part-2.ts, because
#           the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/2-2.ts as well.

title: "Assistant, workflow, agent"

steps:
  recap:
    at: "0:00"
    cue: "Recap: an insurer where a claims handler reads every small home-contents claim by hand. It knows which decision to improve. Now the vendors call."
  promise:
    at: "0:12"
    cue: "In this episode: why one word, agent, covers three different things; all three in one claims product, and where the system acts; the question to ask first."
  word:
    at: "0:25"
    cue: "(Show the word.) And every vendor says the same word: agent."
  split:
    at: "0:30"
    cue: "(Split it.) One word is being used for three different things. And they need different controls."
  assistant:
    at: "0:40"
    cue: "An assistant helps one person while they work. The person decides and acts. Control: their judgement, and a usage policy."
  workflow:
    at: "1:00"
    cue: "A workflow is a fixed process with an AI step inside. The path is written in advance. Control: a scorecard on that AI step."
  agent:
    at: "1:20"
    cue: "An agent chooses its own next steps and takes them in your systems. The AI acts. Control: limited permissions, a person approving what matters."
  line:
    at: "1:40"
    cue: "(Draw the line.) From the people who build these systems: in a workflow the path is written in advance; an agent directs its own process and tools."
  pipe:
    at: "2:00"
    cue: "(Draw the claims pipe.) In our insurer, all three appear in one product. Rule, coverage check, score, route: a workflow."
  letter:
    at: "2:10"
    cue: "The letter drafter is an assistant. It writes the letter; the handler reads it and sends it."
  euro:
    at: "2:25"
    cue: "(Show the euro sign.) At the end of the path, one step is different: the payment. For small, clear, covered claims, nobody looks."
  lock:
    at: "2:40"
    cue: "So that step gets the agent's controls. (Add the lock.) Up to a thousand euros per claim, this policyholder only, a person on every denial."
  control:
    at: "2:55"
    cue: "The control follows who acts, not what the vendor calls it."
  vendor:
    at: "3:00"
    cue: "(Bring in the vendor box.) The platform vendor calls: their triage module is an agent that handles the claim end to end."
  questions:
    at: "3:15"
    cue: "Then it gets the agent questions first. What can it read? What can it change? Who approves its actions? How do we switch it off?"
  see:
    at: "3:30"
    cue: "In your organisation the word is everywhere: the office assistant, the chatbot, the automation from two years ago. When it means everything, nobody can say which control applies."
  move:
    at: "3:55"
    cue: "So use the three words consistently, in every proposal and vendor conversation. Ask which of the three it is first, before features, before price."
  layer:
    at: "4:05"
    cue: "Then decide build, buy or call an API per layer. A bought triage module still needs your scorecard, permissions and approval rules."
  who:
    at: "4:20"
    cue: "The sponsor decides. Architecture and procurement put the question to every vendor, and write the answer down."
  know:
    at: "4:35"
    cue: "You'll know: proposals and vendor answers say which of the three they are, and every capability has an owner who can answer."
  canvas:
    at: "4:55"
    cue: "(Show the cards.) The glossary cards are linked below, in English and Dutch: what the vendor says, what it means, what to ask."
  mark:
    at: "5:05"
    cue: "Start with the first three cards: they decide which controls apply."
  takeaway:
    at: "5:10"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "5:25"
    cue: "In a bank: the assistant drafts the reply to a disputed card payment, the workflow routes it, and the refund under the limit is where the controls go."

