# Episode 3.2 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-2.ts. Under `npm run dev`
# a refresh of /en/deck/3-2 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
# - cards:  the heading lines of the scorecard cards. The scorecard rows come from the kit download,
#           and the closing card's rows and the "In this episode" lines from lib/episodes/part-3.ts,
#           because the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-2.ts as well.
# A Dutch deck is a copy of this file in content/decks/nl/, translated.

title: "A demo is not evidence"

steps:
  recap:
    at: "0:00"
    cue: "Recap: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day."
  promise:
    at: "0:12"
    cue: "In this episode: why five green ticks tell you nothing about next year; the scorecard, and the baselines a model has to beat; what to agree before the work, and re-run on every change."
  demo:
    at: "0:22"
    cue: "(The demo screen.) You’ve seen this meeting. Five claims; the system finds the clause and proposes the right answer. Five green ticks."
  gate:
    at: "0:31"
    cue: "And somebody says: “Let’s go live.”"
  idea:
    at: "0:37"
    cue: "Five claims tell you nothing about the 68,000 it will see next year. And output that looks right lowers your guard."
  confident:
    at: "0:45"
    cue: "(Credit: Perry et al., 2023.) In a controlled study, people using an AI assistant wrote less secure code, and were more likely to believe it was secure. Confidently wrong. So: compared to what, on which cases, measured how?"
  sheet:
    at: "1:09"
    cue: "(The gate and the scorecard sheet.) Before anything is built, this insurer writes a scorecard: rows in euros, one per kind of mistake, and columns for what it has to beat."
  desk:
    at: "1:16"
    cue: "First, today’s desk. It isn’t perfect: about €950,000 a year in fraud paid, about €200,000 lost on valid claims it wrongly denies."
  rule:
    at: "1:25"
    cue: "Second, the simplest rule: glass and small single-item claims under €300, no claim in three years. 30% of small claims; about €61,000 a year paid wrongly, against €748,000 of handling saved."
  payall:
    at: "1:38"
    cue: "Third, “pay everything”. It’s 86% accurate. That’s why the sheet counts euros."
  empty:
    at: "1:44"
    cue: "The model’s column stays empty until it has been run."
  pile:
    at: "1:48"
    cue: "On what? (The pile of past decisions.) Not on past decisions as they are, because they are biased twice."
  labels:
    at: "1:52"
    cue: "Handlers paid most small claims without checking, so “paid” doesn’t mean the claim was valid. And fraud is only known where the fraud desk chose to look. (Credit: Lakkaraju et al., 2017.)"
  verified:
    at: "2:15"
    cue: "So senior handlers and the fraud desk re-check 3,000 claims: the verified set. About €165,000, in the build budget."
  fields:
    at: "2:28"
    cue: "(Strike the two fields.) Who the adjuster was, and whether it was referred for fraud: both filled in after the decision. (Credit: Kaufman et al., 2012.) Leave them in, and the model looks brilliant and is useless."
  photo:
    at: "2:50"
    cue: "(The photo slide.) Evidence can be anywhere. In a real Dutch case, a clock in the photos showed they were taken before the policy started."
  move:
    at: "3:03"
    cue: "So agree it all before the work: the cases that matter, including the rare ones;"
  prices:
    at: "3:07"
    cue: "the price of each mistake;"
  baselines:
    at: "3:10"
    cue: "the baselines: today’s process and the simplest rule;"
  bar:
    at: "3:14"
    cue: "the threshold, and the bar below which it doesn’t go live."
  loop:
    at: "3:18"
    cue: "(The loop arrow.) Then re-run the scorecard on every change: new model, new prompt, new rule, new threshold, a new version of the policy conditions."
  commit:
    at: "3:33"
    cue: "A threshold agreed before the work is a commitment. The same threshold discussed afterwards is a negotiation. And it will be lost."
  who:
    at: "3:43"
    cue: "The Product Owner and the head of claims own the scorecard. Senior handlers and the fraud desk own the verified set. Engineering makes the re-run automatic."
  know:
    at: "3:57"
    cue: "(The gate opens.) No go-live without a scorecard result against the desk and the rule; a threshold written down before the first build; a verified set with a name next to it."
  canvas:
    at: "4:14"
    cue: "(Show the scorecard, blank and filled in.) The scorecard template is linked below."
  mark:
    at: "4:19"
    cue: "The verified set: its size, and the fields that come out."
  takeaway:
    at: "4:24"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "4:38"
    cue: "In a bank’s lending, you only know who repaid among the people you lent to. Same trap, same fix: a verified set and a baseline."

