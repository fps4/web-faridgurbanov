# Episode 2.1 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/2-1.ts. Under `npm run dev`
# a refresh of /en/deck/2-1 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
# - cards:  the heading lines of the approach ladder cards. Their rows come from the kit download, and
#           the closing card's rows and the "In this episode" lines from lib/episodes/part-2.ts,
#           because the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/2-1.ts as well.

title: "Start at the bottom of the ladder"

steps:
  recap:
    at: "0:00"
    cue: "Recap: an insurer where a claims handler reads every small home-contents claim by hand. The decision is framed. Now: what do we build it with?"
  promise:
    at: "0:12"
    cue: "In this episode: four ways to build it, from a three-line rule up; one claims product on three rungs; one question to ask of every AI proposal."
  rule:
    at: "0:25"
    cue: "(Draw the ladder, bottom up.) Think of the options as a ladder. At the bottom, a rule: a few lines anyone can read and change."
  classical:
    at: "0:35"
    cue: "Above it, a classical model. It learns from tables you already have and gives a score."
  foundation:
    at: "0:45"
    cue: "Above that, a foundation model through an API: the kind behind a chatbot, used as a service. It reads and writes text, and reads images."
  adapted:
    at: "1:00"
    cue: "At the top, an adapted model: the same, trained further on your own material."
  bars:
    at: "1:05"
    cue: "(Grow the bars.) Each rung up costs more: data, money every time it runs, effort to explain, scarcer people."
  climb:
    at: "1:20"
    cue: "So you start at the bottom, and climb only when the rung below fails. (Show the tag.) Fails on the scorecard, a measured result."
  zinkevich:
    at: "1:35"
    cue: "This comes from the builders. Google's Rules of Machine Learning: don't be afraid to launch a product without machine learning."
  stack:
    at: "1:50"
    cue: "(Show the stack of claims, labelled synthetic.) Our insurer gets 68,000 small claims a year."
  slice:
    at: "2:00"
    cue: "(Drop the slice.) Bottom rung first. A three-line rule takes thirty percent off the desk. About twenty thousand claims."
  cost:
    at: "2:15"
    cue: "Wrong sometimes? About two percent, roughly sixty thousand euros a year. Against about seven hundred and fifty thousand euros of handler time."
  baseline:
    at: "2:35"
    cue: "Wrong more often than a model, and still the right choice. It works on day one, everybody can read it, and it becomes the baseline."
  rest:
    at: "2:50"
    cue: "(Move the rest up one rung.) History, policy data, claim type are tables. A classical model scores how likely a claim is to be fraudulent or not covered."
  language:
    at: "3:05"
    cue: "(Show the three boxes.) The language model only where language is the work. It proposes. It never decides."
  top:
    at: "3:25"
    cue: "(Grey out the top rung.) Training a model on the insurer's own claims: nobody here needs it. Not yet. That's the ladder working."
  car:
    at: "3:35"
    cue: "Where reading the picture is the decision, estimating car damage from photos, the higher rungs earn their place. A different product."
  see:
    at: "3:45"
    cue: "Look at the proposals on your desk. Most name the model on page one, before anyone says what the decision is."
  eiopa:
    at: "4:00"
    cue: "A third of European insurers already use generative AI in claims, and more than half plan to (EIOPA, 2026)."
  move:
    at: "4:10"
    cue: "So ask one question of every proposal: which rung is this, and why not the one below? The answer you want is a result."
  steps:
    at: "4:25"
    cue: "And break the product into steps first. One product can use three rungs. Ours does."
  who:
    at: "4:35"
    cue: "The sponsor asks the question. Architecture answers it. Whoever writes the proposal puts the answer on page one."
  know:
    at: "4:50"
    cue: "You'll know: proposals arrive with a rung for each step, and the result that justified it. Some get smaller."
  canvas:
    at: "5:10"
    cue: "(Show the card.) The approach ladder card is linked below, blank and filled in for the claims case."
  mark:
    at: "5:18"
    cue: "Three steps of the product, three rungs: the rule, the score, the reading."
  takeaway:
    at: "5:25"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "5:45"
    cue: "In a retailer, refunds for damaged orders: a rule for small first-time refunds before any model. Same ladder, same first rung."

text:
  # Recap: the title card.
  episode: "AI Product Design · Part 2 · Episode 2.1"
  recap: "Our running example: an insurer where a claims handler reads every small home-contents claim by hand. The decision is framed. Now: what do we build it with?"
  recap-tag: "a worked example · synthetic numbers"

  # The idea: the ladder, its cost, the rule for climbing.
  title-idea: "Start at the bottom of the ladder."
  label-rule: "1 · rule"
  label-classical: "2 · classical model"
  label-foundation: "3 · foundation model through an API"
  label-adapted: "4 · adapted model"
  bars-legend: "each rung up: more data, cost per use, effort to explain, skills to run"
  climb-tag: "what did the rung below fail on?"
  quote: "Rule #1: “Don’t be afraid to launch a product without machine learning.”"
  quote-source: "Zinkevich, Rules of Machine Learning (Google)"

  # In the case: one product, three rungs.
  title-case: "At our insurer: one product, three rungs"
  stack-label: "68,000 small claims a year"
  stack-tag: "synthetic"
  slice-label: "30% · 20,400"
  saved: "€748,000 saved"
  wrong: "€61,000 wrong"
  baseline: "→ the baseline the model has to beat"
  rest: "the rest: a score"
  rest-score: "not genuine or not covered?"
  read: "read the description and photos"
  clause: "find the clause"
  letter: "draft the letter"
  proposes: "proposes, never decides"
  label-adapted-grey: "4 · adapted model"
  not-yet: "not needed, yet"
  car: "where reading the photo is the decision, as with car damage, the higher rungs earn their place"

  # What you see, and the move.
  see: "proposals name the model on page one"
  eiopa: "A third of European insurers use generative AI in claims; more than half plan to."
  eiopa-source: "EIOPA, Generative AI Market Survey, February 2026"
  title-move: "Which rung is this, and why not the one below?"
  three-rungs: "one product, three rungs"
  who: "The sponsor asks. Architecture answers. The proposal puts the answer on page one."
  know: "You’ll know: a rung for each step, with the result that justified it."

  # The download, and the close.
  canvas-title: "The approach ladder card: blank, and filled in"
  takeaway-subtitle: "Episode 2.1 in one card"
  swap: "In a retailer: a rule for small first-time refunds before any model. Same ladder, same first rung."

cards:
  ladder-blank:
    title: "Approach ladder card"
    subtitle: "Side 1 · The ladder · blank"
  ladder-claims:
    title: "Approach ladder card"
    subtitle: "Side 2 · The claims product, step by step"
