# Episode 5.2 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/5-2.ts. Under `npm run dev`
# a refresh of /en/deck/5-2 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves. The six steps of the
#           strip are step-1 … step-6, each with its level and who approves.
# - cards:  the heading lines of the card slides. The card rows come from the kit download, and
#           the closing card's rows and the "In this episode" lines from lib/episodes/part-5.ts,
#           because the part page shows them too.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/5-2.ts as well.
# A Dutch deck is a copy of this file in content/decks/nl/, translated.

title: "Automation is a dial"

steps:
  recap:
    at: "0:00"
    cue: "Recap: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day. The question now: how much should the system do before a person looks?"
  promise:
    at: "0:20"
    cue: "In this episode: why “human in the loop” is a slogan, and a dial is a design; six steps of one claims desk, with the dial set for each; a test week with known errors in, before you launch."
  switch:
    at: "0:30"
    cue: "(Show the switch.) Most proposals treat it as a switch: either human in the loop, or fully automated."
  crossout:
    at: "0:38"
    cue: "(Cross it out.) It is neither. Automation is a dial."
  trust:
    at: "0:45"
    cue: "People can use automation well, rely on it too much, or stop using it. Too much and too little trust are both failures. You want calibrated trust, and it differs per step."
  strip:
    at: "1:00"
    cue: "(Show the six steps.) So the dial is set per step, for each step of the product."
  read:
    at: "1:05"
    cue: "Reading the claim and finding the right version of the conditions: automatic, but shown to the handler, who can correct it."
  coverage:
    at: "1:13"
    cue: "The coverage check: a suggestion, with the clause quoted. The handler decides."
  small:
    at: "1:20"
    cue: "A small, covered, low-scoring claim up to €1,000: paid automatically. Nobody approves each one; the head of claims signs the threshold and the cap, and 2% are audited. The policyholder is told, with one button to reach a person."
  other:
    at: "1:38"
    cue: "Other claims: a suggestion and a drafted letter. Override is one click, and the reason is kept."
  denial:
    at: "1:45"
    cue: "A denial: never automatic. A person decides, and the letter names the clause and the route to complain."
  fraud:
    at: "1:55"
    cue: "Suspected fraud: never an automatic accusation. The fraud desk investigates; the policyholder never sees a score. The Belgian Ombudsman: suspicion alone must not lead to disproportionate sanctions."
  rule:
    at: "2:10"
    cue: "(Pause on the full strip.) The rule: the harder an action is to undo, and the more it harms the person it lands on, the further the dial turns towards a person."
  eiopa:
    at: "2:20"
    cue: "European insurers describe their own claims AI the same way: to support, not replace, human claims handlers."
  seen:
    at: "2:30"
    cue: "In your organisation: “human in the loop” on a slide, and a person who accepts almost everything."
  counter:
    at: "2:38"
    cue: "(Show the 99% counter.) If your handlers agree with 99% of the suggestions, that is not proof of quality. It may be a rubber stamp."
  bias:
    at: "2:48"
    cue: "Automation bias “occurs in both naive and expert participants” and “cannot be prevented by training or instructions.” The person meant to catch the errors is the one most exposed to missing them."
  move:
    at: "3:05"
    cue: "So, two things."
  levels:
    at: "3:10"
    cue: "First: choose the level per step, and write down who approves at each level. Hard-to-undo actions, a denial or an accusation, stay with a person."
  seeded:
    at: "3:22"
    cue: "Second: test with errors in. (Show the seeded week.) For one week, mix known-wrong suggestions into the queue, built from past claims that are already settled, so a miss harms nobody."
  count:
    at: "3:32"
    cue: "Count how many the handlers catch. Agree before you start what catch rate is good enough."
  tell:
    at: "3:40"
    cue: "Tell the team a test week is coming; don't tell them which claims."
  who:
    at: "3:45"
    cue: "The Product Owner proposes the levels. The head of claims signs them, because they own the outcome. The handlers' team lead runs the test week."
  know:
    at: "4:00"
    cue: "You'll know: every step has a level and a named approver on one page; the seeded errors are caught at the agreed rate; override and contest rates are reported, and every change explained."
  canvas:
    at: "4:20"
    cue: "(Show the card.) The automation and failure card is linked below, with the test week on its back."
  mark:
    at: "4:28"
    cue: "(Mark the rows.) What the seeded items are, and the catch rate, agreed before the week."
  takeaway:
    at: "4:35"
    cue: "(Show the episode card.) In one card: the idea, the move, Monday, and the download."
  swap:
    at: "4:50"
    cue: "In a bank, a small disputed card payment can be refunded automatically, a fraud suspicion never; in government, the bar is higher still. Same dial, set per step."

text:
  # Recap: the title card.
  episode: "AI Product Design · Part 5 · Episode 5.2"
  recap: "Our running example: an insurer where a claims handler reads every small home-contents claim by hand, and wants the clear ones paid the same day."
  recap-tag: "a worked example · synthetic numbers"

  # The idea: a dial, not a switch.
  title-idea: "Human in the loop, or fully automated?"
  sw-left: "human in the loop"
  sw-right: "fully automated"
  not-switch: "not a switch"
  dial-line: "Automation is a dial."
  trust: "Too much trust and too little trust are both failures. What you want is calibrated trust, and it differs per step."
  credit: "after Parasuraman & Riley, Humans and Automation, Human Factors, 1997"

  # In the case: six steps, a dial under each.
  title-case: "One claims desk: six steps, six dials"
  cap-tag: "synthetic"
  step-1: "read the claim"
  step-2: "coverage check"
  step-3: "small & clear ≤ €1,000"
  step-4: "other claims"
  step-5: "denial"
  step-6: "suspected fraud"
  level-1: "automatic, shown"
  level-2: "suggestion"
  level-3: "automatic"
  level-4: "suggestion"
  level-5: "person decides"
  level-6: "person decides"
  approver-1: "the handler can correct it"
  approver-2: "the handler decides"
  approver-3: "nobody per claim; the head of claims signs the cap; 2% audited"
  approver-4: "the handler; override in one click"
  approver-5: "the handler, always"
  approver-6: "fraud desk investigates"
  rule: "The harder it is to undo, and the more it harms the person it lands on, the further the dial turns towards a person."
  eiopa: "European insurers on their claims AI: “to support, not replace, human claims handlers”."
  eiopa-source: "EIOPA, Generative AI Market Survey, February 2026"

  # What you see.
  seen: "“Human in the loop” on a slide, and a person who accepts almost everything."
  agree: "handlers agree: 99%"
  warn-mark: "!"
  agree-tag: "synthetic"
  bias: "Automation bias “occurs in both naive and expert participants” and “cannot be prevented by training or instructions.”"
  bias-source: "Parasuraman & Manzey, Human Factors, 2010"

  # The move.
  title-move: "Set the dial per step. Then test it with errors in."
  move-1: "1  A level and an approver for every step. Hard to undo stays with a person."
  locked-5: "locked"
  locked-6: "locked"
  move-2: "2  One seeded week before launch."
  stack-label: "past, settled claims"
  queue-label: "this week’s queue"
  queue-note: "≈ 1,300 small claims"
  queue-tag: "synthetic"
  caught: "caught ✓  ·  missed ✗"
  agreed: "catch rate agreed before the week"
  tell: "the team knows a test week is coming, not which claims"
  who: "Whose move: the Product Owner proposes the levels, the head of claims signs them, the team lead runs the week."
  know: "You’ll know: a level and an approver per step, on one page; seeded errors caught at the agreed rate; every change in override and contest rates explained."

  # The download, and the close.
  canvas-title: "The automation and failure card: the test week, blank and filled in"
  takeaway-subtitle: "Episode 5.2 in one card"
  swap: "In a bank, a small disputed card payment can be refunded automatically; a fraud suspicion, never. Same dial, set per step."

cards:
  test-blank:
    title: "Automation and failure card"
    subtitle: "Side 2 · Test with errors in · blank"
  test-claims:
    title: "Automation and failure card"
    subtitle: "Test with errors in · filled in for the claims example"
