# Episode 3.10 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-10.ts. Under `npm run dev`
# a refresh of /en/deck/3-10 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the planned time in the episode; keep it in
#           quotes ("0:22"). `notes` are what the presenter view shows: the presenter notes, copied
#           from the wiki's .slides.md by `npm run notes`. Edit them there, not here.
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/10-feedback-loops.slides.md.
# Adjust the times after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-10.ts as well.

title: "Feedback loops"

steps:
  title:
    at: "0:00"
    notes:
      - "**Episode 3.10 — feedback loops.**"
  promise:
    at: "0:04"
    notes:
      - "**In this episode: how a model changes the data it learns from, three countermeasures, outcomes from day one.**"
  retrain:
    at: "0:17"
    notes:
      - "**\"We retrain every month, so the model keeps getting better.\"** The usual belief."
      - "It treats live data as neutral. After go-live, part of it is made by the model."
      - "→ Where that happens at Werkmora."
  werkmora:
    at: "0:35"
    notes:
      - "**Werkmora — fictional home, DIY and garden retailer; this module's garden forecast.**"
      - "The loop: forecast → store order → stock on the shelf → sales → next training data."
  shelf:
    at: "0:55"
    notes:
      - "**Forecast too low → small order → empty shelf on Saturday → no more sales recorded.**"
      - "An empty shelf records low sales, not low demand (the censored label of 3.2)."
  learns:
    at: "1:12"
    notes:
      - "**The next model learns low demand, and orders less again.**"
      - "The model picked part of its own training data."
      - "→ This has a name."
  direct:
    at: "1:26"
    notes:
      - "**Direct feedback loop** — Sculley et al. (2015, Google): a model that may influence the selection of its own future training data."
  hidden:
    at: "1:39"
    notes:
      - "**Hidden loop: two systems act on each other through the world.**"
      - "Werkmora: the markdown tool works on the same garden items; its price cuts change sales, which feed the forecast."
  showed:
    at: "1:58"
    notes:
      - "**One trap, three shapes. A recommender learns only about what it showed.**"
  fraud:
    at: "2:10"
    notes:
      - "**A fraud model never learns whether what it blocked was fraud.**"
      - "The rest: labels late, only when someone checks or complains. *Selective labels* (Lakkaraju et al. 2017; Dal Pozzolo et al. 2018)."
  same:
    at: "2:25"
    notes:
      - "**The forecast: the empty shelf hides demand the same way.**"
      - "Say it plainly: no published study has measured such a loop in a live product. Simulations show it *can* narrow a model."
      - "→ But the fixes are measured."
  yahoo:
    at: "2:45"
    notes:
      - "**Yahoo!, 2010, front-page news.** Mostly the best guess; a small share of traffic random; the random traffic recorded."
  random:
    at: "3:04"
    notes:
      - "**Any policy \"can be reliably evaluated offline using previously recorded random traffic\".**"
      - "12.5% click lift, over 33 million events — in that study."
      - "The random share teaches you about items the old model would never show."
      - "→ Three countermeasures."
  explore:
    at: "3:26"
    notes:
      - "**One: exploration — a small share of random choices.**"
      - "For a forecast: ordering away from it = dead plants or empty shelves. Werkmora likely says no — and writes the decision down."
  log:
    at: "3:45"
    notes:
      - "**Two: a decision log — what was shown, why, model version, the probability of each choice.**"
      - "Werkmora, per store × item × day: forecast, order proposed and sent, override and reason, stock, sales, write-offs."
  control:
    at: "4:10"
    notes:
      - "**Three: a control group — a slice the model does not touch.**"
      - "Comparable stores stay on the ERP forecast; they may do worse; the CCO and the COO decide."
      - "Shadow mode cannot test a loop (Shankar §4.4.3)."
  duo:
    at: "4:35"
    notes:
      - "**DUO, NL: home checks picked by a risk profile only (2012–2023).**"
      - "Indirect discrimination; apology 1 March 2024; random sample since June 2023."
      - "A risk profile, no ML — the fix is the same."
  outcomes:
    at: "4:56"
    notes:
      - "**Capture outcomes from day one: corrections, accept/reject, final resolutions.**"
      - "No fresh labelled live data → nothing to retrain on (Shankar)."
      - "Werkmora: stock-out flag · plant write-offs on the handheld · overrides with a reason."
  close:
    at: "5:21"
    notes:
      - "**Who owns the loop.** Data engineering: the log from night one. Store Operations: stock-out flag and write-offs. CCO and COO: the control stores."
      - "A month later: override reasons show three item groups planners distrust (fictional)."
      - "(Your engineering view here, if you add one.)"
  law:
    at: "5:46"
    notes:
      - "**EU AI Act Art. 10(2)(f) and 15(4) write the same trap down** — high-risk only; the forecast is not one."
  takeaway:
    at: "6:01"
    notes:
      - "**The card: the idea, the move, what to do on Monday.**"
  next:
    at: "6:08"
    notes:
      - "**Next: people and roles.**"

text:
  # The title card and the usual belief.
  episode: "AI Product Design · Module 3 · Episode 3.10"
  belief: "“We retrain on the new data every month, so the model keeps getting better.”"
  belief-tag: "the usual belief"
  belief-made: "After go-live, part of that new data is made by the model."

  # Werkmora's loop.
  title-loop: "Werkmora: the forecast feeds its own data"
  werkmora-line: "A home, DIY and garden retailer. Every night the garden forecast feeds the store orders."
  werkmora-tag: "fictional company"
  node-forecast: "forecast"
  node-order: "store order"
  node-shelf: "stock on the shelf"
  node-sales: "sales"
  node-training: "training data"
  shelf-empty: "empty on Saturday"
  shelf-text: "An empty shelf records low sales, not low demand."
  shelf-chain: "forecast too low → small order → empty shelf → no more sales recorded"
  learn-mark: "learns: low demand"
  learns: "The next model learns low demand, and orders less again."
  loop-direct: "Direct loop: the model picks part of its own future training data."
  sculley-credit: "Sculley et al. (2015), Hidden Technical Debt in Machine Learning Systems"
  loop-hidden: "Hidden loop: two systems act on each other through the world."
  node-markdown: "markdown tool"

  # One trap, three shapes.
  title-shapes: "One trap, three shapes"
  shape-recommender: "A recommender"
  shape-recommender-body: "learns only about the items it showed. An item never shown never gets a click."
  shape-fraud: "A fraud model"
  shape-fraud-body: "never learns if the transactions it blocked were fraud. The other labels come late, when someone checks or complains."
  labels-credit: "Selective labels: Lakkaraju et al. (2017); Dal Pozzolo et al. (2018)"
  shape-forecast: "The forecast"
  shape-forecast-body: "an empty shelf hides demand."
  plainly: "No published study has measured such a loop in a live product. Simulations show it can narrow a model over time."
  sim-credit: "Simulations: Chaney et al. (2018); Ensign et al. (2018)"

  # Yahoo!: a little randomness, recorded.
  title-yahoo: "Yahoo!, 2010: a little randomness, recorded"
  yahoo-what: "Front-page news: mostly the article the system thought best, a small share at random."
  label-best: "best guess"
  label-random: "random"
  log-label: "recorded: the random traffic, what was shown, and the clicks"
  offline-label: "test any new policy offline, on the recorded traffic"
  yahoo-quote: "Any policy “can be reliably evaluated offline using previously recorded random traffic”."
  yahoo-credit: "Li, Chu, Langford & Schapire (2010), WWW. Yahoo! Labs about its own system."
  lift: "12.5%"
  lift-label: "click lift on over 33 million events, in that study"

  # Three countermeasures.
  title-counter: "Three countermeasures"
  counter-tag: "Werkmora: fictional"
  c-explore: "Exploration"
  c-explore-werkmora: "A small share of random choices. For a forecast: dead plants or empty shelves. Werkmora likely says no, and writes the decision down."
  c-log: "Decision log"
  c-log-werkmora: "What was shown and why, the model version, the probability of each choice. Per store × item × day: forecast, order proposed and sent, override and reason, stock, sales, write-offs."
  c-control: "Control group"
  c-control-werkmora: "A slice the model does not touch. Comparable stores stay on the ERP forecast. They may do worse; the CCO and the COO decide."
  duo-head: "DUO, NL, 2012–2023: home checks picked by a risk profile only"
  duo-body: "Indirect discrimination; apology in March 2024. Since June 2023: a random sample."
  duo-credit: "Rijksoverheid, 1 March 2024. A risk profile, no machine learning."

  # Capture outcomes from day one.
  title-outcomes: "Capture outcomes from day one"
  outcomes-what: "Corrections · accept or reject · final resolutions. Without fresh labelled live data there is nothing to retrain on."
  outcomes-credit: "Shankar et al. (2024)"
  outcomes-tag: "Werkmora: fictional"
  out-stockout: "stock-out flag"
  out-stockout-body: "stock = 0 at opening: that day is “demand at least this”"
  out-waste: "plant write-offs"
  out-waste-body: "booked on the handheld the day the plant goes out"
  out-override: "overrides"
  out-override-body: "every change by the replenishment team, with its reason"
  outcomes-log: "All of it logged from the first night of the pilot."

  # Who owns the loop.
  title-close: "Who owns the loop"
  close-tag: "Werkmora: fictional"
  own-log: "Data engineering"
  own-log-body: "the decision log, from the first night"
  own-stock: "Store Operations"
  own-stock-body: "the stock-out flag and the write-offs"
  own-control: "CCO and COO"
  own-control-body: "the control stores, and what they may cost"
  month: "A month later: the override reasons show three item groups where planners distrust the forecast."
  law: "EU AI Act, Art. 10(2)(f) and 15(4): outputs that influence future inputs. For high-risk systems; the forecast is not one."

  # The close.
  takeaway-subtitle: "Episode 3.10 in one card"
  next: "Next episode: people and roles."
