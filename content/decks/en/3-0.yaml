# Episode 3.0 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-0.ts. Under `npm run dev`
# a refresh of /en/deck/3-0 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the planned time in the episode; keep it in
#           quotes ("0:22"). `notes` are what the presenter view shows: the presenter notes, copied
#           from the wiki's .slides.md by `npm run notes`. Edit them there, not here.
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/00-intro.slides.md.
# Adjust the times after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-0.ts as well.

title: "Data and model requirements"

steps:
  title:
    at: "0:00"
    notes:
      - "**Episode 3.0 — the intro to data and model requirements.**"
  promise:
    at: "0:05"
    notes:
      - "**In this episode: why the model is the small part, the three mental models, and the company.**"
  werkmora:
    at: "0:20"
    notes:
      - "**Werkmora — made up, built from public facts of real retailers.** Say it every module."
      - "Home, DIY and garden · about 175 stores in NL, BE, DE · a webshop."
      - "The garden season decides the year."
  forecast:
    at: "0:43"
    notes:
      - "**This module: the garden replenishment forecast.**"
      - "Daily demand per store × item, 1–21 days ahead → feeds the store orders."
      - "Success = fewer empty shelves *and* fewer dead plants."
  usual:
    at: "1:06"
    notes:
      - "**\"Which algorithm do we scale?\"** — the pilot has a good offline score."
      - "The usual picture: pick the algorithm, train it, done."
      - "→ A different picture."
  box:
    at: "1:25"
    notes:
      - "**2015, engineers at Google: the model code is a small box.**"
  around:
    at: "1:39"
    notes:
      - "**Data feeds it · labels teach it · evaluation proves it · serving runs it · monitoring notices when it stops.**"
  requirements:
    at: "1:55"
    notes:
      - "**So most requirements are for the system around the model, not the algorithm.**"
      - "→ Three mental models."
  spec:
    at: "2:07"
    notes:
      - "**One: data is the specification.** Code → behaviour written; ML → behaviour learned."
      - "What the data covers and leaves out *is* the spec."
  amazon:
    at: "2:29"
    notes:
      - "**Amazon, 2014–2017:** experimental tool to rate applicants, ten years of résumés, mostly from men; penalised \"women's\"."
      - "Recruiters never relied only on it; team disbanded. Reuters, 2018."
  scores:
    at: "2:51"
    notes:
      - "**Two: the model scores, the product decides.**"
      - "Werkmora: a quantity, not an order. Safety stock turns it into one."
      - "Empty shelves vs dead plants → a business choice. CCO and COO decide the service level."
  start:
    at: "3:15"
    notes:
      - "**Three: shipping is the start.**"
      - "The world drifts — and sometimes the source owner changes the system."
      - "Monitoring, retraining, fresh outcomes: written before launch."
  map:
    at: "3:36"
    notes:
      - "**The module walks the diagram one box at a time.**"
      - "Before the model (3.1–3.4) · after it (3.5–3.7) · over time (3.9, 3.10, 3.12)."
  takeaway:
    at: "3:53"
    notes:
      - "**The card: the idea, the move, what to do on Monday.**"
  next:
    at: "4:00"
    notes:
      - "**Next: data requirements.**"

text:
  # The title card.
  episode: "AI Product Design · Module 3 · Episode 3.0 · Intro"

  # Werkmora and this module's use.
  title-werkmora: "Werkmora"
  werkmora-tag: "fictional company"
  fact-made-up: "Made up: built from public facts of real retailers"
  fact-sector: "Home, DIY and garden · about 175 stores in NL, BE and DE"
  fact-stores: "Big stores with a garden centre, small city stores, a webshop"
  fact-season: "The garden season decides the year"
  forecast-title: "This module: the garden replenishment forecast"
  forecast-what: "Daily demand per store and item, 1 to 21 days ahead. It feeds the store orders."
  forecast-success: "Success: fewer empty shelves on spring weekends and fewer dead plants."

  # The usual picture.
  question: "“Which algorithm do we scale?”"
  usual: "The usual picture: pick the algorithm, train it, done."
  pilot: "Werkmora’s regional pilot has a good offline score. Nobody has drawn the system around it."

  # The small box in the large diagram.
  title-diagram: "A small box in a large diagram"
  box-model: "model"
  box-data: "data"
  box-labels: "labels"
  box-evaluation: "evaluation"
  box-serving: "serving"
  box-monitoring: "monitoring"
  diagram-credit: "After Sculley et al. (2015), Fig. 1: an illustration, no percentage in it."
  requirements: "Requirements for an AI product are mostly requirements for the system around the model."

  # The three mental models.
  mm-spec: "1 · Data is the specification"
  mm-spec-body: "In software you write the behaviour in code. In ML it is learned from data, so what the data covers, and leaves out, is the specification."
  amazon: "Amazon, 2014–2017: an experimental tool to rate job applicants, trained on ten years of résumés, mostly from men. It penalised “women’s”."
  amazon-credit: "Reuters, 10 Oct 2018"
  mm-scores: "2 · The model scores. The product decides."
  mm-scores-body: "A forecast gives a quantity, not an order. Safety stock turns it into one: a business choice about the cost of each kind of error."
  box-decision: "decision"
  mm-scores-werkmora: "Werkmora: the service level per item group. The CCO and the COO decide it."
  mm-start: "3 · Shipping is the start"
  mm-start-body: "A model gets worse as the world drifts away from its training data, or when the owner of a source changes it."
  mm-start-werkmora: "Monitoring, retraining and fresh outcomes: written down before launch."

  # How the module walks the diagram.
  title-map: "This module, one box at a time"
  part-before: "Before the model"
  part-before-episodes: "data requirements, labels, quality and leakage, splits · 3.1–3.4"
  part-after: "After the model"
  part-after-episodes: "metrics, thresholds and operating points, baselines · 3.5–3.7"
  part-time: "Over time"
  part-time-episodes: "prototype to production, feedback loops, what it costs · 3.9, 3.10, 3.12"
  part-around: "Around it"
  part-around-episodes: "non-functional requirements, people and roles · 3.8, 3.11"

  # The close.
  takeaway-subtitle: "Episode 3.0 in one card"
  next: "Next episode: data requirements."
