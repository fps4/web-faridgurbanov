  part-after: "After the model"
  part-after-episodes: "metrics, thresholds and operating points, baselines · 3.5–3.7"
  part-time: "Over time"
  part-time-episodes: "prototype to production, feedback loops, what it costs · 3.9, 3.10, 3.12"
  part-around: "Around it"
