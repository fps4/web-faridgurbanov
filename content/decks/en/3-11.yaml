# Episode 3.11 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-11.ts. Under `npm run dev`
# a refresh of /en/deck/3-11 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/11-people-and-roles.slides.md.
# Times assume about 125 words a minute; adjust them after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-11.ts as well.

title: "People and roles"

steps:
  title:
    at: "0:00"
    cue: "Episode 3.11 of AI Product Design: people and roles."
  promise:
    at: "0:04"
    cue: "In this episode: the seven roles of an AI project, read as seven decisions. The roles most lists leave out. And who has the power to stop a model."
  team:
    at: "0:18"
    cue: "“We hired two data scientists, so we have an AI team.” I hear it often. In that picture a role is a job title, and the project belongs to the data team."
  poaching:
    at: "0:34"
    cue: "A real case. In 2021, Google researchers interviewed people who build AI in high-stakes fields. One team had a model that predicted where poaching would happen, for conservation in India. After deployment, the patrollers contested the predicted locations. Most poaching attacks were not in the data."
  late:
    at: "0:56"
    cue: "The people who knew where poaching happens were in the project. But in the study’s words, they were “largely involved in data collection or trouble-shooting, rather than in deep, end-to-end engagements”. They had no seat at the start, where the problem is defined."
  werkmora:
    at: "1:16"
    cue: "Back to Werkmora, our fictional home, DIY and garden retailer, with about 175 stores in three countries. In this module it builds a nightly forecast for every store and item. Data and Analytics has four data scientists and a pilot in one region. The business calls it “the data team’s project”."
  product:
    at: "1:41"
    cue: "The guide lists seven roles. Read each one as a decision someone owns. The product manager owns the problem, the value case, the metrics and the threshold. At Werkmora the Director Supply Chain owns the forecast. The CCO and the COO set the service level, not the data team."
  domain:
    at: "2:04"
    cue: "The domain expert owns what a label means, the edge cases, and whether the output makes sense. And from the start. In the same study, 43.4 percent of practitioners saw data cascades triggered by too little domain expertise. RAND found the same in 2024: a misunderstood problem is the most common root cause. At Werkmora, two planners and a store garden manager join the label discussion before the first backtest."
  builders:
    at: "2:38"
    cue: "Then the builders. The data scientist owns the model and how it is evaluated. The ML engineer runs training and serving. The data engineer owns the pipelines. A study of 28 organisations found that requirements need a data scientist’s prototype, and that the engineering effort is often underestimated. Werkmora has no ML engineer, so a data engineer or the platform team takes that seat."
  designer:
    at: "3:09"
    cue: "The designer owns how a prediction reaches people, and how they correct it. At Werkmora: how a planner sees an order line, changes it, and gives a reason."
  legal:
    at: "3:22"
    cue: "Legal, privacy and risk: data rights, regulation, accountability. At Werkmora, that is the weather licence. And a question for the data protection officer and the works council: may the override log keep the planner’s name?"
  overlap:
    at: "3:39"
    cue: "These roles overlap. There are no hand-offs. In one study, the product team validated every model change in production. And a Google paper calls a hard line between research and engineering “counter-productive”."
  compare:
    at: "3:54"
    cue: "Compare an MLOps paper from 2023. Seven roles too, but no domain expert, no designer and no legal. Instead it has a solution architect, a software engineer and DevOps. The guide is wider on the business side, theirs on engineering."
  integrator:
    at: "4:13"
    cue: "As an engineer, I would add their integrator. Getting the model into the product is a hard point in the research. At Werkmora the forecast must reach the ERP order process, so the integration team is in from the start."
  frontline:
    at: "4:33"
    cue: "Neither list names the front line. At Werkmora the store staff count stock and book plant write-offs. Without them there is no waste label. And neither list names the labellers."
  stop:
    at: "4:47"
    cue: "Last question: who can switch the model off? At the start of COVID-19, Michigan’s clinical AI governance committee switched off the Epic sepsis model, because the link between fever and sepsis had changed. The authors ask that clinicians can report concerns easily, and that a governance team owns monitoring and updating."
  switch:
    at: "5:12"
    cue: "At Werkmora it is written down. The Director Supply Chain can switch the stores back to the ERP forecast at any time. The data team can do it at night, if the batch fails. Planners and store managers report “this looks wrong” in one channel, read every morning."
  page:
    at: "5:35"
    cue: "So write one page for the forecast: the owner, the threshold owners, the data owners, the domain experts, the front line, engineering, legal, and the person who can stop it."
  month:
    at: "5:49"
    cue: "A month later, the label rules changed once. A store garden manager pointed out that plants in the clearance corner are not waste yet. And the board’s question, “whose project is this?”, has a one-line answer."
  takeaway:
    at: "6:06"
    cue: "In one card: the idea, the move, and what to do on Monday."
  next:
    at: "6:12"
    cue: "In the next episode: what it costs."

