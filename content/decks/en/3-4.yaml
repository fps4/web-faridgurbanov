# Episode 3.4 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-4.ts. Under `npm run dev`
# a refresh of /en/deck/3-4 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the planned time in the episode; keep it in
#           quotes ("0:22"). `notes` are what the presenter view shows: the presenter notes, copied
#           from the wiki's .slides.md by `npm run notes`. Edit them there, not here.
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/04-splits-and-validation.slides.md.
# Adjust the times after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-4.ts as well.

title: "Splits and validation"

steps:
  title:
    at: "0:00"
    notes:
      - "**Episode 3.4 — splits and validation.**"
  promise:
    at: "0:04"
    notes:
      - "**In this episode: what a split is for, how to choose random, time or group, why the test set is spent once.**"
  random:
    at: "0:19"
    notes:
      - "**\"We held out 20% at random, and the model scored very well.\"**"
      - "Sounds like proof. Often it is not."
      - "→ A real case."
  zech:
    at: "0:32"
    notes:
      - "**2018: a model to detect pneumonia on chest X-rays.**"
      - "158,323 images from three hospital systems (NIH, Mount Sinai, Indiana)."
  hospital:
    at: "0:42"
    notes:
      - "**A network could also tell which hospital an image came from.**"
      - "99.95% · 99.98% · 95.59% accuracy."
      - "Pneumonia 34.2% at Mount Sinai, against 1.2% and 1.0% at the other two (do not assign them)."
      - "So the hospital was a strong clue for the answer."
  outside:
    at: "1:05"
    notes:
      - "**Internal test: AUC 0.931. Outside hospital: 0.815.**"
      - "All hospitals on both sides of the test → the test rewarded the hospital clue."
      - "Holding out a whole hospital showed the real performance. Zech et al., PLOS Medicine, 2018."
      - "→ Same trap, at our company."
  werkmora:
    at: "1:26"
    notes:
      - "**Werkmora: fictional garden retailer, about 175 stores.**"
      - "Forecast per store × item, 1–21 days ahead."
      - "Pilot scored on a random 20% of store × item × day rows → same store and week on both sides; neighbouring days share weather, promotions, stock."
      - "Good score; it says little about next spring."
  simulate:
    at: "1:59"
    notes:
      - "**A split is a simulation of production.**"
      - "Ask first: *in production, what will be new to the model?* New days, customers, stores, sites."
      - "Make exactly those things new in the test."
  split-random:
    at: "2:19"
    notes:
      - "**Random: independent rows, a stable world.**"
      - "And no duplicates across sources, no hidden groups (patient, store, device) on both sides — Roberts M. 2021, Kapoor & Narayanan 2023, Zech 2018."
  split-time:
    at: "2:36"
    notes:
      - "**Time: train on the past, test on a later period.**"
      - "The default for a forecast and anything that predicts the future."
      - "(If asked: Bergmeir, Hyndman & Koo 2018 — for *purely autoregressive* models, K-fold CV can be valid for model selection. Not a reason to drop the later test period.)"
  backtest:
    at: "2:49"
    notes:
      - "**A backtest repeats the cut-off many times.**"
      - "Train only on data before each date · same horizon as the product · data as it was known then (data-03)."
  split-group:
    at: "3:08"
    notes:
      - "**Group: one customer, store or patient on one side only.**"
      - "Otherwise the model is tested on someone it has already seen."
      - "New sites in production → hold out whole sites (as Zech did)."
  shortcuts:
    at: "3:29"
    notes:
      - "**Even a held-out site can miss things.**"
      - "COVID-19 chest X-ray models: \"half of the model's predictive performance is lost\" at other hospitals; shortcuts (markers, text, patient position) — some also work at the new hospital."
      - "External split: needed, and it does not prove everything. DeGrave et al. 2021."
      - "→ What if the data is small?"
  cv:
    at: "3:48"
    notes:
      - "**Cross-validation: rotate the held-out part, average the scores.**"
      - "A more stable estimate on small data."
  cv-rules:
    at: "3:59"
    notes:
      - "**Two rules.**"
      - "Time, place or group structure → rotate whole blocks: blocked or grouped CV (Roberts D.R. 2017, \"serious underestimation of predictive error\" otherwise)."
      - "CV also used to tune or choose → nested CV, or a separate test set."
      - "Varma & Simon 2006: on data with no real signal, tuned models looked good in CV and were at chance on an independent test."
  three-sets:
    at: "4:25"
    notes:
      - "**Three sets, three jobs.**"
      - "Training: the model learns · validation: you tune and choose · test: the final number, once."
  spent:
    at: "4:40"
    notes:
      - "**Every look leaks a bit.**"
      - "After many looks the test set is training data; the reported score is too high."
      - "Cawley & Talbot 2010: errors \"of comparable magnitude to differences in performance\" between algorithms → big enough to pick the wrong model."
      - "(TRIPOD+AI 2024 writes it as a reporting rule.)"
  plan:
    at: "5:04"
    notes:
      - "**Werkmora, done right.**"
      - "Backtest: weekly cut-offs through spring 2025, 1–21 days ahead, data as it was known."
      - "All tuning and model choice happens here."
  sealed:
    at: "5:20"
    notes:
      - "**Spring 2026 (March–June) is the sealed test.**"
      - "Trained up to end of February 2026; opened once, at the go/no-go meeting."
      - "Whole stores held out (big and compact); the ERP forecast and the seasonal naive baseline scored on the same splits (data-07)."
  page:
    at: "5:40"
    notes:
      - "**One page: what is new · cut-off dates · the sealed period · who may open it.**"
      - "Owner: Head of Data & Analytics keeps it sealed. The backtest runs as a job in the pipeline."
      - "Everyone agrees the split copies production; they differ on how often you may look (once: TRIPOD+AI and the guide; many times with a method that allows it: Dwork et al. 2015)."
      - "Your angle, if it fits: the backtest as an integration test suite, the split as an ADR."
  takeaway:
    at: "6:02"
    notes:
      - "**The card: the idea, the move, what to do on Monday.**"
  next:
    at: "6:09"
    notes:
      - "**Next: choosing metrics.**"

text:
  # The title card; the usual check.
  episode: "AI Product Design · Module 3 · Episode 3.4"
  quote: "“We held out 20% at random. It scored very well.”"
  quote-how: "Shuffle the rows, hold out a share, report the score."
  quote-tag: "the usual check"

  # The pneumonia model and the hospital.
  title-zech: "A pneumonia model that also learned the hospital"
  zech-what: "158,323 chest X-rays from three hospital systems. A model to detect pneumonia."
  hospital-nih: "NIH"
  hospital-sinai: "Mount Sinai"
  hospital-indiana: "Indiana"
  which-hospital: "A network could tell which hospital an X-ray came from:"
  acc-nih: "99.95%"
  acc-sinai: "99.98%"
  acc-indiana: "95.59%"
  prevalence: "Pneumonia in the data: 34.2% at Mount Sinai, 1.2% and 1.0% at the other two."
  axis-auc: "AUC (0.5 is chance)"
  value-inside: "0.931"
  value-outside: "0.815"
  label-inside: "internal test"
  label-outside: "outside hospital"
  zech-line: "All hospitals sat on both sides of the test. The test rewarded the hospital clue."
  zech-credit: "Zech et al. (2018), PLOS Medicine"

  # Werkmora's pilot.
  title-werkmora: "Werkmora’s pilot"
  werkmora-tag: "fictional company"
  werkmora: "A garden retailer with about 175 stores. The forecast: how much of each item each store sells, 1 to 21 days ahead."
  strip-label: "store × item × day rows, in time order"
  strip-test: "test: a random 20%"
  werkmora-why: "Same store, same week on both sides. Neighbouring days share weather, promotions and stock."
  werkmora-line: "A good score, and it says little about next spring."

  # The three splits.
  title-splits: "A split is a copy of production"
  ask: "Ask first: in production, what will be new to the model?"
  new-things: "new days · new customers · new stores · new sites"
  split-random: "random"
  split-random-when: "Independent rows, a stable world. No duplicates across sources, no hidden groups."
  split-time: "time"
  split-time-default: "the forecast default"
  split-time-when: "Train on the past, test on a later period."
  split-time-backtest: "Backtest: many cut-offs, the product’s horizon, data as it was known."
  split-group: "group"
  split-group-when: "One store, customer or patient on one side only. New sites? Hold out whole sites."
  group-note: "each block is one store"
  shortcuts: "Even a held-out site can miss shortcuts that also work there."
  splits-credit: "Roberts M. et al. (2021) · Kapoor & Narayanan (2023) · Zech et al. (2018) · DeGrave et al. (2021)"

  # Cross-validation.
  title-cv: "Cross-validation"
  cv-what: "Rotate which part is held out. Average the scores."
  cv-why: "A more stable estimate on small data."
  cv-fold: "one fold held out per round"
  rule-structure: "Time, place or groups in the data?"
  rule-structure-do: "Rotate whole blocks: blocked or grouped CV."
  rule-tune: "Also tuning or choosing the model?"
  rule-tune-do: "Nested CV, or keep a separate test set."
  cv-credit: "Roberts D.R. et al. (2017) · Varma & Simon (2006)"

  # The test set is spent once.
  title-spent: "The test set is spent once"
  set-train: "training"
  set-validation: "validation"
  set-test: "test"
  job-train: "the model learns from it"
  job-validation: "you tune and choose"
  job-test: "the final number, once"
  leak: "every look leaks a bit"
  spent-line: "Tune against the test set and it turns into training data. The score you report is too high."
  spent-quote: "Over-fitting in model selection gives errors “of comparable magnitude to differences in performance” between algorithms. Cawley & Talbot (2010)"

  # Werkmora, done right.
  title-plan: "Werkmora: the split, written down"
  plan-tag: "fictional"
  year-2024: "2024"
  year-2025: "2025"
  year-2026: "2026"
  backtest-label: "backtest: tune and choose here"
  backtest-what: "Weekly cut-offs through spring 2025. Train only on data before each one, forecast 1 to 21 days ahead, with the data as it was known."
  sealed-label: "spring 2026: sealed"
  sealed-what: "Spring 2026 (March to June): trained up to the end of February, opened once, at the go/no-go."
  stores-what: "Whole stores held out, big and compact. The ERP forecast and the seasonal naive baseline scored on the same splits."
  page-head: "One page: what is new · the cut-off dates · the sealed period · who may open it"
  page-owner: "The Head of Data & Analytics keeps the test sealed. The backtest runs as a job in the pipeline."
  compare: "Everyone agrees the split copies production. They differ on how often you may look."

  # The close.
  takeaway-subtitle: "Episode 3.4 in one card"
  next: "Next episode: choosing metrics."
