  who-2: "the head of claims decides: budget it, or stop"
  title-know: "Pilots stop or go live. None stay pilots."
  record: "Every go-live comes with a record of the gates it passed."

  # The download, and the close.
  canvas-title: "The readiness scorecard: blank, and filled in"
  takeaway-subtitle: "Episode 4.2 in one card"
  swap: "In a bank, the same gates stand before a fast track for card disputes; in a retailer, before automatic refunds. Same eight questions."

