# Episode 3.6 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-6.ts. Under `npm run dev`
# a refresh of /en/deck/3-6 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the script time; `cue` is what the presenter
#           view shows. Keep `at` in quotes ("0:22").
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/06-thresholds-and-operating-points.slides.md.
# Times assume about 125 words a minute; adjust them after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-6.ts as well.

title: "Thresholds and operating points"

steps:
  title:
    at: "0:00"
    cue: "Episode 3.6 of AI Product Design: thresholds and operating points."
  promise:
    at: "0:04"
    cue: "In this episode: why the most precise threshold can cost the most, how the cost of each error sets the operating point, and a design with two thresholds and a person in the middle."
  usual:
    at: "0:21"
    cue: "A model gives a score. A threshold turns that score into an action. So who sets the threshold? Often nobody decides. It stays at the tool’s default, or the data team tunes it for the best precision."
  epic:
    at: "0:38"
    cue: "A real example. In 2021 researchers tested Epic’s sepsis model on 38,455 hospitalisations, at the threshold Epic recommends. It alerted on 18 percent of them. Only 12 percent of the alerts were right, and it missed two thirds of the sepsis cases."
  burden:
    at: "0:59"
    cue: "That is about eight patients to check for every sepsis case found. The authors call it a large burden of alert fatigue. Nobody worked that workload out from what a miss costs and what a false alarm costs. It is what the recommended setting gives."
  werkmora:
    at: "1:20"
    cue: "Now our own company. Werkmora is a fictional home, DIY and garden retailer with about 175 stores. In this module we follow its garden replenishment forecast. The data team asks: which safety stock should we use? We come back to that at the end."
  table:
    at: "1:41"
    cue: "First, the example from the guide. A fraud model scores 10,000 transactions, and 100 are fraud. A missed fraud costs 500 euros, a review costs 5. With a low threshold, A, we flag 300 and catch 80. Precision: 27 percent."
  rowb:
    at: "2:00"
    cue: "With a high threshold, B, we flag 100 and catch 60. Precision: 60 percent. B looks much better."
  total:
    at: "2:09"
    cue: "Now add the costs. A misses 20 frauds, that is 10,000 euros, plus 1,500 for reviews: 11,500. B misses 40, that is 20,000, plus 500 for reviews: 20,500. The more precise threshold costs about 1.8 times more. Same model."
  step:
    at: "2:28"
    cue: "Why? Going from B to A means 200 more reviews, 1,000 euros. They find 20 more frauds and save 10,000. The table assumes a reviewed fraud is fully stopped, and a false alarm costs only the review."
  elkan:
    at: "2:46"
    cue: "Charles Elkan wrote this down in 2001: you can compute the threshold from the costs. Here it is 1 percent. Flag every transaction with more than about 1 percent chance of fraud. That needs calibrated scores, from episode 3.5."
  moves:
    at: "3:04"
    cue: "And when the costs move, the point moves. If a missed fraud costs 50 euros, A and B both cost 2,500, and the threshold goes up to 10 percent. So the operating point is a product decision, with an owner in the business."
  two:
    at: "3:25"
    cue: "A common design uses two thresholds. Below the low one, let it through. Above the high one, act automatically. In between, a person decides."
  band:
    at: "3:36"
    cue: "That middle band has a price: the reviews times the cost of one review. And it has a capacity: how many reviews the team can do per day. If the band is wider than the team, reviews get rushed or skipped."
  kaiser:
    at: "3:56"
    cue: "Kaiser Permanente built it this way for patients who might get worse in hospital. An alert at a 12-hour risk of 8 percent or more, about one new alert per day per 35 patients. Trained nurses check each alert remotely first. Across 19 hospitals, 30-day mortality after an alert was lower: an adjusted relative risk of 0.84."
  forecast:
    at: "4:24"
    cue: "Back to Werkmora. A forecast is not a fraud model, but the logic is the same. The forecast gives units. The decision is how much more than the forecast a store orders. Too little: an empty shelf on a sunny weekend. Too much: a dead plant, or a markdown."
  levels:
    at: "4:47"
    cue: "With fictional numbers: one plant short costs 6 euros of margin, one plant too many costs 4, because it dies. That gives a service level of 60 percent. For a garden hose, short is 5 euros and too many is 50 cents. That gives about 91 percent. Same model, two operating points."
  owner:
    at: "5:12"
    cue: "The CCO and the COO decide the service level per item group. It goes into one table, with the cost assumptions, the owner and a date to look again. The pipeline reads it as configuration. Unsure order lines go to the replenishment team, under 5 percent of lines."
  june:
    at: "5:35"
    cue: "At the end of the season plant markdowns get deeper, so the COO lowers the plants’ service level for June. No retraining, one row changes. As the engineer, keep that row where every change is logged: who, when and why."
  takeaway:
    at: "5:54"
    cue: "In one card: the idea, the move, and what to do on Monday."
  next:
    at: "6:00"
    cue: "In the next episode: baselines. What a model has to beat."

