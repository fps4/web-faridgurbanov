# Episode 3.5 deck: every word on screen and in the presenter view (FS-0010, ADR-0010).
#
# Edit the words here; the positions, sizes and colours stay in lib/decks/3-5.ts. Under `npm run dev`
# a refresh of /en/deck/3-5 shows the change. `npm run test` then checks that no text overlaps other
# text or the camera corner, and that this file and the layout name the same steps and ids.
#
# - title:  the episode title; also the slide header and the closing card's heading.
# - steps:  one per click, in recording order. `at` is the planned time in the episode; keep it in
#           quotes ("0:22"). `notes` are what the presenter view shows: the presenter notes, copied
#           from the wiki's .slides.md by `npm run notes`. Edit them there, not here.
# - text:   the on-screen lines, by element id. Long lines wrap by themselves.
#
# The "In this episode" lines and the closing card's rows are in lib/episodes/module-3.ts.
# The presenter notes are in the wiki: publishing/ai-product-design/episodes/03-data/05-choosing-metrics.slides.md.
# Adjust the times after a practice run.
#
# Adding or removing a step or an id is a layout change: do it in lib/decks/3-5.ts as well.

title: "Choosing metrics"

steps:
  title:
    at: "0:00"
    notes:
      - "**Episode 3.5 — choosing metrics.**"
  promise:
    at: "0:04"
    notes:
      - "**In this episode: why one number is not enough, how to pick the metric, three levels with owners.**"
  usual:
    at: "0:22"
    notes:
      - "**\"95% accurate.\"** One number, the one the tool printed."
      - "Nobody asks which errors it counts and which it hides."
      - "→ A company that measured this."
  booking:
    at: "0:35"
    notes:
      - "**Booking.com, 2019: about 150 customer-facing models, every one tested in an RCT.**"
      - "23 comparisons, 46 models: a new model against one already proven in an RCT."
  nocorr:
    at: "0:56"
    notes:
      - "**Offline gain (AUC or a ranking metric) next to business gain in the RCT.**"
      - "Pearson −0.1, 90% CI −0.45 to 0.27 → no relation."
  health:
    at: "1:15"
    notes:
      - "**Their section title: \"Offline model performance is just a health check.\"**"
      - "One cause: a model trained on clicks can drive clicks without more bookings (proxy over-optimisation)."
      - "Careful: gain vs gain, one system. Not \"offline metrics are useless\"."
      - "→ Back to our company."
  werkmora:
    at: "1:36"
    notes:
      - "**Werkmora — fictional garden retailer; nightly forecast per store × item.**"
      - "The pilot reports one number: \"WAPE better than the ERP forecast, overall.\""
  decision:
    at: "1:52"
    notes:
      - "**A metric is a decision about which errors count → start from the decision.**"
      - "Decision = how much to order. Too high → dead plants, markdowns. Too low → empty shelves on a sunny weekend."
  forecast:
    at: "2:10"
    notes:
      - "**Two numbers: WAPE and bias.**"
      - "WAPE = sum of absolute errors ÷ sum of sales → big sellers count most."
      - "Bias = sum of (forecast − actual) ÷ sum of sales → the sign says too much or too little. The nearest thing to calibration."
      - "Not MAPE: many store × item × day values are zero → undefined (Hyndman & Koehler 2006, §2.2)."
      - "→ Other tasks, same question."
  classify:
    at: "2:32"
    notes:
      - "**Classification: precision and recall.**"
      - "Accuracy misleads on imbalance: 99% by never flagging fraud. Read precision and recall at the operating point."
  rare:
    at: "2:50"
    notes:
      - "**Rare class: precision at the operating point, with the prevalence.**"
      - "\"PR-AUC is always better\" is disputed (McDermott 2024). AUROC is fine to compare models before a threshold is set."
  calibration:
    at: "3:10"
    notes:
      - "**Probabilities: calibration. Does \"70%\" happen 70% of the time?**"
      - "QRISK2 vs Framingham, men 35–74: AUROC 0.771 vs 0.750. Framingham over-predicted."
      - "At the 20% threshold, per 1,000 men: 110 vs 206 flagged."
  regression:
    at: "3:29"
    notes:
      - "**Regression: MAE, RMSE, MAPE.**"
      - "MAPE: undefined at zero, skewed near zero, unequal penalty for over and under. MASE = error scaled by a naive forecast's error."
  ranking:
    at: "3:47"
    notes:
      - "**Ranking: precision@k, NDCG; trap = the Booking.com one.**"
      - "**Generation:** rubrics, reference answers, model judges. One average hides failure types; judges have biases → check against human labels."
      - "→ Whatever you pick…"
  slice:
    at: "4:05"
    notes:
      - "**Report it per slice.**"
      - "Werkmora: store type, country, item group, fast vs slow movers. ≈ 0.75 million series (fictional)."
      - "WAPE is volume-weighted → slow movers and compact stores hide inside a good total."
      - "The slice that matters may not be a column you have (hidden stratification)."
  levels:
    at: "4:29"
    notes:
      - "**Three levels.**"
      - "Business: on-shelf availability, waste and markdown value, stock days."
      - "Model: WAPE and bias per store × item × week, and per division."
      - "Guardrails (must not get worse): availability on the top 500 garden items · waste on live plants · DC trucks per day · manual overrides."
      - "(Guide's general examples, if you want them: cost per claim, retention · recall at a fixed precision · complaints, latency, fairness gaps.)"
  owners:
    at: "4:50"
    notes:
      - "**Each level has an owner.**"
      - "CCO and COO sign business metrics and guardrails. Head of Data & Analytics owns the model metric."
      - "Director Supply Chain watches the guardrails; one gets worse → the roll-out stops."
  month:
    at: "5:10"
    notes:
      - "**A month later (fictional).**"
      - "Overall gain holds for fast sellers in big stores. Compact stores, slow live plants: positive bias → orders too many."
      - "The slice report and the live-plant waste guardrail show it before spring."
  summary:
    at: "5:30"
    notes:
      - "**One page: three levels, the slices, how each number is computed, who signs.**"
      - "Model metric = health check; business metric = does the product work."
  agents:
    at: "5:46"
    notes:
      - "**And for agents: the unit is the task.**"
      - "Several steps → did it end in the right state, and on every run?"
      - "→ The module on agentic products (evaluating agents)."
  takeaway:
    at: "6:02"
    notes:
      - "**The card: the idea, the move, what to do on Monday.**"
  next:
    at: "6:08"
    notes:
      - "**Next: thresholds and operating points.**"

text:
  # The title card; the one number.
  episode: "AI Product Design · Module 3 · Episode 3.5"
  quote: "“95% accurate.”"
  usual: "One number, the one the tool printed."
  usual-tag: "which errors does it hide?"

  # Booking.com: offline gain against business gain.
  title-booking: "Booking.com: offline gain vs business gain"
  axis-x-label: "offline gain (AUC, ranking metric)"
  axis-y-label: "business gain in the experiment"
  cloud-tag: "schematic"
  booking-what: "About 150 customer-facing models, each tested in a randomised controlled trial."
  booking-pairs: "23 comparisons, 46 models: a new model against one already proven."
  pearson: "Pearson −0.1"
  ci: "90% CI −0.45 to 0.27"
  health: "“Offline model performance is just a health check.”"
  proxy: "One cause they name: trained on clicks, it can drive clicks without more bookings."
  booking-credit: "Bernardi, Mavridis & Estevez (2019), KDD. Gain against gain, in one system."

  # Werkmora: the decision and the forecast metrics.
  title-werkmora: "Werkmora: the garden forecast"
  werkmora-tag: "fictional company"
  werkmora: "A garden retailer. Every night it forecasts how much of each item every store needs."
  one-number: "“WAPE better than the ERP forecast. Overall.”"
  decision: "The decision: how much to order. Two errors, two costs."
  under: "too low: empty shelves"
  over: "too high: dead plants, markdowns"
  zero: "bias 0"
  wape: "WAPE = sum of absolute errors ÷ sum of sales. Big sellers count most."
  bias: "Bias = sum of (forecast − actual) ÷ sum of sales. The sign says which way."
  mape: "MAPE on slow movers: many days with zero sales, so MAPE is undefined."

  # The guide's table: task, metric, trap.
  title-table: "Other tasks, other metrics, each with a trap"
  col-task: "task"
  col-metric: "metric"
  col-trap: "the trap"
  task-classify: "classification"
  metric-classify: "precision, recall"
  trap-classify: "accuracy: 99% by never flagging fraud"
  task-rare: "rare class"
  metric-rare: "precision at the operating point, with prevalence"
  trap-rare: "“PR-AUC is always better”: disputed. AUROC is fine to compare models."
  task-calibration: "probabilities"
  metric-calibration: "calibration: does 70% happen 70% of the time?"
  trap-calibration: "ranks well, and the numbers are still wrong"
  task-regression: "regression"
  metric-regression: "MAE, RMSE, MAPE"
  trap-regression: "MAPE: undefined at zero, unequal penalty. Use MASE."
  task-ranking: "ranking"
  metric-ranking: "precision@k, NDCG"
  trap-ranking: "offline gains that do not move customers"
  task-generation: "generation"
  metric-generation: "rubrics, references, model judges"
  trap-generation: "one average hides failure types; judges have biases"
  qrisk-title: "QRISK2 vs Framingham"
  qrisk-auroc: "Men 35–74: AUROC 0.771 vs 0.750"
  qrisk-flagged: "110 vs 206"
  qrisk-per: "men flagged per 1,000 at the 20% treatment threshold"
  qrisk-credit: "Collins & Altman (2012), BMJ"
  table-credit: "PR-AUC: McDermott et al. (2024) · MAPE and MASE: Hyndman & Koehler (2006)"

  # Per slice.
  title-slice: "Report it per slice"
  slice-tag: "fictional"
  overall: "overall WAPE"
  dim-store: "store type: big-box, compact"
  dim-country: "country: NL, BE, DE"
  dim-group: "item group: live plants, furniture"
  dim-speed: "speed: fast and slow movers"
  series: "≈ 0.75 million store × item series"
  weighted: "WAPE is weighted by volume: slow movers and compact stores can be bad inside a good total."
  column: "The slice that matters may not be a column you have."

  # Three levels, with owners.
  title-levels: "Three levels of metric"
  levels-tag: "fictional"
  col-owner: "owner"
  level-business: "business"
  level-business-metrics: "on-shelf availability · waste and markdown value · stock days"
  level-business-owner: "CCO and COO sign"
  level-model: "model"
  level-model-metrics: "WAPE and bias per store × item × week, and per division"
  level-model-owner: "Head of Data & Analytics"
  level-guardrail: "guardrails"
  level-guardrail-metrics: "availability on the top 500 garden items · waste on live plants · DC trucks per day · manual overrides"
  level-guardrail-owner: "Director Supply Chain watches. One gets worse: the roll-out stops."
  month: "A month later: compact stores, slow live plants, positive bias. Seen before spring."
  summary: "Write it on one page: the levels, the slices, how each number is computed, who signs."
  health-again: "The model metric is the health check. The business metric says if the product works."

  # And for agents.
  title-agents: "And for agents…"
  agents-unit: "The unit is the task."
  agent-step-1: "step 1"
  agent-step-2: "step 2"
  agent-step-3: "step 3"
  agent-end: "end state?"
  agents-check: "Right end state? On every run?"
  agents-next: "More in the module on agentic products."
  takeaway-subtitle: "Episode 3.5 in one card"
  next: "Next episode: thresholds and operating points."
