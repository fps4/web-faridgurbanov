  title-slice: "Report it per slice"
  slice-tag: "fictional"
  overall: "overall WAPE"
  dim-store: "store type: big-box, compact"
  dim-country: "country: NL, BE, DE"
  dim-group: "item group: live plants, furniture"
  dim-speed: "speed: fast and slow movers"
  series: "≈ 0.75 million store × item series"
  weighted: "WAPE is weighted by volume: slow movers and compact stores can be bad inside a good total."
  column: "The slice that matters may not be a column you have."

