<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="87" y="24">PRODUCT OWNER</text>
    <text x="297" y="24">INSTRUCTIE</text>
    <text x="487" y="24">AGENT</text>
    <text x="660" y="24">OUTPUT</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" stroke-dasharray="4 3">
    <rect x="192" y="40" width="210" height="56" rx="8"/>
    <rect x="572" y="40" width="176" height="56" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="12" y="116" width="150" height="172" rx="8"/>
    <rect x="199" y="146" width="196" height="38" rx="8"/>
    <rect x="199" y="192" width="196" height="38" rx="8"/>
    <rect x="199" y="238" width="196" height="38" rx="8"/>
    <rect x="432" y="40" width="110" height="248" rx="8"/>
    <rect x="572" y="182" width="176" height="56" rx="8"/>
    <rect x="432" y="312" width="316" height="44" rx="8"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="192" y="116" width="210" height="172" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)" stroke-dasharray="4 3">
    <line x1="402" y1="68" x2="428" y2="68"/>
    <line x1="542" y1="68" x2="568" y2="68"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)">
    <line x1="162" y1="210" x2="188" y2="210"/>
    <line x1="402" y1="210" x2="428" y2="210"/>
    <line x1="542" y1="210" x2="568" y2="210"/>
    <line x1="660" y1="238" x2="660" y2="308"/>
    <polyline points="432,334 87,334 87,292"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="297" y="63" font-weight="600">Luie prompt</text>
    <text x="297" y="80" font-size="10.5">“Voeg een factuurexport-feature toe.”</text>
    <text x="660" y="63" font-weight="600">Iets</text>
    <text x="660" y="80" font-size="10.5">mist bereik, verzint formaat</text>

    <text x="87" y="170" font-weight="600">Product owner</text>
    <g text-anchor="start" font-size="11">
      <text x="26" y="198">1  stuurt de agent aan</text>
      <text x="26" y="218">2  beoordeelt output</text>
      <text x="26" y="238">3  schat claims in</text>
    </g>

    <text x="297" y="136" font-size="13" font-weight="600">Spec</text>
    <text x="297" y="162" font-weight="600">Werk opgedeeld</text>
    <text x="297" y="177" font-size="10.5">actie, velden, CSV, UTF-8</text>
    <text x="297" y="208" font-weight="600">Toetsbare criteria</text>
    <text x="297" y="223" font-size="10.5">WANNEER … MOET HET SYSTEEM</text>
    <text x="297" y="254" font-weight="600">Buiten scope</text>
    <text x="297" y="269" font-size="10.5">PDF, geplande exports</text>

    <text x="487" y="160" font-size="13" font-weight="600">Agent</text>
    <text x="487" y="177" font-size="10.5">zelfde model</text>

    <text x="660" y="206" font-weight="600">Wat de PO besliste</text>
    <text x="660" y="223" font-size="10.5">niets meer te gissen</text>

    <text x="590" y="331" font-weight="600">Beoordelen</text>
    <text x="590" y="346" font-size="10.5">acceptatiecriteria, held-out voorbeelden, LLM-as-judge</text>
    <text x="260" y="326" font-size="10.5" font-style="italic">een mens bij de gate</text>

    <text x="380" y="388" font-size="11.5" font-style="italic">dezelfde agent, hetzelfde model: de spec bepaalt wat “export” betekent, dus de agent hoeft niets te gissen</text>
  </g>
</svg>
