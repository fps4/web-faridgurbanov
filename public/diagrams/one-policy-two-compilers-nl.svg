  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="80" y="58" font-weight="600">taxonomie</text>
    <text x="80" y="74" font-size="10.5">4 niveaus, 4 regimes</text>
    <text x="80" y="124" font-weight="600">regio's</text>
    <text x="80" y="140" font-size="10.5">geografieën, DR-paren</text>
    <text x="80" y="190" font-weight="600">platforms</text>
    <text x="80" y="206" font-size="10.5">claims, elk gedateerd</text>
    <text x="80" y="256" font-weight="600">landschap</text>
    <text x="80" y="272" font-size="10.5">31 assets, lineage</text>
    <text x="80" y="322" font-weight="600">personen</text>
    <text x="80" y="338" font-size="10.5">6 mensen, groepen</text>
    <text x="80" y="388" font-weight="600">register</text>
    <text x="80" y="404" font-size="10.5">haalt controles weg</text>

    <text x="230" y="195" font-weight="600">Engine</text>
    <text x="230" y="215" font-size="10.5">1 propageert</text>
    <text x="230" y="231" font-size="10.5">2 valideert register</text>
    <text x="230" y="247" font-size="10.5">3 evalueert</text>
    <text x="230" y="271" font-size="10.5" font-style="italic">explain</text>

    <text x="370" y="92" font-weight="600">Unity Catalog</text>
    <text x="370" y="108" font-size="10.5">SQL en JSON</text>
    <text x="370" y="354" font-weight="600">Fabric</text>
    <text x="370" y="370" font-size="10.5">JSON en Markdown</text>

    <g text-anchor="start" font-size="11">
      <text x="464" y="60" font-size="12" font-weight="600">build/unity_catalog/</text>
      <text x="464" y="78">8 catalogs, China in een apart bestand</text>
      <text x="464" y="94">47 tag-statements die de bron noemen</text>
      <text x="464" y="110">22 ABAC-policies, per query geëvalueerd</text>
      <text x="464" y="126">4 Delta Shares van KPI-producten</text>
      <text x="464" y="142">Markdown: wat SQL niet kan zeggen</text>
      <text x="464" y="322" font-size="12" font-weight="600">build/fabric/</text>
      <text x="464" y="340">6 capaciteiten, geen in China</text>
      <text x="464" y="356">20 OneLake-rollen, statische predicaten</text>
      <text x="464" y="372">26 sensitivity labels uit het niveau</text>
      <text x="464" y="388">4 cross-geo tenant-instellingen, benoemd</text>
      <text x="464" y="404">no_home.md: 4 assets in China</text>
      <text x="464" y="188" font-size="12" font-weight="600">Waar de twee elkaar raken</text>
      <text x="528" y="206" font-size="10" fill="#9a9aa3" letter-spacing="0.8">UNITY CATALOG</text>
      <text x="634" y="206" font-size="10" fill="#9a9aa3" letter-spacing="0.8">FABRIC</text>
      <text x="464" y="224" font-size="10.5" font-weight="600">Wie</text>
      <text x="528" y="224" font-size="10.5">policy per query</text>
      <text x="634" y="224" font-size="10.5">statische rol</text>
      <text x="464" y="240" font-size="10.5" font-weight="600">Export</text>
      <text x="528" y="240" font-size="10.5">geweigerd</text>
      <text x="634" y="240" font-size="10.5">label reist mee</text>
      <text x="464" y="256" font-size="10.5" font-weight="600">China</text>
      <text x="528" y="256" font-size="10.5">apart account</text>
      <text x="634" y="256" font-size="10.5">geen capaciteit</text>
      <text x="464" y="272" font-size="10.5" font-weight="600">Assistent</text>
      <text x="528" y="272" font-size="10.5">per workspace</text>
      <text x="634" y="272" font-size="10.5">4 tenant-instellingen</text>
    </g>

    <text x="380" y="440" font-size="11.5" font-style="italic">dezelfde gepropageerde toestand compileert naar twee handhavingsmodellen, en de verschillen</text>
    <text x="380" y="456" font-size="11.5" font-style="italic">komen in een bestand dat ook iemand anders dan de auteur kan lezen</text>
  </g>
