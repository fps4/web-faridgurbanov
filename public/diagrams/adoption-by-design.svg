<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="116" y="24">WHO CAN REFUSE</text>
    <text x="349" y="24">WHAT THEY DO</text>
    <text x="618" y="24">WHAT THE DESIGN CHANGES</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="12" y="40" width="208" height="48" rx="8"/>
    <rect x="12" y="104" width="208" height="48" rx="8"/>
    <rect x="12" y="168" width="208" height="48" rx="8"/>
    <rect x="12" y="232" width="208" height="48" rx="8"/>
    <rect x="254" y="40" width="190" height="96" rx="8" stroke-dasharray="4 3"/>
    <rect x="488" y="40" width="260" height="44" rx="8"/>
    <rect x="488" y="92" width="260" height="44" rx="8"/>
    <rect x="488" y="144" width="260" height="44" rx="8"/>
    <rect x="488" y="196" width="260" height="44" rx="8"/>
    <rect x="488" y="248" width="260" height="44" rx="8"/>
    <path d="M220 64H236M220 128H236M220 192H236M220 256H236M236 64V256"/>
    <path d="M488 62H466M488 114H466M488 166H466M488 218H466M488 270H466M466 62V270"/>
  </g>
  <rect x="254" y="196" width="190" height="96" rx="8" fill="none" stroke="#7b7b85" stroke-width="2"/>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="236" y1="88" x2="250" y2="88" stroke-dasharray="4 3"/>
    <line x1="236" y1="244" x2="250" y2="244"/>
    <line x1="466" y1="244" x2="448" y2="244"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="116" y="60" font-weight="600">Teams who have to change</text>
    <text x="116" y="76" font-size="10.5">already have something that works</text>
    <text x="116" y="124" font-weight="600">The function that trusts it</text>
    <text x="116" y="140" font-size="10.5">finance, risk, security</text>
    <text x="116" y="188" font-weight="600">Team whose scope shrinks</text>
    <text x="116" y="204" font-size="10.5">loses part of its scope</text>
    <text x="116" y="252" font-weight="600">The budget holder</text>
    <text x="116" y="268" font-size="10.5">behind the replaced system</text>

    <text x="349" y="64" font-weight="600">Stay put</text>
    <text x="349" y="84" font-size="10.5">migration slips a quarter</text>
    <text x="349" y="100" font-size="10.5">an exception request</text>
    <text x="349" y="116" font-size="10.5">keep running what works</text>
    <text x="349" y="230" font-size="12.5" font-weight="600">Say yes</text>
    <text x="349" y="250" font-size="10.5">when it costs less</text>
    <text x="349" y="266" font-size="10.5">than staying put</text>

    <text x="618" y="59" font-weight="600">Say the unwelcome part first</text>
    <text x="618" y="75" font-size="10.5">a cost they help shape</text>
    <text x="618" y="111" font-weight="600">Make the platform cheaper</text>
    <text x="618" y="127" font-size="10.5">onboarding in minutes</text>
    <text x="618" y="163" font-weight="600">Build the check the sceptic trusts</text>
    <text x="618" y="179" font-size="10.5">a reconciliation they can run</text>
    <text x="618" y="215" font-weight="600">Take the boring half</text>
    <text x="618" y="231" font-size="10.5">the part nobody owns</text>
    <text x="618" y="267" font-weight="600">Migrate by benefit</text>
    <text x="618" y="283" font-size="10.5">worst setup moves first</text>

    <text x="380" y="322" font-size="11.5" font-style="italic">each move lowers the cost of yes for someone on the list;</text>
    <text x="380" y="338" font-size="11.5" font-style="italic">leave the list unwritten and it turns up one refusal at a time</text>
  </g>
</svg>
