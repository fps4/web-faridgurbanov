    <rect x="448" y="152" width="300" height="44" rx="8"/>
    <rect x="176" y="208" width="244" height="44" rx="8"/>
    <rect x="448" y="208" width="300" height="44" rx="8"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="12" y="40" width="128" height="212" rx="8"/>
    <rect x="176" y="284" width="572" height="52" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)">
    <line x1="140" y1="62" x2="172" y2="62"/>
    <line x1="420" y1="62" x2="444" y2="62"/>
    <line x1="140" y1="118" x2="172" y2="118"/>
    <line x1="420" y1="118" x2="444" y2="118" stroke-dasharray="4 3"/>
    <line x1="140" y1="174" x2="172" y2="174"/>
    <line x1="420" y1="174" x2="444" y2="174" stroke-dasharray="4 3"/>
    <line x1="140" y1="230" x2="172" y2="230"/>
    <line x1="420" y1="230" x2="444" y2="230" stroke-dasharray="4 3"/>
    <line x1="598" y1="252" x2="598" y2="280"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="76" y="142" font-weight="600">Dezelfde rij</text>
    <text x="76" y="160" font-size="10.5">fabriekstelemetrie</text>

    <text x="298" y="59" font-weight="600">Engineer in Veldhoven</text>
    <text x="298" y="75" font-size="10.5">vanaf kantoor</text>
    <text x="598" y="59" font-weight="600">Getoond</text>
    <text x="598" y="75" font-size="10.5">heeft de autorisatiegroep (D2)</text>
    <text x="298" y="115" font-weight="600">Engineer aan het bureau ernaast</text>
    <text x="298" y="131" font-size="10.5">hetzelfde kantoor</text>
    <text x="598" y="115" font-weight="600">Geweigerd</text>
    <text x="598" y="131" font-size="10.5">geen autorisatiegroep voor de categorie (D2)</text>
    <text x="298" y="171" font-weight="600">De eerste engineer</text>
    <text x="298" y="187" font-size="10.5">vanuit een hotel in een derde land</text>
    <text x="598" y="171" font-weight="600">Geweigerd</text>
    <text x="598" y="187" font-size="10.5">plaats van toegang, in de identiteitslaag (D3)</text>
    <text x="298" y="227" font-weight="600">Aan de verkeerde tabel gekoppeld</text>
    <text x="298" y="243" font-size="10.5">wie het ook vraagt</text>
    <text x="598" y="227" font-weight="600">Voor iedereen geweigerd</text>
    <text x="598" y="243" font-size="10.5">erft de strengste controle van zijn bronnen (D1)</text>

    <text x="462" y="305" font-weight="600">explain</text>
    <text x="462" y="323" font-size="10.5">wie hem zag · van waar · onder welke autorisatie · vanwege welke regel · onder welke beslissing</text>

    <text x="380" y="364" font-size="11.5" font-style="italic">dezelfde rij krijgt een ander antwoord naar wie vraagt, van waar, en waaruit hij is afgeleid;</text>
    <text x="380" y="380" font-size="11.5" font-style="italic">explain voegt vijf delen van vier plekken samen tot één zin</text>
  </g>
