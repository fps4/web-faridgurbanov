<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="210" y="24">DESCRIBES</text>
    <text x="594" y="24">JUSTIFIES</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="20" y="190" width="380" height="120" rx="8"/>
    <rect x="470" y="98" width="248" height="50" rx="8"/>
    <rect x="470" y="190" width="248" height="50" rx="8"/>
    <rect x="20" y="334" width="720" height="40" rx="8"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="20" y="40" width="380" height="120" rx="8"/>
    <rect x="448" y="40" width="292" height="270" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="400" y1="123" x2="466" y2="123"/>
  </g>
  <g fill="#7b7b85" font-size="12.5" text-anchor="middle">
    <text x="210" y="64" font-weight="600">The map: high-level design (HLD)</text>
    <text x="210" y="86" font-size="11" font-style="italic">what does the system look like now?</text>
    <text x="210" y="106" font-size="10.5">goals, context, building blocks, flows,</text>
    <text x="210" y="122" font-size="10.5">deployment, risks, links to the decisions</text>
    <text x="210" y="146" font-size="11">changes a few times a year</text>

    <text x="210" y="214" font-weight="600">The detail: low-level design (LLD)</text>
    <text x="210" y="236" font-size="10.5">component internals, API contracts, schemas</text>
    <text x="210" y="256" font-size="10.5">as code: OpenAPI and AsyncAPI specs,</text>
    <text x="210" y="272" font-size="10.5">schema files, infrastructure as code, contract tests</text>
    <text x="210" y="296" font-size="11">changes weekly</text>

    <text x="433" y="115" font-size="10.5">links</text>

    <text x="594" y="64" font-weight="600">The logbook: ADRs</text>
    <text x="594" y="82" font-size="10.5">one per decision that is costly to reverse</text>
    <text x="594" y="119" font-size="12" font-weight="600">events between domains</text>
    <text x="594" y="135" font-size="10.5">a decision about the shape</text>
    <text x="594" y="211" font-size="12" font-weight="600">optimistic locking</text>
    <text x="594" y="227" font-size="10.5">a decision in the detail</text>
    <text x="594" y="268" font-size="10.5">append-only: a changed decision gets</text>
    <text x="594" y="284" font-size="10.5">a new record that points back</text>

    <text x="380" y="359" font-size="11">in the repository, next to the code · reviewed through pull requests · diagrams as code</text>

    <text x="380" y="406" font-size="11.5" font-style="italic">the map describes, the logbook justifies, and for what changes weekly the contract in code is the design</text>
  </g>
</svg>
