  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-start="url(#ah)" marker-end="url(#ah)">
    <line x1="462" y1="106" x2="504" y2="106"/>
    <line x1="462" y1="216" x2="504" y2="216"/>
    <line x1="462" y1="286" x2="504" y2="286"/>
    <line x1="628" y1="64" x2="646" y2="64"/>
    <line x1="628" y1="128" x2="646" y2="128"/>
    <line x1="628" y1="192" x2="646" y2="192"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="74" y="62" font-weight="600">Systems of record</text>
    <text x="74" y="78" font-size="10.5">matters, people, CRM</text>
    <text x="74" y="174" font-weight="600">Documents</text>
    <text x="74" y="190" font-size="10.5">own access control</text>
    <text x="74" y="282" font-weight="600">Barrier rules</text>
    <text x="74" y="298" font-size="10.5">one file, with owners</text>

    <text x="222" y="62" font-weight="600">R2RML mapping</text>
    <text x="222" y="78" font-size="10.5">identifiers kept</text>
    <text x="222" y="142" font-weight="600">Extraction</text>
    <text x="222" y="158" font-size="10.5">scored on a gold set</text>
    <text x="222" y="220" font-weight="600">Chunk and embed</text>
    <text x="222" y="282" font-weight="600">Policy compiler</text>
    <text x="222" y="298" font-size="10.5">checked vs records</text>

    <text x="383" y="64" font-weight="600">Knowledge graph</text>
    <text x="383" y="86" font-size="10.5">spine from the records</text>
    <text x="383" y="102" font-size="10.5">facts with source,</text>
    <text x="383" y="118" font-size="10.5">confidence, review state,</text>
    <text x="383" y="134" font-size="10.5">valid time, lineage</text>
    <text x="383" y="150" font-size="10.5">glossary · SALI mapping</text>
    <text x="383" y="212" font-weight="600">Text + vector index</text>
    <text x="383" y="228" font-size="10.5">passages</text>
    <text x="383" y="282" font-weight="600">Policy engine</text>
    <text x="383" y="298" font-size="10.5">decides per person</text>

    <text x="483" y="100" font-size="11" font-weight="600">2</text>
    <text x="483" y="210" font-size="11" font-weight="600">4</text>
    <text x="483" y="280" font-size="11" font-weight="600">3</text>

    <text x="566" y="66" font-size="13" font-weight="600">Resolver</text>
    <g text-anchor="start" font-size="11">
      <text x="524" y="98">1  terms</text>
      <text x="524" y="126">2  candidates</text>
      <text x="524" y="154" font-weight="700">3  decide</text>
      <text x="524" y="182">4  passages</text>
      <text x="524" y="210">5  cite or refuse</text>
      <text x="524" y="238">6  record</text>
    </g>
    <text x="566" y="282" font-size="10.5" font-style="italic">as the person asking</text>
    <text x="566" y="342" font-weight="600">Decision record</text>
    <text x="566" y="358" font-size="10.5">hash-chained</text>

    <text x="702" y="60" font-weight="600">AI assistant</text>
    <text x="702" y="76" font-size="10.5">MCP, per person</text>
    <text x="702" y="124" font-weight="600">Search</text>
    <text x="702" y="140" font-size="10.5">facets, discovery</text>
    <text x="702" y="188" font-weight="600">Review</text>
    <text x="702" y="204" font-size="10.5">confirm or reject</text>
    <text x="702" y="342" font-weight="600">Risk</text>
    <text x="702" y="358" font-size="10.5">reads the record</text>

    <text x="380" y="402" font-size="11.5" font-style="italic">access is decided at step 3, before step 4 retrieves a single passage;</text>
    <text x="380" y="418" font-size="11.5" font-style="italic">the graph holds facts and identifiers, and the text stays in the document system</text>
  </g>
</svg>
