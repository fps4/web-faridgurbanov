<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="72" y="24">OBJECT</text>
    <text x="233" y="24">CONSTRAINTS</text>
    <text x="390" y="24">FIVE MODES</text>
    <text x="532" y="24">COST</text>
    <text x="683" y="24">REGISTER</text>
    <text x="285" y="200">REPLICATE VS FEDERATE</text>
    <text x="644" y="200">WORKED CATALOGUE</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="12" y="68" width="120" height="56" rx="8"/>
    <rect x="158" y="56" width="150" height="80" rx="8"/>
    <rect x="334" y="61" width="112" height="20" rx="8"/>
    <rect x="334" y="86" width="112" height="20" rx="8"/>
    <rect x="472" y="68" width="120" height="56" rx="8"/>
    <rect x="618" y="56" width="130" height="80" rx="8"/>
    <rect x="540" y="214" width="208" height="70" rx="8"/>
    <rect x="540" y="302" width="208" height="70" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" stroke-dasharray="4 3">
    <rect x="334" y="36" width="112" height="20" rx="8"/>
    <rect x="334" y="111" width="112" height="20" rx="8"/>
    <rect x="334" y="136" width="112" height="20" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="132" y1="96" x2="154" y2="96"/>
    <line x1="308" y1="96" x2="330" y2="96"/>
    <line x1="446" y1="71" x2="468" y2="84"/>
    <line x1="446" y1="96" x2="468" y2="96"/>
    <line x1="592" y1="96" x2="614" y2="96"/>
    <line x1="70" y1="372" x2="70" y2="214"/>
    <line x1="70" y1="372" x2="512" y2="372"/>
  </g>
  <line x1="328" y1="272" x2="328" y2="372" stroke="#9a9aa3" stroke-width="1.25" stroke-dasharray="4 3"/>
  <g stroke="#7b7b85" stroke-width="2">
    <line x1="70" y1="302" x2="500" y2="252"/>
    <line x1="70" y1="362" x2="500" y2="212"/>
  </g>
  <circle cx="328" cy="272" r="4" fill="#7b7b85"/>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="72" y="92" font-weight="600">One object</text>
    <text x="72" y="108" font-size="10.5">five modes open</text>

    <text x="233" y="78" font-weight="600">Rule modes out</text>
    <text x="233" y="95" font-size="10.5">residency,</text>
    <text x="233" y="110" font-size="10.5">personal data,</text>
    <text x="233" y="125" font-size="10.5">delta capability</text>

    <g font-size="11">
      <text x="390" y="50">Share</text>
      <text x="390" y="75" font-weight="600">Replicate</text>
      <text x="390" y="100" font-weight="600">Federate</text>
      <text x="390" y="125">Split</text>
      <text x="390" y="150">Keep at source</text>
    </g>
    <text x="390" y="174" font-size="10.5" font-style="italic">dashed: ruled out</text>

    <text x="532" y="92" font-weight="600">Compare cost</text>
    <text x="532" y="108" font-size="10.5">survivors only</text>

    <text x="683" y="78" font-weight="600">One row</text>
    <text x="683" y="95" font-size="10.5">its mode,</text>
    <text x="683" y="110" font-size="10.5">the rule that decided,</text>
    <text x="683" y="125" font-size="10.5">rejected modes priced</text>

    <g font-size="10.5">
      <text x="78" y="222" text-anchor="start">monthly cost</text>
      <text x="512" y="390" text-anchor="end">queries per day</text>
      <text x="328" y="390">crossover</text>
      <text x="420" y="226" text-anchor="end" font-size="11">Federate: mostly variable cost</text>
      <text x="500" y="294" text-anchor="end" font-size="11">Replicate: mostly fixed cost</text>
      <text x="199" y="356" font-style="italic">federate is cheaper</text>
      <text x="420" y="356" font-style="italic">the copy pays for itself</text>
    </g>

    <text x="644" y="242" font-weight="600">Large finance fact table</text>
    <text x="644" y="260" font-size="10.5">crossover at 61 queries/day</text>
    <text x="644" y="330" font-weight="600">Small reference table</text>
    <text x="644" y="348" font-size="10.5">crossover at about 11,000/day</text>

    <text x="380" y="414" font-size="11.5" font-style="italic">crossover (queries/day) = (F_replicate − F_federate) / ((v_federate − v_replicate) × 30)</text>
    <text x="380" y="430" font-size="11.5" font-style="italic">constraints rule modes out per object; cost picks among the modes that survive</text>
  </g>
</svg>
