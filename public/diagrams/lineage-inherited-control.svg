<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="82" y="24">SOURCES</text>
    <text x="470" y="24">DERIVED ASSETS INHERIT EVERY CONTROL</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="12" y="44" width="140" height="48" rx="8"/>
    <rect x="12" y="124" width="140" height="48" rx="8"/>
    <rect x="192" y="84" width="140" height="48" rx="8"/>
    <rect x="372" y="44" width="140" height="48" rx="8"/>
    <rect x="372" y="124" width="140" height="48" rx="8"/>
    <rect x="552" y="44" width="196" height="48" rx="8"/>
    <rect x="552" y="124" width="196" height="48" rx="8"/>
    <rect x="192" y="208" width="140" height="48" rx="8" stroke-dasharray="4 3"/>
  </g>
  <rect x="372" y="208" width="376" height="104" rx="8" fill="none" stroke="#7b7b85" stroke-width="2"/>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)">
    <line x1="152" y1="68" x2="188" y2="100"/>
    <line x1="152" y1="148" x2="188" y2="116"/>
    <line x1="332" y1="100" x2="368" y2="72"/>
    <line x1="332" y1="116" x2="368" y2="144"/>
    <line x1="512" y1="68" x2="548" y2="68"/>
    <line x1="512" y1="148" x2="548" y2="148"/>
    <line x1="530" y1="208" x2="530" y2="152"/>
    <line x1="262" y1="208" x2="262" y2="136" stroke-dasharray="4 3"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="82" y="64" font-weight="600">Source table</text>
    <text x="82" y="80" font-size="10.5">declares control A</text>
    <text x="82" y="144" font-weight="600">Source table</text>
    <text x="82" y="160" font-size="10.5">declares control B</text>

    <text x="262" y="104" font-weight="600">Joined table</text>
    <text x="262" y="120" font-size="10.5">inherits A, B</text>
    <text x="442" y="64" font-weight="600">Feature set</text>
    <text x="442" y="80" font-size="10.5">inherits A, B</text>
    <text x="442" y="144" font-weight="600">Aggregate</text>
    <text x="442" y="160" font-size="10.5">inherits A, B</text>
    <text x="650" y="64" font-weight="600">Model and endpoint</text>
    <text x="650" y="80" font-size="10.5">inherit A, B</text>
    <text x="650" y="144" font-weight="600">Declassified product</text>
    <text x="650" y="160" font-size="10.5">carries B</text>

    <text x="538" y="190" font-size="10.5" text-anchor="start">removes A</text>

    <text x="262" y="228" font-weight="600">Classification</text>
    <text x="262" y="244" font-size="10.5">loader refuses it</text>

    <text x="560" y="232" font-weight="600">Ledger entry</text>
    <text x="560" y="252" font-size="10.5">asset, what it removes, the grounds, who decided,</text>
    <text x="560" y="268" font-size="10.5">when it expires, whether it covers downstream</text>
    <text x="560" y="288" font-size="10.5">rule grounds: checked, refused if they do not hold</text>
    <text x="560" y="304" font-size="10.5">assessment or judgement: recorded, with its lapse date</text>

    <text x="380" y="342" font-size="11.5" font-style="italic">classification enters only at a source; only a ledger entry removes a control;</text>
    <text x="380" y="358" font-size="11.5" font-style="italic">platform tags are generated from this state</text>
  </g>
</svg>
