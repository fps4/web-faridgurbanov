  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="86" y="24">GROUNDED IN</text>
    <text x="256" y="24">DATASET</text>
    <text x="442" y="24">FIXTURES FOR</text>
    <text x="662" y="24">GATE</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="12" y="96" width="148" height="84" rx="8"/>
    <rect x="356" y="40" width="172" height="40" rx="8"/>
    <rect x="356" y="92" width="172" height="40" rx="8"/>
    <rect x="356" y="144" width="172" height="40" rx="8"/>
    <rect x="356" y="196" width="172" height="40" rx="8"/>
    <rect x="576" y="104" width="172" height="68" rx="8"/>
    <rect x="576" y="268" width="172" height="62" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" stroke-dasharray="4 3">
    <rect x="12" y="268" width="148" height="62" rx="8"/>
    <rect x="184" y="268" width="344" height="62" rx="8"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="184" y="40" width="144" height="196" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <line x1="528" y1="60" x2="550" y2="60"/>
    <line x1="528" y1="112" x2="550" y2="112"/>
    <line x1="528" y1="164" x2="550" y2="164"/>
    <line x1="528" y1="216" x2="550" y2="216"/>
    <line x1="550" y1="60" x2="550" y2="216"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="160" y1="138" x2="180" y2="138"/>
    <line x1="328" y1="60" x2="352" y2="60"/>
    <line x1="328" y1="112" x2="352" y2="112"/>
    <line x1="328" y1="164" x2="352" y2="164"/>
    <line x1="328" y1="216" x2="352" y2="216"/>
