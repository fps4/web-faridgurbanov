    <polyline points="288,201 300,201 300,96 308,96"/>
    <polyline points="288,253 300,253 300,358 308,358"/>
    <line x1="428" y1="96" x2="446" y2="96"/>
    <line x1="428" y1="358" x2="446" y2="358"/>
    <line x1="599" y1="152" x2="599" y2="164"/>
    <line x1="599" y1="302" x2="599" y2="288"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="80" y="58" font-weight="600">taxonomy</text>
    <text x="80" y="74" font-size="10.5">4 tiers, 4 regimes</text>
    <text x="80" y="124" font-weight="600">regions</text>
    <text x="80" y="140" font-size="10.5">geographies, DR pairs</text>
    <text x="80" y="190" font-weight="600">platforms</text>
    <text x="80" y="206" font-size="10.5">claims, each dated</text>
    <text x="80" y="256" font-weight="600">estate</text>
    <text x="80" y="272" font-size="10.5">31 assets, lineage</text>
    <text x="80" y="322" font-weight="600">principals</text>
    <text x="80" y="338" font-size="10.5">6 people, groups</text>
    <text x="80" y="388" font-weight="600">ledger</text>
    <text x="80" y="404" font-size="10.5">removes controls</text>

    <text x="230" y="195" font-weight="600">Engine</text>
    <text x="230" y="215" font-size="10.5">1 propagates</text>
    <text x="230" y="231" font-size="10.5">2 validates ledger</text>
    <text x="230" y="247" font-size="10.5">3 evaluates</text>
    <text x="230" y="271" font-size="10.5" font-style="italic">explain</text>

    <text x="370" y="92" font-weight="600">Unity Catalog</text>
    <text x="370" y="108" font-size="10.5">SQL and JSON</text>
    <text x="370" y="354" font-weight="600">Fabric</text>
    <text x="370" y="370" font-size="10.5">JSON and Markdown</text>

    <g text-anchor="start" font-size="11">
      <text x="464" y="60" font-size="12" font-weight="600">build/unity_catalog/</text>
      <text x="464" y="78">8 catalogs, China in a separate file</text>
      <text x="464" y="94">47 tag statements naming the source</text>
      <text x="464" y="110">22 ABAC policies, evaluated per query</text>
      <text x="464" y="126">4 Delta Shares of KPI products</text>
      <text x="464" y="142">Markdown: what SQL cannot say</text>
      <text x="464" y="322" font-size="12" font-weight="600">build/fabric/</text>
      <text x="464" y="340">6 capacities, none in China</text>
      <text x="464" y="356">20 OneLake roles, static predicates</text>
      <text x="464" y="372">26 sensitivity labels from the tier</text>
      <text x="464" y="388">4 cross-geo tenant settings, named</text>
      <text x="464" y="404">no_home.md: 4 assets in China</text>
      <text x="464" y="188" font-size="12" font-weight="600">Where the two meet</text>
      <text x="532" y="206" font-size="10" fill="#9a9aa3" letter-spacing="0.8">UNITY CATALOG</text>
      <text x="638" y="206" font-size="10" fill="#9a9aa3" letter-spacing="0.8">FABRIC</text>
      <text x="464" y="224" font-size="10.5" font-weight="600">Who</text>
      <text x="532" y="224" font-size="10.5">per-query policy</text>
      <text x="638" y="224" font-size="10.5">static role</text>
      <text x="464" y="240" font-size="10.5" font-weight="600">Export</text>
      <text x="532" y="240" font-size="10.5">refused</text>
      <text x="638" y="240" font-size="10.5">label travels</text>
      <text x="464" y="256" font-size="10.5" font-weight="600">China</text>
      <text x="532" y="256" font-size="10.5">separate account</text>
      <text x="638" y="256" font-size="10.5">no capacity</text>
      <text x="464" y="272" font-size="10.5" font-weight="600">Assistant</text>
      <text x="532" y="272" font-size="10.5">workspace setting</text>
      <text x="638" y="272" font-size="10.5">4 tenant settings</text>
    </g>

    <text x="380" y="440" font-size="11.5" font-style="italic">the same propagated state compiles to two enforcement models, and the differences</text>
    <text x="380" y="456" font-size="11.5" font-style="italic">land in a file somebody other than the author can read</text>
  </g>
</svg>
