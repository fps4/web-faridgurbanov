  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="78" y="170" font-weight="600">Gecontroleerde</text>
    <text x="78" y="186" font-weight="600">data</text>
    <text x="78" y="206" font-size="10.5">leestoegang is</text>
    <text x="78" y="220" font-size="10.5">de voordeur</text>

    <text x="311" y="60" font-weight="600">Bestandsexports, notebook-uitvoer</text>
    <text x="311" y="100" font-weight="600">Shares, shortcuts, replica's</text>
    <text x="311" y="140" font-weight="600">Back-ups, disaster recovery</text>
    <text x="311" y="180" font-weight="600">Leveranciersondersteuning, logs</text>
    <text x="311" y="244" font-weight="600">Modellen en hun endpoints</text>
    <text x="311" y="284" font-weight="600">Assistenten, per tenant-instelling</text>
    <text x="311" y="324" font-weight="600">Agents, behandeld als shares</text>

    <text x="612" y="110" font-weight="600">Een benoemde controle en eigenaar</text>
    <text x="612" y="128" font-size="10.5">voor elke uitgang, op elk platform,</text>
    <text x="612" y="144" font-size="10.5">herzien als een feature data verplaatst</text>
    <text x="612" y="254" font-weight="600">Register</text>
    <text x="612" y="272" font-size="10.5">voor de uitgangen die niemand kan controleren,</text>
    <text x="612" y="288" font-size="10.5">elk geaccepteerd door een persoon met naam</text>

    <text x="380" y="366" font-size="11.5" font-style="italic">elk verzoek wordt getoetst aan de uitgang en aan het asset, dus dezelfde persoon</text>
    <text x="380" y="382" font-size="11.5" font-style="italic">mag een tabel lezen en kan toch een export ervan geweigerd krijgen</text>
  </g>
