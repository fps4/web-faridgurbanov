    <rect x="506" y="220" width="242" height="44" rx="8"/>
    <rect x="12" y="292" width="314" height="44" rx="8"/>
    <rect x="506" y="292" width="242" height="44" rx="8" stroke-dasharray="4 3"/>
  </g>
