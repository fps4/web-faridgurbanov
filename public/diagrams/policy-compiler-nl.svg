    <rect x="190" y="40" width="136" height="224" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)">
    <line x1="162" y1="152" x2="186" y2="152"/>
    <line x1="326" y1="90" x2="350" y2="90"/>
    <line x1="326" y1="214" x2="350" y2="214"/>
    <line x1="478" y1="62" x2="502" y2="62"/>
    <line x1="478" y1="118" x2="502" y2="118"/>
    <line x1="478" y1="186" x2="502" y2="186"/>
    <line x1="478" y1="242" x2="502" y2="242"/>
    <line x1="87" y1="264" x2="87" y2="288"/>
    <polyline points="416,264 416,314 502,314" stroke-dasharray="4 3"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="87" y="118" font-weight="600">Repository</text>
    <text x="87" y="142" font-size="10.5">taxonomie van controles</text>
    <text x="87" y="158" font-size="10.5">regio's</text>
    <text x="87" y="174" font-size="10.5">principals en groepen</text>
    <text x="87" y="190" font-size="10.5">register van beslissingen</text>

    <text x="258" y="118" font-weight="600">Engine</text>
    <text x="258" y="142" font-size="10.5">propageert controles</text>
    <text x="258" y="158" font-size="10.5">valideert het register</text>
    <text x="258" y="174" font-size="10.5">beantwoordt elk verzoek</text>
    <text x="258" y="190" font-size="10.5">met de uitleg erbij</text>

    <text x="416" y="86" font-weight="600">Compiler</text>
    <text x="416" y="102" font-size="10.5">platform met tags</text>
    <text x="416" y="210" font-weight="600">Compiler</text>
    <text x="416" y="226" font-size="10.5">platform met rollen</text>

    <text x="627" y="58" font-weight="600">Platformartefacten</text>
    <text x="627" y="74" font-size="10.5">SQL-policies en tags</text>
    <text x="627" y="114" font-weight="600">Niet af te dwingen</text>
    <text x="627" y="130" font-size="10.5">gewone tekst, om mee aan de slag te gaan</text>
    <text x="627" y="182" font-weight="600">Platformartefacten</text>
    <text x="627" y="198" font-size="10.5">roldefinities en labels</text>
    <text x="627" y="238" font-weight="600">Niet af te dwingen</text>
    <text x="627" y="254" font-size="10.5">gewone tekst, om mee aan de slag te gaan</text>

    <text x="169" y="310" font-weight="600">CI-controle op afwijking</text>
    <text x="169" y="326" font-size="10.5">genereert opnieuw, laat de commit falen bij een verschil</text>
    <text x="627" y="310" font-weight="600">Geweigerd</text>
    <text x="627" y="326" font-size="10.5">alles wat een overtreding permanent maakt</text>

    <text x="380" y="370" font-size="11.5" font-style="italic">de engine evalueert het beleid één keer, los van welk platform ook;</text>
    <text x="380" y="386" font-size="11.5" font-style="italic">elke compiler schrijft de controles van zijn platform en, in dezelfde output, wat het niet kan afdwingen</text>
  </g>
