<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="134" y="24">VIER SOORTEN MENSEN</text>
    <text x="526" y="24">IN HET DOCUMENT</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="12" y="60" width="244" height="52" rx="8"/>
    <rect x="12" y="124" width="244" height="52" rx="8"/>
    <rect x="12" y="188" width="244" height="52" rx="8"/>
    <rect x="12" y="252" width="244" height="52" rx="8"/>
    <path d="M256 86H280M256 150H280M256 214H280M256 278H280M280 86V278"/>
    <rect x="304" y="40" width="444" height="320" rx="8"/>
    <rect x="338" y="194" width="376" height="38" rx="8"/>
    <rect x="338" y="240" width="376" height="38" rx="8"/>
    <rect x="338" y="286" width="376" height="38" rx="8"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="322" y="92" width="408" height="252" rx="8"/>
    <rect x="338" y="148" width="376" height="38" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="280" y1="167" x2="334" y2="167"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="134" y="82" font-weight="600">De teams die moeten veranderen</text>
    <text x="134" y="98" font-size="10.5">ruilen controle in voor afhankelijkheid</text>
    <text x="134" y="146" font-weight="600">De afdeling die moet vertrouwen</text>
    <text x="134" y="162" font-size="10.5">finance, risk, security, de zorg</text>
    <text x="134" y="210" font-weight="600">Het team wiens scope krimpt</text>
    <text x="134" y="226" font-size="10.5">kent het landschap vaak het best</text>
    <text x="134" y="274" font-weight="600">De budgethouder</text>
    <text x="134" y="290" font-size="10.5">tekende het contract waar jij uit wilt</text>

    <text x="526" y="66" font-weight="600">Teamoverstijgend ontwerp of casus</text>
    <text x="526" y="116" font-size="12.5" font-weight="600">Wie ja moest zeggen</text>
    <text x="526" y="132" font-size="10.5" font-style="italic">vier alinea's, ongeveer twintig minuten</text>

    <g text-anchor="start">
      <text x="354" y="171" font-weight="600">Stakeholders</text>
      <text x="482" y="171" font-size="10.5">wie dit kon weigeren, concreet benoemd</text>
      <text x="354" y="217" font-weight="600">De onenigheid</text>
      <text x="482" y="217" font-size="10.5">in woorden die zij zouden accepteren</text>
      <text x="354" y="263" font-weight="600">Wat het oploste</text>
      <text x="482" y="263" font-size="10.5" font-style="italic">"Finance kon de aansluiting zelf draaien"</text>
      <text x="354" y="309" font-weight="600">Wat het kostte</text>
      <text x="482" y="309" font-size="10.5">de wrijving, en wie die draagt</text>
    </g>

    <text x="380" y="390" font-size="11.5" font-style="italic">de lijst komt in elk teamoverstijgend ontwerp, waar anderen het ermee oneens kunnen zijn</text>
  </g>
</svg>
