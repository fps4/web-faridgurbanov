    <rect x="408" y="146" width="160" height="42" rx="8"/>
    <rect x="576" y="146" width="160" height="42" rx="8"/>
    <rect x="408" y="196" width="160" height="42" rx="8"/>
    <rect x="576" y="196" width="160" height="42" rx="8"/>
  </g>
  <rect x="24" y="192" width="92" height="46" rx="8" fill="none" stroke="#9a9aa3" stroke-width="1.25" stroke-dasharray="4 3"/>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="396" y="116" width="352" height="134" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)">
    <line x1="210" y1="86" x2="210" y2="112"/>
    <line x1="210" y1="162" x2="210" y2="188"/>
    <polyline points="290,215 318,215 318,90"/>
    <line x1="450" y1="86" x2="450" y2="112"/>
    <line x1="572" y1="86" x2="572" y2="112"/>
    <line x1="694" y1="86" x2="694" y2="112"/>
  </g>
  <line x1="70" y1="86" x2="70" y2="188" stroke="#9a9aa3" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="188" y="59" font-weight="600">Business</text>
    <text x="188" y="75" font-size="10.5">waits weeks for a priority</text>
    <text x="210" y="135" font-weight="600">Ticket queue</text>
    <text x="210" y="151" font-size="10.5">rations IT capacity</text>
    <text x="210" y="211" font-weight="600">IT factory</text>
    <text x="210" y="227" font-size="10.5">repetitive build work</text>
    <text x="70" y="211" font-weight="600">Shadow IT</text>
    <text x="70" y="227" font-size="10.5">the workaround</text>
    <g text-anchor="start" font-size="10.5">
      <text x="326" y="148">weeks</text>
      <text x="326" y="162">later</text>
    </g>

    <text x="450" y="59" font-weight="600">Operations</text>
    <text x="450" y="75" font-size="10.5">own reports</text>
    <text x="572" y="59" font-weight="600">Marketing</text>
    <text x="572" y="75" font-size="10.5">own pipelines</text>
    <text x="694" y="59" font-weight="600">Other teams</text>
    <text x="694" y="75" font-size="10.5">ship on their own</text>

    <text x="572" y="136" font-size="12.5" font-weight="600">IT as the platform</text>
    <text x="488" y="163" font-weight="600">Golden paths</text>
    <text x="488" y="178" font-size="10.5">secure, compliant, obvious</text>
    <text x="656" y="163" font-weight="600">Shared services</text>
    <text x="656" y="178" font-size="10.5">identity, governance, cost</text>
    <text x="488" y="213" font-weight="600">Curated tooling</text>
    <text x="488" y="228" font-size="10.5">AI and low-code</text>
    <text x="656" y="213" font-weight="600">Internal consultants</text>
    <text x="656" y="228" font-size="10.5">integration, data contracts</text>

    <text x="188" y="274" font-size="11">metric: tickets closed</text>
    <text x="572" y="274" font-size="11">metric: teams that ship independently</text>

    <text x="380" y="310" font-size="11.5" font-style="italic">a ticket queue rations IT capacity, and once teams can build, it only delays work that happens anyway;</text>
    <text x="380" y="326" font-size="11.5" font-style="italic">the platform makes the safe path the shortest route</text>
  </g>
