<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="210" y="24">BESCHRIJFT</text>
    <text x="594" y="24">VERANTWOORDT</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="20" y="190" width="380" height="120" rx="8"/>
    <rect x="470" y="98" width="248" height="50" rx="8"/>
    <rect x="470" y="190" width="248" height="50" rx="8"/>
    <rect x="20" y="334" width="720" height="40" rx="8"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="20" y="40" width="380" height="120" rx="8"/>
    <rect x="448" y="40" width="292" height="270" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="400" y1="123" x2="466" y2="123"/>
  </g>
  <g fill="#7b7b85" font-size="12.5" text-anchor="middle">
    <text x="210" y="64" font-weight="600">De kaart: high-level design (HLD)</text>
    <text x="210" y="86" font-size="11" font-style="italic">hoe ziet het systeem er nu uit?</text>
    <text x="210" y="106" font-size="10.5">doelen, context, bouwstenen, flows,</text>
    <text x="210" y="122" font-size="10.5">deployment, risico's, links naar de beslissingen</text>
    <text x="210" y="146" font-size="11">verandert een paar keer per jaar</text>

    <text x="210" y="214" font-weight="600">Het detail: low-level design (LLD)</text>
    <text x="210" y="236" font-size="10.5">binnenkant van componenten, API-contracten, schema's</text>
    <text x="210" y="256" font-size="10.5">als code: OpenAPI- en AsyncAPI-specs, schemabestanden,</text>
    <text x="210" y="272" font-size="10.5">infrastructure as code, contracttests</text>
    <text x="210" y="296" font-size="11">verandert wekelijks</text>

    <text x="433" y="115" font-size="10.5">links</text>

    <text x="594" y="64" font-weight="600">Het logboek: ADR's</text>
    <text x="594" y="82" font-size="10.5">één per beslissing die duur is om terug te draaien</text>
    <text x="594" y="119" font-size="12" font-weight="600">events tussen domeinen</text>
    <text x="594" y="135" font-size="10.5">een beslissing over de vorm</text>
    <text x="594" y="211" font-size="12" font-weight="600">optimistic locking</text>
    <text x="594" y="227" font-size="10.5">een beslissing in het detail</text>
    <text x="594" y="268" font-size="10.5">er komt alleen iets bij; een gewijzigde beslissing</text>
    <text x="594" y="284" font-size="10.5">krijgt een nieuw record dat terugverwijst</text>

    <text x="380" y="359" font-size="11">in de repository, naast de code · beoordeeld via pull requests · diagrammen als code</text>

    <text x="380" y="406" font-size="11.5" font-style="italic">de kaart beschrijft, het logboek verantwoordt, en voor wat wekelijks verandert is het contract in code het ontwerp</text>
  </g>
</svg>
