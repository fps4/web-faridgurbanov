<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="80" y="24">ADOPTIE</text>
    <text x="230" y="24">SCHATTING</text>
    <text x="380" y="24">KOSTEN</text>
    <text x="530" y="24">OPRICHTERS</text>
    <text x="680" y="24">ARBEIDSMARKT</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="10" y="36" width="140" height="98" rx="8"/>
    <rect x="160" y="36" width="140" height="98" rx="8"/>
    <rect x="460" y="36" width="140" height="98" rx="8"/>
    <rect x="610" y="36" width="140" height="98" rx="8"/>
    <rect x="390" y="172" width="360" height="124" rx="8"/>
    <path d="M80 134V150M230 134V150M380 134V150M530 134V150M680 134V150M80 150H680"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="310" y="36" width="140" height="98" rx="8"/>
    <rect x="10" y="172" width="360" height="124" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="190" y1="150" x2="190" y2="168"/>
    <line x1="570" y1="150" x2="570" y2="168"/>
  </g>
  <g fill="#7b7b85" font-size="10.5" text-anchor="middle">
    <g font-size="14" font-weight="600">
      <text x="80" y="62">90%</text>
      <text x="230" y="62">tot 45%</text>
      <text x="380" y="62">280 keer</text>
      <text x="530" y="62">38%</text>
      <text x="680" y="62">−27,5%</text>
    </g>
    <text x="80" y="84">van de teams gebruikt</text>
    <text x="80" y="100">AI-codeertools</text>
    <text x="80" y="120">61% een jaar eerder</text>
    <text x="230" y="84">winst uit AI</text>
    <text x="230" y="100">en low-code</text>
    <text x="230" y="120">McKinsey-onderzoek</text>
    <text x="380" y="84">$20 → $0,07</text>
    <text x="380" y="100">per miljoen tokens</text>
    <text x="380" y="120">nov 2022 tot okt 2024</text>
    <text x="530" y="84">van de startups solo,</text>
    <text x="530" y="100">zonder durfkapitaal</text>
    <text x="530" y="120">22,2% in 2015</text>
    <text x="680" y="84">werkgelegenheid</text>
    <text x="680" y="100">programmeurs in de VS</text>
    <text x="680" y="120">2023 tot 2025</text>

    <text x="190" y="198" font-size="12.5" font-weight="600">Wat ze samen betekenen</text>
    <text x="190" y="222">de kostenlijn is degene die ertoe doet:</text>
    <text x="190" y="238">280 keer goedkoper is een categoriewissel</text>
    <text x="190" y="260">automatiseren is geen begrotingspost meer</text>
    <text x="190" y="276">de vloer onder een functionerend productteam zakte weg</text>

    <text x="570" y="198" font-size="12.5" font-weight="600">Wat ze weglaten</text>
    <text x="570" y="218">gemeten op het deel dat al het snelste was</text>
    <text x="570" y="238">levering wordt begrensd door twintig teams met een mening,</text>
    <text x="570" y="254">de beslissing zonder eigenaar, het datacontract zonder</text>
    <text x="570" y="270">eigenaar bovenstrooms, het vier jaar oude</text>
    <text x="570" y="286">leverancierscontract dat niemand wil openbreken</text>

    <text x="380" y="326" font-size="11.5" font-style="italic">de kosten van de intelligentie daalden met een factor 280;</text>
    <text x="380" y="342" font-size="11.5" font-style="italic">de kosten om een verandering door de organisatie te krijgen bewogen niet</text>
  </g>
