<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="78" y="24">DATA</text>
    <text x="311" y="24">EXITS, PER PLATFORM</text>
    <text x="311" y="212">NEW WITH AI</text>
    <text x="612" y="24">CONTROLLED OR ACCEPTED</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="186" y="40" width="250" height="32" rx="8"/>
    <rect x="186" y="80" width="250" height="32" rx="8"/>
    <rect x="186" y="120" width="250" height="32" rx="8"/>
    <rect x="186" y="160" width="250" height="32" rx="8"/>
    <rect x="186" y="224" width="250" height="32" rx="8"/>
    <rect x="186" y="264" width="250" height="32" rx="8"/>
    <rect x="186" y="304" width="250" height="32" rx="8"/>
    <rect x="476" y="84" width="272" height="72" rx="8"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="12" y="40" width="132" height="296" rx="8"/>
    <rect x="476" y="228" width="272" height="72" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <line x1="436" y1="56" x2="452" y2="56"/>
    <line x1="436" y1="96" x2="452" y2="96"/>
    <line x1="436" y1="136" x2="452" y2="136"/>
    <line x1="436" y1="176" x2="452" y2="176"/>
    <line x1="436" y1="240" x2="452" y2="240"/>
    <line x1="436" y1="280" x2="452" y2="280"/>
    <line x1="436" y1="320" x2="452" y2="320"/>
    <line x1="452" y1="56" x2="452" y2="320"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)">
    <line x1="144" y1="56" x2="182" y2="56"/>
    <line x1="144" y1="96" x2="182" y2="96"/>
    <line x1="144" y1="136" x2="182" y2="136"/>
    <line x1="144" y1="176" x2="182" y2="176"/>
    <line x1="144" y1="240" x2="182" y2="240"/>
    <line x1="144" y1="280" x2="182" y2="280"/>
    <line x1="144" y1="320" x2="182" y2="320"/>
    <line x1="452" y1="120" x2="472" y2="120"/>
    <line x1="452" y1="264" x2="472" y2="264" stroke-dasharray="4 3"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="78" y="178" font-weight="600">Controlled data</text>
    <text x="78" y="198" font-size="10.5">read access is</text>
    <text x="78" y="212" font-size="10.5">the front door</text>

    <text x="311" y="60" font-weight="600">File exports, notebook output</text>
    <text x="311" y="100" font-weight="600">Shares, shortcuts, replicas</text>
    <text x="311" y="140" font-weight="600">Backups, disaster recovery</text>
    <text x="311" y="180" font-weight="600">Vendor support access, logs</text>
    <text x="311" y="244" font-weight="600">Models and their endpoints</text>
    <text x="311" y="284" font-weight="600">Assistants, by tenant setting</text>
    <text x="311" y="324" font-weight="600">Agents, treated as shares</text>

    <text x="612" y="110" font-weight="600">A named control and owner</text>
    <text x="612" y="128" font-size="10.5">for each exit, on each platform,</text>
    <text x="612" y="144" font-size="10.5">reviewed when a feature moves data</text>
    <text x="612" y="254" font-weight="600">Register</text>
    <text x="612" y="272" font-size="10.5">for the exits nobody can control,</text>
    <text x="612" y="288" font-size="10.5">with a named person accepting each</text>

    <text x="380" y="366" font-size="11.5" font-style="italic">each request is evaluated against the exit as well as the asset, so the same person</text>
    <text x="380" y="382" font-size="11.5" font-style="italic">can be allowed to read a table and refused an export of it</text>
  </g>
