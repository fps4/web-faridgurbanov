<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="87" y="24">POLICY AS DATA</text>
    <text x="258" y="24">ENGINE</text>
    <text x="416" y="24">COMPILERS</text>
    <text x="627" y="24">OUTPUT</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="354" y="40" width="124" height="100" rx="8"/>
    <rect x="354" y="164" width="124" height="100" rx="8"/>
    <rect x="506" y="40" width="242" height="44" rx="8"/>
    <rect x="506" y="96" width="242" height="44" rx="8"/>
    <rect x="506" y="164" width="242" height="44" rx="8"/>
    <rect x="506" y="220" width="242" height="44" rx="8"/>
    <rect x="12" y="292" width="314" height="44" rx="8"/>
    <rect x="506" y="292" width="242" height="44" rx="8" stroke-dasharray="4 3"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="12" y="40" width="150" height="224" rx="8"/>
    <rect x="190" y="40" width="136" height="224" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)">
    <line x1="162" y1="152" x2="186" y2="152"/>
    <line x1="326" y1="90" x2="350" y2="90"/>
    <line x1="326" y1="214" x2="350" y2="214"/>
    <line x1="478" y1="62" x2="502" y2="62"/>
    <line x1="478" y1="118" x2="502" y2="118"/>
    <line x1="478" y1="186" x2="502" y2="186"/>
    <line x1="478" y1="242" x2="502" y2="242"/>
    <line x1="87" y1="264" x2="87" y2="288"/>
    <polyline points="416,264 416,314 502,314" stroke-dasharray="4 3"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="87" y="118" font-weight="600">Policy repository</text>
    <text x="87" y="142" font-size="10.5">taxonomy of controls</text>
    <text x="87" y="158" font-size="10.5">regions</text>
    <text x="87" y="174" font-size="10.5">principals and groups</text>
    <text x="87" y="190" font-size="10.5">ledger of removals</text>

    <text x="258" y="118" font-weight="600">Engine</text>
    <text x="258" y="142" font-size="10.5">propagates controls</text>
    <text x="258" y="158" font-size="10.5">validates the ledger</text>
    <text x="258" y="174" font-size="10.5">answers each request</text>
    <text x="258" y="190" font-size="10.5">with the explanation</text>

    <text x="416" y="86" font-weight="600">Compiler</text>
    <text x="416" y="102" font-size="10.5">tag-based platform</text>
    <text x="416" y="210" font-weight="600">Compiler</text>
    <text x="416" y="226" font-size="10.5">role-based platform</text>

    <text x="627" y="58" font-weight="600">Platform artefacts</text>
    <text x="627" y="74" font-size="10.5">SQL policies and tags</text>
    <text x="627" y="114" font-weight="600">Cannot enforce</text>
    <text x="627" y="130" font-size="10.5">plain text, for someone to act on</text>
    <text x="627" y="182" font-weight="600">Platform artefacts</text>
    <text x="627" y="198" font-size="10.5">role definitions and labels</text>
    <text x="627" y="238" font-weight="600">Cannot enforce</text>
    <text x="627" y="254" font-size="10.5">plain text, for someone to act on</text>

    <text x="169" y="310" font-weight="600">CI drift check</text>
    <text x="169" y="326" font-size="10.5">regenerates the artefacts, fails the commit on a mismatch</text>
    <text x="627" y="310" font-weight="600">Refused to emit</text>
    <text x="627" y="326" font-size="10.5">anything that makes a violation permanent</text>

    <text x="380" y="370" font-size="11.5" font-style="italic">the engine evaluates the policy once, independent of any platform;</text>
    <text x="380" y="386" font-size="11.5" font-style="italic">each compiler writes its platform's controls and, in the same output, what it cannot enforce</text>
  </g>
</svg>
