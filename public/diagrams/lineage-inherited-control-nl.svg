<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="82" y="24">BRONNEN</text>
    <text x="470" y="24">AFGELEIDE ASSETS ERVEN ELKE CONTROLE</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="12" y="44" width="140" height="48" rx="8"/>
    <rect x="12" y="124" width="140" height="48" rx="8"/>
    <rect x="192" y="84" width="140" height="48" rx="8"/>
    <rect x="372" y="44" width="140" height="48" rx="8"/>
    <rect x="372" y="124" width="140" height="48" rx="8"/>
    <rect x="552" y="44" width="196" height="48" rx="8"/>
    <rect x="552" y="124" width="196" height="48" rx="8"/>
    <rect x="192" y="208" width="140" height="48" rx="8" stroke-dasharray="4 3"/>
  </g>
  <rect x="372" y="208" width="376" height="104" rx="8" fill="none" stroke="#7b7b85" stroke-width="2"/>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none" marker-end="url(#ah)">
    <line x1="152" y1="68" x2="188" y2="100"/>
    <line x1="152" y1="148" x2="188" y2="116"/>
    <line x1="332" y1="100" x2="368" y2="72"/>
    <line x1="332" y1="116" x2="368" y2="144"/>
    <line x1="512" y1="68" x2="548" y2="68"/>
    <line x1="512" y1="148" x2="548" y2="148"/>
    <line x1="530" y1="208" x2="530" y2="152"/>
    <line x1="262" y1="208" x2="262" y2="136" stroke-dasharray="4 3"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="82" y="64" font-weight="600">Brontabel</text>
    <text x="82" y="80" font-size="10.5">declareert controle A</text>
    <text x="82" y="144" font-weight="600">Brontabel</text>
    <text x="82" y="160" font-size="10.5">declareert controle B</text>

    <text x="262" y="104" font-weight="600">Gejoinde tabel</text>
    <text x="262" y="120" font-size="10.5">erft A, B</text>
    <text x="442" y="64" font-weight="600">Featureset</text>
    <text x="442" y="80" font-size="10.5">erft A, B</text>
    <text x="442" y="144" font-weight="600">Aggregaat</text>
    <text x="442" y="160" font-size="10.5">erft A, B</text>
    <text x="650" y="64" font-weight="600">Model en endpoint</text>
    <text x="650" y="80" font-size="10.5">erven A, B</text>
    <text x="650" y="144" font-weight="600">Gedeclassificeerd product</text>
    <text x="650" y="160" font-size="10.5">draagt B</text>

    <text x="538" y="190" font-size="10.5" text-anchor="start">haalt A weg</text>

    <text x="262" y="228" font-weight="600">Classificatie</text>
    <text x="262" y="244" font-size="10.5">de loader weigert haar</text>

    <text x="560" y="232" font-weight="600">Registerinvoer</text>
    <text x="560" y="252" font-size="10.5">asset, wat ze weghaalt, de grond, wie besliste,</text>
    <text x="560" y="268" font-size="10.5">wanneer ze verloopt, of ze stroomafwaarts geldt</text>
    <text x="560" y="288" font-size="10.5">regel als grond: getoetst, geweigerd als die niet klopt</text>
    <text x="560" y="304" font-size="10.5">beoordeling of oordeel: vastgelegd, met de vervaldatum</text>

    <text x="380" y="342" font-size="11.5" font-style="italic">classificatie komt alleen binnen bij een bron; alleen een registerinvoer haalt een controle weg;</text>
    <text x="380" y="358" font-size="11.5" font-style="italic">tags op het platform worden uit deze toestand gegenereerd</text>
  </g>
</svg>
