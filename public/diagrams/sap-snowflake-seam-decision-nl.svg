<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="120" y="24">SAP</text>
    <text x="380" y="24">DE GRENS</text>
    <text x="640" y="24">SNOWFLAKE</text>
  </g>
  <rect x="244" y="34" width="272" height="332" rx="8" fill="none" stroke="#7b7b85" stroke-width="2"/>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="12" y="44" width="216" height="50" rx="8"/>
    <rect x="12" y="104" width="216" height="50" rx="8"/>
    <rect x="12" y="164" width="216" height="50" rx="8"/>
    <rect x="12" y="224" width="216" height="72" rx="8"/>
    <rect x="12" y="306" width="216" height="50" rx="8"/>
    <rect x="532" y="44" width="216" height="50" rx="8"/>
    <rect x="532" y="104" width="216" height="50" rx="8"/>
    <rect x="532" y="164" width="216" height="50" rx="8"/>
    <rect x="532" y="224" width="216" height="72" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="228" y1="69" x2="528" y2="69"/>
    <line x1="228" y1="129" x2="528" y2="129"/>
    <line x1="228" y1="252" x2="528" y2="252"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-start="url(#ah)" marker-end="url(#ah)">
    <line x1="232" y1="189" x2="528" y2="189"/>
    <line x1="232" y1="268" x2="528" y2="268"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25">
    <line x1="228" y1="331" x2="300" y2="331" stroke-dasharray="4 3"/>
    <line x1="300" y1="323" x2="300" y2="339"/>
  </g>
  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="120" y="65" font-weight="600">SAP-dataproduct</text>
    <text x="120" y="81" font-size="10.5">door SAP geleverd, outbound</text>
    <text x="120" y="125" font-weight="600">SAP-object</text>
    <text x="120" y="141" font-size="10.5">kan een delta leveren</text>
    <text x="120" y="185" font-weight="600">Bron antwoordt</text>
    <text x="120" y="201" font-size="10.5">draagt elke keer de last</text>
    <text x="120" y="256" font-weight="600">Eén object</text>
    <text x="120" y="272" font-size="10.5">twee workloads</text>
    <text x="120" y="327" font-weight="600">Modelleren in SAP</text>
    <text x="120" y="343" font-size="10.5">rapporteren in SAP Analytics Cloud</text>

    <text x="380" y="61" font-weight="600">Delen</text>
    <text x="380" y="85" font-size="10.5">zero-copy via Delta Sharing</text>
    <text x="380" y="121" font-weight="600">Repliceren</text>
    <text x="380" y="145" font-size="10.5">Datasphere-replicatieflow</text>
    <text x="380" y="181" font-weight="600">Federeren</text>
    <text x="380" y="205" font-size="10.5">remote table, query pushdown</text>
    <text x="380" y="243" font-weight="600">Hybride</text>
    <text x="380" y="286" font-size="10.5">repliceer het aggregaat, federeer de drill-down</text>
    <text x="398" y="335" font-weight="600">In SAP houden</text>
    <text x="380" y="355" font-size="10.5">gebonden door residentie en persoonsgegevens</text>

    <text x="640" y="65" font-weight="600">Gelezen waar het staat</text>
    <text x="640" y="81" font-size="10.5">je betaalt consumer compute</text>
    <text x="640" y="125" font-weight="600">Tweede kopie in rust</text>
    <text x="640" y="141" font-size="10.5">zo vers als de laatste run</text>
    <text x="640" y="185" font-weight="600">Resultaat is actueel</text>
    <text x="640" y="201" font-size="10.5">warehouse bewaart vrijwel niets</text>
    <text x="640" y="256" font-weight="600">Dashboard op een kopie</text>
    <text x="640" y="272" font-size="10.5">zeldzame drill-down gefedereerd</text>

    <text x="380" y="392" font-size="11.5" font-style="italic">elk object gaat op een van vijf manieren over, en de beslissingen die ertoe doen zitten op de grens;</text>
    <text x="380" y="408" font-size="11.5" font-style="italic">de grens loopt ook terug, met Snowflake als bron voor Datasphere</text>
  </g>
</svg>
