  <g fill="#7b7b85" font-size="12" text-anchor="middle">
    <text x="380" y="29" font-weight="600">Synapse-landschap</text>
    <text x="380" y="44" font-size="10.5">20 workloads</text>

    <g font-size="10.5">
      <text x="194" y="66">R1 tot en met R5: constraints geven redenen, nooit een getal</text>
      <text x="491" y="66">eerste prijs</text>
      <text x="602" y="66">toetsen van het geheel</text>
      <text x="714" y="66">adviserend</text>
    </g>

    <g font-size="11" font-weight="600">
      <text x="46" y="103">R1</text>
      <text x="120" y="103">R2</text>
      <text x="195" y="103">R3</text>
      <text x="269" y="103">R4</text>
      <text x="343" y="103">R5</text>
      <text x="417" y="103">R6</text>
      <text x="491" y="103">R7</text>
      <text x="566" y="103">R8</text>
      <text x="640" y="103">R9</text>
      <text x="714" y="103">R10</text>
    </g>
    <g font-size="10.5">
      <text x="46" y="119">residentie</text>
      <text x="120" y="119">T-SQL</text>
      <text x="195" y="119">streaming</text>
      <text x="269" y="119">telemetrie</text>
      <text x="343" y="119">ML</text>
      <text x="417" y="119">Direct Lake</text>
      <text x="491" y="119">economie</text>
      <text x="566" y="119">trederand</text>
      <text x="640" y="119">portfolio</text>
      <text x="714" y="119">lokaliteit</text>
    </g>

    <text x="97" y="183" font-weight="600">Fabric</text>
    <text x="97" y="199" font-size="10.5">15 workloads</text>
    <text x="279" y="183" font-weight="600">Databricks</text>
    <text x="279" y="199" font-size="10.5">4 workloads</text>
    <text x="466" y="183" font-weight="600">Snowflake</text>
    <text x="466" y="199" font-size="10.5">wint niets</text>
    <text x="658" y="183" font-weight="600">Geen bestemming</text>
    <text x="658" y="199" font-size="10.5">1 workload</text>

    <text x="466" y="250" font-weight="600">Goedkoopste meter</text>
    <text x="466" y="265" font-size="10.5">op 5 van de 20 workloads</text>
    <text x="466" y="310" font-weight="600">R2 sluit er 4 uit</text>
    <text x="466" y="325" font-size="10.5">geschreven in T-SQL</text>
    <text x="466" y="370" font-weight="600">1 op betaalde capaciteit</text>
    <text x="466" y="385" font-size="10.5">geen meter biedt onder €0</text>

    <text x="658" y="252" font-weight="600">Event-time-herziening</text>
    <text x="658" y="267" font-size="10.5">sluit Fabric</text>
    <text x="658" y="281" font-size="10.5">en Snowflake uit</text>
    <text x="658" y="326" font-weight="600">Restricted-classificatie</text>
    <text x="658" y="341" font-size="10.5">alleen goedgekeurd voor</text>
    <text x="658" y="355" font-size="10.5">Fabric: sluit Databricks uit</text>

    <g font-size="11.5" font-style="italic" text-anchor="start">
      <text x="12" y="262">het platform met de beste prijs</text>
      <text x="12" y="278">werd uitgesloten van vier van de</text>
      <text x="12" y="294">vijf workloads waar het die prijs had;</text>
      <text x="12" y="320">één stream heeft op geen van</text>
      <text x="12" y="336">de drie platformen een bestemming</text>
    </g>
