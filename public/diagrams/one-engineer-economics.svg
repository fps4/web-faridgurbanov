<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa3"/>
    </marker>
  </defs>
  <g fill="#9a9aa3" font-size="10" text-anchor="middle" letter-spacing="0.8">
    <text x="80" y="24">ADOPTION</text>
    <text x="230" y="24">ESTIMATE</text>
    <text x="380" y="24">COST</text>
    <text x="530" y="24">FOUNDERS</text>
    <text x="680" y="24">LABOUR MARKET</text>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" fill="none">
    <rect x="10" y="36" width="140" height="98" rx="8"/>
    <rect x="160" y="36" width="140" height="98" rx="8"/>
    <rect x="460" y="36" width="140" height="98" rx="8"/>
    <rect x="610" y="36" width="140" height="98" rx="8"/>
    <rect x="390" y="172" width="360" height="124" rx="8"/>
    <path d="M80 134V150M230 134V150M380 134V150M530 134V150M680 134V150M80 150H680"/>
  </g>
  <g stroke="#7b7b85" stroke-width="2" fill="none">
    <rect x="310" y="36" width="140" height="98" rx="8"/>
    <rect x="10" y="172" width="360" height="124" rx="8"/>
  </g>
  <g stroke="#9a9aa3" stroke-width="1.25" marker-end="url(#ah)">
    <line x1="190" y1="150" x2="190" y2="168"/>
    <line x1="570" y1="150" x2="570" y2="168"/>
  </g>
  <g fill="#7b7b85" font-size="10.5" text-anchor="middle">
    <g font-size="14" font-weight="600">
      <text x="80" y="62">90%</text>
      <text x="230" y="62">up to 45%</text>
      <text x="380" y="62">280-fold</text>
      <text x="530" y="62">38%</text>
      <text x="680" y="62">−27.5%</text>
    </g>
    <text x="80" y="84">of teams use AI</text>
    <text x="80" y="100">coding tools</text>
    <text x="80" y="120">61% a year earlier</text>
    <text x="230" y="84">improvement from</text>
    <text x="230" y="100">AI and low-code</text>
    <text x="230" y="120">McKinsey research</text>
    <text x="380" y="84">$20 → $0.07</text>
    <text x="380" y="100">per million tokens</text>
    <text x="380" y="120">Nov 2022 to Oct 2024</text>
    <text x="530" y="84">of startups solo,</text>
    <text x="530" y="100">no venture capital</text>
    <text x="530" y="120">22.2% in 2015</text>
    <text x="680" y="84">US programmer</text>
    <text x="680" y="100">employment</text>
    <text x="680" y="120">2023 to 2025</text>

    <text x="190" y="198" font-size="12.5" font-weight="600">What they add up to</text>
    <text x="190" y="222">the cost line is the one that matters:</text>
    <text x="190" y="238">a 280-fold price drop is a change of category</text>
    <text x="190" y="260">automating stops being a budget line</text>
    <text x="190" y="276">the floor under a functioning product team dropped</text>

    <text x="570" y="198" font-size="12.5" font-weight="600">What they leave out</text>
    <text x="570" y="218">measured on the part that was already fastest</text>
    <text x="570" y="238">delivery is limited by twenty teams with an opinion,</text>
    <text x="570" y="254">the decision nobody will own, the data contract</text>
    <text x="570" y="270">with no upstream owner, the four-year-old vendor</text>
    <text x="570" y="286">agreement nobody wants to reopen</text>

    <text x="380" y="326" font-size="11.5" font-style="italic">the cost of the intelligence fell 280-fold; the cost of getting a change through the organisation did not move</text>
  </g>
</svg>
