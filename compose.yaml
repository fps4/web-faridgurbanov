services:

  # ----------------------------------------
  # Web Application
  # ----------------------------------------
  # NOTE: Please note that translation to other languages
  # is done by manually running "node ./scripts/translate-content.js"
  frontend:
    container_name: personal-website
    build:
      context: src/
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CHATBOT_URL: ${NEXT_PUBLIC_CHATBOT_URL}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        GH_PACKAGES_TOKEN: ${GH_PACKAGES_TOKEN}
        NEXT_PUBLIC_CHATBOT_TENANT_ID: ${NEXT_PUBLIC_CHATBOT_TENANT_ID}
        NEXT_PUBLIC_CHATBOT_API_BASE_URL: ${NEXT_PUBLIC_CHATBOT_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "3034:3033"
    networks:
      - default      
      - net-public

networks:
  net-public:
    external: true
    name: net-public
